<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>夜の投稿 - yami</title>
	<style>
		:root{
			--bg:#0b0b0c;
			--card:#0f0f11;
			--muted:#9b9b9b;
			--accent:#7a2b2b;
			--glass: rgba(255,255,255,0.03);
			color-scheme: dark;
		}
		html,body{height:100%;margin:0;background:linear-gradient(180deg,#050506 0%, #0b0b0c 60%);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial}
		.wrap{max-width:900px;margin:40px auto;padding:24px}
		header{display:flex;align-items:center;gap:16px}
		h1{margin:0;font-size:28px;color:#fff;letter-spacing:1px}
		p.lead{color:var(--muted);margin:6px 0 18px}
		.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
		.card{background:var(--card);border:1px solid rgba(255,255,255,0.03);padding:16px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.6);transition:transform .18s ease}
		.card:hover{transform:translateY(-6px)}
		.title{color:#fff;font-weight:600;margin:0 0 6px}
		.meta{color:var(--muted);font-size:13px;margin-bottom:10px}
		a.post-link{text-decoration:none}
		footer{color:var(--muted);font-size:13px;margin-top:28px}
		.new-post{display:inline-block;padding:8px 12px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);color:var(--muted);text-decoration:none}
		.note{margin-top:12px;color:var(--muted);font-size:13px}
	</style>
</head>
<body>
	<div class="wrap">
		<header>
			<div>
				<h1>夜の投稿 · yami</h1>
				<p class="lead">暗めの短文を気軽に投稿する場所。投稿は `posts/` に `.md` または `.txt` を置くだけで反映されます。</p>
			</div>
		</header>

		<section id="posts">
			<!-- GENERATED_POSTS -->
      <div class="grid">
        <div class="card">
          <a class="post-link" href="posts/sample.html">
            <div class="title">sample</div>
            <div class="meta">txt</div>
            <div class="excerpt" style="color:var(--muted)">終わりが欲しいわけじゃない。</div>
          </a>
        </div>

        <div class="card">
          <a class="post-link" href="posts/2025-10-13-notitle-[notitle].html">
            
            <div class="meta">2025-10-13</div>
            <div class="excerpt" style="color:var(--muted)">![夜の街](night.jpg)</div>
          </a>
        </div>

        <div class="card">
          <a class="post-link" href="posts/2025-10-12-sample.html">
            <div class="title">sample</div>
            <div class="meta">md</div>
            <div class="excerpt" style="color:var(--muted)"># 夜明けは来ない</div>
          </a>
        </div>
      </div>
      <!-- /GENERATED_POSTS -->
		</section>

		<footer>
			<a class="new-post" href="#posts">投稿は `posts/` にファイルを追加してください</a>
			<div class="note">公開: GitHub Pages でそのまま公開できます。`npm run build` で一覧を再生成します。</div>
		</footer>
	</div>
</body>
</html>
