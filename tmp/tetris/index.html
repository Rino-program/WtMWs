<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Tetris - テトリス</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="game-container">
<div class="main-board">
<h1>🎮 テトリス</h1>
<div class="board-wrapper">
<canvas id="board" width="300" height="600"></canvas>
<div id="actionText" class="action-text"></div>
</div>
</div>
<div class="side-panel">
<div class="panel">
<h3>スコア</h3>
<div class="panel-value" id="score">0</div>
</div>
<div class="panel">
<h3>レベル</h3>
<div class="panel-value" id="level">1</div>
<div class="level-indicator">
<div class="level-bar"><div class="level-fill" id="levelBar"></div></div>
</div>
</div>
<div class="panel">
<h3>ライン</h3>
<div class="panel-value" id="lines">0</div>
</div>
<div class="panel combo-panel">
<div class="combo-item">
<span>コンボ</span>
<span class="panel-value-small" id="combo">-</span>
</div>
<div class="combo-item">
<span>B2B</span>
<span class="panel-value-small" id="b2b">-</span>
</div>
</div>
<div class="panel">
<h3>次のブロック</h3>
<canvas id="next" class="next-canvas" width="120" height="80"></canvas>
</div>
<div class="panel">
<h3>ホールド</h3>
<canvas id="hold" class="next-canvas" width="120" height="80"></canvas>
</div>
<div class="controls">
<button id="startBtn">▶ スタート</button>
<button id="pauseBtn" disabled>⏸ 一時停止</button>
</div>
</div>
</div>
<div class="touch-controls">
<div class="touch-pad">
<div class="touch-btn" data-action="hold">📦</div>
<div class="touch-btn" data-action="rotateCCW">↺</div>
<div class="touch-btn" data-action="up">⬆</div>
<div class="touch-btn" data-action="rotate">↻</div>
<div class="touch-btn" data-action="drop">⬇⬇</div>
<div class="touch-btn" data-action="left">⬅</div>
<div class="touch-btn" data-action="down">⬇</div>
<div class="touch-btn" data-action="down">⬇</div>
<div class="touch-btn" data-action="right">➡</div>
<div class="touch-btn" data-action="drop">💨</div>
</div>
</div>
<div class="overlay" id="overlay">
<h2 id="overlayTitle">テトリス</h2>
<p id="overlayScore"></p>
<p id="overlayLines"></p>
<button id="overlayBtn">スタート</button>
</div>
<script src="script.js"></script>
</body>
</html>
