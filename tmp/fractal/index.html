<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フラクタルエクスプローラー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="loading" id="loading">🌀 レンダリング中...</div>
    <div class="controls">
        <h3>🌀 フラクタル設定</h3>
        <div class="control-group">
            <label>フラクタルタイプ</label>
            <select id="fractalType">
                <option value="mandelbrot">マンデルブロ集合</option>
                <option value="julia">ジュリア集合</option>
                <option value="burningship">バーニングシップ</option>
                <option value="tricorn">トリコーン</option>
            </select>
        </div>
        <div class="control-group">
            <label>カラースキーム</label>
            <select id="colorScheme">
                <option value="rainbow">レインボー</option>
                <option value="fire">ファイアー</option>
                <option value="ocean">オーシャン</option>
                <option value="purple">パープル</option>
                <option value="neon">ネオン</option>
            </select>
        </div>
        <div class="control-group">
            <label>反復回数: <span id="iterVal">80</span></label>
            <input type="range" id="iterations" min="30" max="300" value="80">
        </div>
        <div class="control-group">
            <label>色相: <span id="hueOffsetVal">0</span></label>
            <input type="range" id="hueOffset" min="0" max="360" value="0">
        </div>
        <div>
            <button class="btn" id="reset">リセット</button>
            <button class="btn" id="save">保存</button>
            <button class="btn" id="animate">アニメ</button>
        </div>
    </div>
    <a href="../" class="back-link">← 戻る</a>
    <div class="info" id="info">クリック:ズームイン | 右クリック:アウト | ホイール:ズーム</div>

    <script src="script.js"></script>
</body>
</html>
