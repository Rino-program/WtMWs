<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notes - メモ帳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
.app{display:flex;height:100vh}
.sidebar{width:280px;background:rgba(0,0,0,0.4);padding:20px;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.1)}
.sidebar h1{font-size:1.3rem;margin-bottom:20px;margin-top:30px;background:linear-gradient(90deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.new-note-btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:12px;border-radius:10px;cursor:pointer;font-size:0.95rem;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.search{position:relative;margin-bottom:20px}
.search input{width:100%;padding:12px 12px 12px 40px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:0.9rem}
.search input::placeholder{color:#666}
.search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:0.9rem}
.notes-list{flex:1;overflow-y:auto}
.note-item{padding:15px;background:rgba(255,255,255,0.05);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;border-left:3px solid transparent}
.note-item:hover{background:rgba(255,255,255,0.1)}
.note-item.active{border-left-color:#667eea;background:rgba(102,126,234,0.15)}
.note-item h3{font-size:0.95rem;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item p{font-size:0.8rem;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item .note-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:0.7rem;color:#666}
.note-item .delete-btn{opacity:0;background:none;border:none;color:#f5576c;cursor:pointer;font-size:1rem;transition:opacity 0.2s}
.note-item:hover .delete-btn{opacity:1}
.editor{flex:1;display:flex;flex-direction:column;padding:20px}
.editor-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:15px}
.editor-header input{background:transparent;border:none;color:#fff;font-size:1.5rem;font-weight:bold;width:100%;outline:none}
.editor-header input::placeholder{color:#444}
.editor-actions{display:flex;gap:10px}
.editor-actions button{background:rgba(255,255,255,0.08);border:none;color:#aaa;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:0.85rem}
.editor-actions button:hover{background:rgba(255,255,255,0.15);color:#fff}
.editor-toolbar{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap}
.editor-toolbar button{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#aaa;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:0.85rem}
.editor-toolbar button:hover{background:rgba(255,255,255,0.1);color:#fff}
.editor-toolbar button.active{background:rgba(102,126,234,0.3);color:#667eea;border-color:#667eea}
.editor-content{flex:1;overflow-y:auto}
.editor-content textarea{width:100%;height:100%;background:transparent;border:none;color:#ddd;font-size:1rem;line-height:1.8;resize:none;outline:none;font-family:'Segoe UI',sans-serif}
.editor-content textarea::placeholder{color:#444}
.tags{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.tag{background:rgba(102,126,234,0.2);color:#667eea;padding:4px 12px;border-radius:15px;font-size:0.75rem;display:flex;align-items:center;gap:5px}
.tag button{background:none;border:none;color:#667eea;cursor:pointer;font-size:0.9rem}
.add-tag{background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.2);color:#666;padding:4px 12px;border-radius:15px;font-size:0.75rem;cursor:pointer}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666}
.empty-state .icon{font-size:4rem;margin-bottom:20px;opacity:0.5}
.empty-state p{font-size:1rem}
.stats{padding:15px;border-top:1px solid rgba(255,255,255,0.1);margin-top:auto}
.stats p{font-size:0.75rem;color:#666}
@media(max-width:768px){
.sidebar{width:100%;position:fixed;bottom:0;height:auto;max-height:50vh;border-radius:20px 20px 0 0;z-index:50}
.editor{padding:60px 20px 200px}
}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="app">
<div class="sidebar">
<h1>📝 メモ帳</h1>
<button class="new-note-btn" onclick="createNote()">➕ 新しいメモ</button>
<div class="search">
<input type="text" id="searchInput" placeholder="メモを検索..." oninput="filterNotes()">
</div>
<div class="notes-list" id="notesList"></div>
<div class="stats">
<p id="statsText">0件のメモ</p>
</div>
</div>
<div class="editor" id="editor">
<div class="empty-state" id="emptyState">
<div class="icon">📝</div>
<p>メモを選択するか、新しく作成してください</p>
</div>
<div id="editorContent" style="display:none;flex:1;display:flex;flex-direction:column">
<div class="editor-header">
<input type="text" id="noteTitle" placeholder="タイトル" oninput="updateNote()">
<div class="editor-actions">
<button onclick="exportNote()">📤 エクスポート</button>
<button onclick="deleteCurrentNote()">🗑️ 削除</button>
</div>
</div>
<div class="editor-toolbar">
<button onclick="formatText('bold')" title="太字"><b>B</b></button>
<button onclick="formatText('italic')" title="斜体"><i>I</i></button>
<button onclick="formatText('heading')" title="見出し">H</button>
<button onclick="formatText('list')" title="リスト">• リスト</button>
<button onclick="formatText('checklist')" title="チェックリスト">☑ チェック</button>
<button onclick="formatText('code')" title="コード">&lt;/&gt;</button>
<button onclick="formatText('link')" title="リンク">🔗</button>
</div>
<div class="editor-content">
<textarea id="noteContent" placeholder="メモを入力..." oninput="updateNote()"></textarea>
</div>
<div class="tags" id="tagsContainer"></div>
</div>
</div>
</div>
<script>
let notes=JSON.parse(localStorage.getItem('notes')||'[]');
let currentNoteId=null;

function generateId(){
    return Date.now().toString(36)+Math.random().toString(36).substr(2);
}

function saveNotes(){
    localStorage.setItem('notes',JSON.stringify(notes));
    updateStats();
}

function createNote(){
    const note={
        id:generateId(),
        title:'',
        content:'',
        tags:[],
        createdAt:Date.now(),
        updatedAt:Date.now()
    };
    notes.unshift(note);
    saveNotes();
    selectNote(note.id);
    renderNotesList();
}

function selectNote(id){
    currentNoteId=id;
    const note=notes.find(n=>n.id===id);
    if(!note)return;
    
    document.getElementById('emptyState').style.display='none';
    document.getElementById('editorContent').style.display='flex';
    document.getElementById('noteTitle').value=note.title;
    document.getElementById('noteContent').value=note.content;
    renderTags();
    renderNotesList();
}

function updateNote(){
    if(!currentNoteId)return;
    const note=notes.find(n=>n.id===currentNoteId);
    if(!note)return;
    
    note.title=document.getElementById('noteTitle').value;
    note.content=document.getElementById('noteContent').value;
    note.updatedAt=Date.now();
    saveNotes();
    renderNotesList();
}

function deleteNote(id,e){
    if(e)e.stopPropagation();
    if(!confirm('このメモを削除しますか？'))return;
    notes=notes.filter(n=>n.id!==id);
    saveNotes();
    if(currentNoteId===id){
        currentNoteId=null;
        document.getElementById('emptyState').style.display='flex';
        document.getElementById('editorContent').style.display='none';
    }
    renderNotesList();
}

function deleteCurrentNote(){
    if(currentNoteId)deleteNote(currentNoteId);
}

function formatText(type){
    const textarea=document.getElementById('noteContent');
    const start=textarea.selectionStart;
    const end=textarea.selectionEnd;
    const text=textarea.value;
    const selected=text.substring(start,end);
    let replacement='';
    
    switch(type){
        case'bold':replacement=`**${selected||'太字'}**`;break;
        case'italic':replacement=`*${selected||'斜体'}*`;break;
        case'heading':replacement=`\n## ${selected||'見出し'}\n`;break;
        case'list':replacement=`\n- ${selected||'項目'}\n`;break;
        case'checklist':replacement=`\n- [ ] ${selected||'タスク'}\n`;break;
        case'code':replacement=`\`${selected||'code'}\``;break;
        case'link':replacement=`[${selected||'リンク'}](url)`;break;
    }
    
    textarea.value=text.substring(0,start)+replacement+text.substring(end);
    textarea.focus();
    updateNote();
}

function addTag(){
    const tag=prompt('タグを入力:');
    if(!tag)return;
    const note=notes.find(n=>n.id===currentNoteId);
    if(!note)return;
    if(!note.tags.includes(tag)){
        note.tags.push(tag);
        saveNotes();
        renderTags();
    }
}

function removeTag(tag){
    const note=notes.find(n=>n.id===currentNoteId);
    if(!note)return;
    note.tags=note.tags.filter(t=>t!==tag);
    saveNotes();
    renderTags();
}

function renderTags(){
    const note=notes.find(n=>n.id===currentNoteId);
    if(!note)return;
    
    document.getElementById('tagsContainer').innerHTML=
        note.tags.map(t=>`<span class="tag">${t}<button onclick="removeTag('${t}')">×</button></span>`).join('')+
        '<span class="add-tag" onclick="addTag()">+ タグ追加</span>';
}

function renderNotesList(){
    const searchTerm=document.getElementById('searchInput').value.toLowerCase();
    const filtered=notes.filter(n=>
        n.title.toLowerCase().includes(searchTerm)||
        n.content.toLowerCase().includes(searchTerm)
    );
    
    document.getElementById('notesList').innerHTML=filtered.map(note=>{
        const preview=note.content.substring(0,50)||(note.title?'':'空のメモ');
        const date=new Date(note.updatedAt);
        const dateStr=`${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2,'0')}`;
        return`
            <div class="note-item${note.id===currentNoteId?' active':''}" onclick="selectNote('${note.id}')">
                <h3>${note.title||'無題のメモ'}</h3>
                <p>${preview}...</p>
                <div class="note-meta">
                    <span>${dateStr}</span>
                    <button class="delete-btn" onclick="deleteNote('${note.id}',event)">🗑️</button>
                </div>
            </div>
        `;
    }).join('');
}

function filterNotes(){
    renderNotesList();
}

function updateStats(){
    const total=notes.length;
    const chars=notes.reduce((sum,n)=>sum+n.content.length,0);
    document.getElementById('statsText').textContent=`${total}件のメモ • ${chars}文字`;
}

function exportNote(){
    const note=notes.find(n=>n.id===currentNoteId);
    if(!note)return;
    
    const content=`# ${note.title}\n\n${note.content}\n\n---\n作成: ${new Date(note.createdAt).toLocaleString()}\n更新: ${new Date(note.updatedAt).toLocaleString()}`;
    const blob=new Blob([content],{type:'text/markdown'});
    const a=document.createElement('a');
    a.download=(note.title||'note')+'.md';
    a.href=URL.createObjectURL(blob);
    a.click();
}

// 初期化
renderNotesList();
updateStats();

// キーボードショートカット
document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey){
        if(e.key==='n'){e.preventDefault();createNote()}
        if(e.key==='s'){e.preventDefault();/* 自動保存済み */}
    }
});
</script>
</body>
</html>
