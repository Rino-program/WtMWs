<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算機 - BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>⚖️ BMI計算機</h1>
    
    <div class="calculator">
        <div class="input-group">
            <label>📏 身長</label>
            <div class="input-row">
                <input type="number" id="height" value="170" min="100" max="250" step="0.1">
                <span>cm</span>
            </div>
        </div>
        
        <div class="input-group">
            <label>⚖️ 体重</label>
            <div class="input-row">
                <input type="number" id="weight" value="60" min="20" max="300" step="0.1">
                <span>kg</span>
            </div>
        </div>
        
        <div class="result-card">
            <div class="bmi-value" id="bmi-value">20.8</div>
            <div class="bmi-category category-normal" id="bmi-category">普通体重</div>
            
            <div class="bmi-meter">
                <div class="bmi-pointer" id="bmi-pointer" style="left: 35%"></div>
            </div>
            <div class="meter-labels">
                <span>18.5</span>
                <span>25</span>
                <span>30</span>
                <span>35+</span>
            </div>
        </div>
        
        <div class="info-cards">
            <div class="info-card">
                <div class="value" id="ideal-weight">-</div>
                <div class="label">標準体重 (BMI 22)</div>
            </div>
            <div class="info-card">
                <div class="value" id="weight-diff">-</div>
                <div class="label">標準との差</div>
            </div>
            <div class="info-card">
                <div class="value" id="min-weight">-</div>
                <div class="label">最低体重</div>
            </div>
            <div class="info-card">
                <div class="value" id="max-weight">-</div>
                <div class="label">最高体重</div>
            </div>
        </div>
        
        <div class="reference">
            <h3>📊 BMI分類表</h3>
            <table class="reference-table">
                <tr>
                    <td><span class="color-dot" style="background:#3498db"></span>低体重</td>
                    <td>18.5未満</td>
                </tr>
                <tr>
                    <td><span class="color-dot" style="background:#27ae60"></span>普通体重</td>
                    <td>18.5 〜 24.9</td>
                </tr>
                <tr>
                    <td><span class="color-dot" style="background:#f39c12"></span>肥満（1度）</td>
                    <td>25.0 〜 29.9</td>
                </tr>
                <tr>
                    <td><span class="color-dot" style="background:#e74c3c"></span>肥満（2度以上）</td>
                    <td>30.0以上</td>
                </tr>
            </table>
        </div>
        
        <div class="tips" id="tips">
            <strong>💡 アドバイス:</strong> 計算結果を確認してください。
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
