<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Typing Game - タイピングゲーム</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Hiragino Sans',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
.back:hover{opacity:1}
.container{text-align:center;max-width:850px;width:95%;padding:15px}
h1{font-size:clamp(1.4rem,4vw,1.8rem);margin-bottom:15px;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.options-row{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.options-row select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 12px;border-radius:8px;font-size:0.8rem}
.modes{display:flex;justify-content:center;gap:6px;margin-bottom:15px;flex-wrap:wrap}
.modes button{background:rgba(255,255,255,0.08);border:none;color:#aaa;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:0.8rem}
.modes button.active{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#000}
.stats{display:flex;justify-content:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,0.08);padding:10px 15px;border-radius:10px;min-width:65px}
.stat-val{font-size:clamp(1.2rem,3vw,1.5rem);font-weight:bold;color:#4facfe}
.stat-label{font-size:0.65rem;color:#888;margin-top:3px}
.word-box{margin:15px 0;padding:20px 15px;background:rgba(0,0,0,0.4);border-radius:15px;min-height:100px;position:relative}
.word-main{font-size:clamp(1.6rem,5vw,2.2rem);margin-bottom:8px;letter-spacing:2px}
.word-reading{font-size:clamp(1rem,3vw,1.3rem);color:#4facfe;letter-spacing:1px}
.char{transition:all 0.1s;display:inline-block}
.char.correct{color:#43e97b}
.char.wrong{color:#f5576c;animation:shake 0.2s}
.char.current{background:rgba(79,172,254,0.4);border-radius:3px;padding:0 2px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#typingInput{width:100%;padding:14px 20px;font-size:clamp(1rem,3vw,1.2rem);background:rgba(255,255,255,0.08);border:2px solid rgba(79,172,254,0.4);border-radius:10px;color:#fff;outline:none;text-align:center}
#typingInput:focus{border-color:#4facfe;box-shadow:0 0 15px rgba(79,172,254,0.2)}
.progress{height:5px;background:rgba(255,255,255,0.1);border-radius:3px;margin-top:15px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#4facfe,#00f2fe);transition:width 0.3s;width:0}
.combo{position:fixed;top:50%;right:15px;transform:translateY(-50%);text-align:center;opacity:0;transition:all 0.3s}
.combo.show{opacity:1}
.combo-num{font-size:1.8rem;font-weight:bold;color:#f5576c}
.combo-text{font-size:0.75rem;color:#888}
.keyboard{margin-top:20px;display:flex;flex-direction:column;gap:5px;align-items:center}
.kb-row{display:flex;gap:4px}
.kb-key{width:clamp(25px,6vw,35px);height:clamp(25px,6vw,35px);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:clamp(0.6rem,2vw,0.8rem);color:#888;transition:all 0.1s}
.kb-key.active{background:#4facfe;color:#000;border-color:#4facfe;transform:scale(1.1)}
.kb-key.error{background:#f5576c;color:#fff;border-color:#f5576c}
.kb-key.space{width:clamp(150px,40vw,200px)}
.result{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.result.show{display:flex}
.result h2{font-size:clamp(1.5rem,5vw,2rem);margin-bottom:20px;background:linear-gradient(90deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;width:100%;max-width:400px}
.result-stat{background:rgba(255,255,255,0.08);padding:15px;border-radius:12px}
.result-stat .val{font-size:clamp(1.3rem,4vw,1.8rem);color:#4facfe;font-weight:bold}
.result-stat .label{color:#888;margin-top:5px;font-size:0.75rem}
.result-stat.highlight{border:2px solid #ffd700}
.result-stat.highlight .val{color:#ffd700}
.result button{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:12px 30px;border-radius:10px;font-size:1rem;cursor:pointer;margin:5px}
.result .secondary{background:rgba(255,255,255,0.1)}
.miss-analysis{margin-top:20px;max-width:400px;width:100%;text-align:left}
.miss-analysis h3{font-size:0.9rem;color:#888;margin-bottom:10px}
.miss-list{display:flex;flex-wrap:wrap;gap:8px}
.miss-char{background:rgba(245,87,108,0.2);color:#f5576c;padding:5px 12px;border-radius:8px;font-size:0.85rem}
.miss-char span{margin-left:5px;color:#888;font-size:0.7rem}
.achievement-popup{position:fixed;top:20px;right:20px;background:linear-gradient(135deg,#667eea,#764ba2);padding:15px 25px;border-radius:12px;animation:slideIn 0.5s ease;z-index:300}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.level-badge{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000;padding:3px 10px;border-radius:10px;font-size:0.7rem;font-weight:bold}
@media(max-width:600px){.combo{right:5px}.combo-num{font-size:1.3rem}.keyboard{display:none}.stat{padding:8px 10px;min-width:55px}}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="container">
<h1>⌨️ タイピングゲーム</h1>
<div class="options-row">
<select id="difficultySelect">
<option value="easy">初級</option>
<option value="normal" selected>中級</option>
<option value="hard">上級</option>
</select>
<select id="themeSelect">
<option value="default">デフォルト</option>
<option value="dark">ダーク</option>
<option value="neon">ネオン</option>
<option value="pastel">パステル</option>
</select>
</div>
<div class="modes">
<button class="active" data-mode="japanese">日本語</button>
<button data-mode="english">英語</button>
<button data-mode="code">コード</button>
<button data-mode="proverbs">ことわざ</button>
<button data-mode="time">タイムアタック</button>
</div>
<div class="stats">
<div class="stat"><div class="stat-val" id="wpm">0</div><div class="stat-label">WPM</div></div>
<div class="stat"><div class="stat-val" id="accuracy">100%</div><div class="stat-label">正確率</div></div>
<div class="stat"><div class="stat-val" id="timeLeft">60</div><div class="stat-label" id="timeLabel">残り</div></div>
<div class="stat"><div class="stat-val" id="score">0</div><div class="stat-label">スコア</div></div>
<div class="stat"><div class="stat-val" id="level">1</div><div class="stat-label">レベル</div></div>
</div>
<div class="word-box">
<div class="level-badge" id="levelBadge">Lv.1</div>
<div class="word-main" id="wordMain"></div>
<div class="word-reading" id="wordReading"></div>
</div>
<input type="text" id="typingInput" placeholder="ここに入力..." autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="keyboard" id="keyboard"></div>
</div>
<div class="combo" id="combo"><div class="combo-num" id="comboNum">0</div><div class="combo-text">COMBO!</div></div>
<div class="result" id="result">
<h2>🎉 結果発表!</h2>
<div class="result-stats" id="resultStats"></div>
<div>
<button onclick="restart()">もう一度</button>
<button class="secondary" onclick="shareResult()">📤 シェア</button>
</div>
<div class="miss-analysis" id="missAnalysis"></div>
</div>
<script>
const wordSets={
    japanese:[
        {w:'桜',r:'sakura'},{w:'富士山',r:'fujisan'},{w:'東京',r:'toukyou'},{w:'日本',r:'nihon'},
        {w:'猫',r:'neko'},{w:'犬',r:'inu'},{w:'本',r:'hon'},{w:'水',r:'mizu'},{w:'火',r:'hi'},
        {w:'空',r:'sora'},{w:'海',r:'umi'},{w:'山',r:'yama'},{w:'川',r:'kawa'},{w:'森',r:'mori'},
        {w:'花',r:'hana'},{w:'鳥',r:'tori'},{w:'魚',r:'sakana'},{w:'月',r:'tsuki'},{w:'星',r:'hoshi'},
        {w:'春',r:'haru'},{w:'夏',r:'natsu'},{w:'秋',r:'aki'},{w:'冬',r:'fuyu'},
        {w:'朝',r:'asa'},{w:'昼',r:'hiru'},{w:'夜',r:'yoru'},{w:'今日',r:'kyou'},{w:'明日',r:'ashita'},
        {w:'学校',r:'gakkou'},{w:'先生',r:'sensei'},{w:'友達',r:'tomodachi'},{w:'家族',r:'kazoku'},
        {w:'電車',r:'densha'},{w:'飛行機',r:'hikouki'},{w:'自転車',r:'jitensha'},{w:'車',r:'kuruma'},
        {w:'食べる',r:'taberu'},{w:'飲む',r:'nomu'},{w:'見る',r:'miru'},{w:'聞く',r:'kiku'},
        {w:'話す',r:'hanasu'},{w:'書く',r:'kaku'},{w:'読む',r:'yomu'},{w:'走る',r:'hashiru'},
        {w:'プログラム',r:'puroguramu'},{w:'コンピュータ',r:'konpyuuta'},{w:'インターネット',r:'intaanetto'},
        {w:'ありがとう',r:'arigatou'},{w:'こんにちは',r:'konnichiha'},{w:'さようなら',r:'sayounara'}
    ],
    english:['hello','world','typing','keyboard','computer','programming','javascript','function','algorithm',
        'development','application','interface','database','network','browser','server','client','variable',
        'constant','object','array','string','number','boolean','module','package','library','framework',
        'design','pattern','security','performance','optimization','animation','responsive','dynamic'],
    code:['const','let','var','function','return','if','else','for','while','class','import','export',
        'async','await','try','catch','console.log','document.querySelector','addEventListener',
        'setTimeout','setInterval','Promise','Array.map','Object.keys','String.split','JSON.parse',
        'fetch','async function','arrow =>','spread ...','template `${}`','destructure {}'],
    proverbs:[
        {w:'七転び八起き',r:'nanakorobiyaoki'},{w:'一石二鳥',r:'issekinichou'},
        {w:'花より団子',r:'hanayoridango'},{w:'猿も木から落ちる',r:'sarumokikaraochiru'},
        {w:'継続は力なり',r:'keizokuhachikanari'},{w:'急がば回れ',r:'isogabamaware'},
        {w:'塵も積もれば山となる',r:'chiromotsumorebayamatonaru'},
        {w:'百聞は一見にしかず',r:'hyakubunhaikkenishikazu'},
        {w:'早起きは三文の徳',r:'hayaokihasanmonnotoku'},
        {w:'石の上にも三年',r:'ishinouenimosannen'}
    ],
    time:['the','and','for','are','but','not','you','all','can','was','one','our','out','day','get',
        'has','him','his','how','its','may','new','now','see','two','way','who','boy','did','own']
};

const kbRows=[
    ['1','2','3','4','5','6','7','8','9','0','-'],
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l',';'],
    ['z','x','c','v','b','n','m',',','.']
];

let mode='japanese',difficulty='normal',currentWord=null,romanji='',charIndex=0;
let score=0,level=1,combo=0,maxCombo=0,totalChars=0,correctChars=0,wordsTyped=0;
let startTime=0,timeLeft=60,timer=null,isPlaying=false;
let missedChars={},achievements=JSON.parse(localStorage.getItem('typingAchievements')||'{}');
const input=document.getElementById('typingInput');

// Create keyboard
function createKeyboard(){
    const kb=document.getElementById('keyboard');
    kb.innerHTML=kbRows.map(row=>`<div class="kb-row">${row.map(k=>`<div class="kb-key" data-key="${k}">${k}</div>`).join('')}</div>`).join('');
    kb.innerHTML+=`<div class="kb-row"><div class="kb-key space" data-key=" ">space</div></div>`;
}

function highlightKey(key,error=false){
    const keyEl=document.querySelector(`.kb-key[data-key="${key.toLowerCase()}"]`);
    if(keyEl){
        keyEl.classList.add(error?'error':'active');
        setTimeout(()=>keyEl.classList.remove('active','error'),100);
    }
}

document.querySelectorAll('.modes button').forEach(btn=>{
    btn.onclick=function(){
        document.querySelector('.modes .active').classList.remove('active');
        this.classList.add('active');
        mode=this.dataset.mode;
        restart();
    };
});

document.getElementById('difficultySelect').onchange=e=>{
    difficulty=e.target.value;
    restart();
};

function getWord(){
    const words=wordSets[mode];
    const w=words[Math.random()*words.length|0];
    if(typeof w==='string')return{display:w,reading:w};
    return{display:w.w,reading:w.r};
}

function renderWord(){
    document.getElementById('wordMain').textContent=currentWord.display;
    document.getElementById('wordReading').innerHTML=romanji.split('').map((c,i)=>{
        let cls='char';
        if(i<charIndex)cls+=' correct';
        if(i===charIndex)cls+=' current';
        return`<span class="${cls}">${c}</span>`;
    }).join('');
}

function newWord(){
    currentWord=getWord();
    romanji=currentWord.reading;
    charIndex=0;
    input.value='';
    renderWord();
}

function updateStats(){
    const elapsed=(Date.now()-startTime)/1000/60;
    const wpm=elapsed>0?Math.round(wordsTyped/elapsed):0;
    const acc=totalChars>0?Math.round(correctChars/totalChars*100):100;
    document.getElementById('wpm').textContent=wpm;
    document.getElementById('accuracy').textContent=acc+'%';
    document.getElementById('score').textContent=score;
    document.getElementById('level').textContent=level;
    document.getElementById('levelBadge').textContent='Lv.'+level;
}

function showCombo(){
    const el=document.getElementById('combo');
    document.getElementById('comboNum').textContent=combo;
    el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),800);
}

function levelUp(){
    level++;
    timeLeft+=10;
    showAchievement(`🎯 レベル${level}達成!`);
    playSound(880,0.15);
}

function showAchievement(text){
    const el=document.createElement('div');
    el.className='achievement-popup';
    el.textContent=text;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3000);
}

function playSound(freq,dur=0.1){
    try{
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.frequency.value=freq;
        osc.connect(gain);gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.1,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+dur);
        osc.start();osc.stop(ctx.currentTime+dur);
    }catch{}
}

function endGame(){
    isPlaying=false;
    clearInterval(timer);
    const elapsed=(Date.now()-startTime)/1000/60;
    const wpm=elapsed>0?Math.round(wordsTyped/elapsed):0;
    const acc=totalChars>0?Math.round(correctChars/totalChars*100):100;
    
    const isNewBest=score>(+localStorage.getItem('typingBest')||0);
    if(isNewBest)localStorage.setItem('typingBest',score);
    
    document.getElementById('resultStats').innerHTML=`
        <div class="result-stat${isNewBest?' highlight':''}"><div class="val">${wpm}</div><div class="label">WPM</div></div>
        <div class="result-stat"><div class="val">${acc}%</div><div class="label">正確率</div></div>
        <div class="result-stat"><div class="val">${score}</div><div class="label">スコア</div></div>
        <div class="result-stat"><div class="val">${maxCombo}x</div><div class="label">最大コンボ</div></div>
        <div class="result-stat"><div class="val">${wordsTyped}</div><div class="label">単語数</div></div>
        <div class="result-stat"><div class="val">Lv.${level}</div><div class="label">到達レベル</div></div>
    `;
    
    // Miss analysis
    const missArr=Object.entries(missedChars).sort((a,b)=>b[1]-a[1]).slice(0,8);
    document.getElementById('missAnalysis').innerHTML=missArr.length?`
        <h3>📊 ミスタイプ分析</h3>
        <div class="miss-list">${missArr.map(([c,n])=>`<div class="miss-char">${c}<span>×${n}</span></div>`).join('')}</div>
    `:'';
    
    document.getElementById('result').classList.add('show');
    checkAchievements(wpm,acc);
}

function checkAchievements(wpm,acc){
    if(wpm>=50&&!achievements.wpm50){achievements.wpm50=true;showAchievement('🏆 50WPM達成!')}
    if(wpm>=80&&!achievements.wpm80){achievements.wpm80=true;showAchievement('🏆 80WPM達成!')}
    if(acc===100&&wordsTyped>=10&&!achievements.perfect){achievements.perfect=true;showAchievement('🏆 パーフェクト!')}
    if(maxCombo>=10&&!achievements.combo10){achievements.combo10=true;showAchievement('🔥 10コンボ!')}
    localStorage.setItem('typingAchievements',JSON.stringify(achievements));
}

function restart(){
    document.getElementById('result').classList.remove('show');
    score=0;level=1;combo=0;maxCombo=0;totalChars=0;correctChars=0;wordsTyped=0;
    missedChars={};
    timeLeft=mode==='time'?30:60;
    document.getElementById('timeLeft').textContent=timeLeft;
    document.getElementById('progressBar').style.width='0%';
    clearInterval(timer);
    isPlaying=false;
    newWord();
    input.focus();
    updateStats();
}

function shareResult(){
    const wpm=document.querySelector('#resultStats .val').textContent;
    const text=`タイピングゲームで${wpm}WPMを記録しました！ #タイピング`;
    if(navigator.share){
        navigator.share({text});
    }else{
        navigator.clipboard.writeText(text);
        alert('結果をコピーしました!');
    }
}

input.oninput=function(){
    if(!isPlaying){
        isPlaying=true;
        startTime=Date.now();
        timer=setInterval(()=>{
            timeLeft--;
            document.getElementById('timeLeft').textContent=timeLeft;
            if(timeLeft<=0)endGame();
        },1000);
    }
    const val=this.value.toLowerCase();
    const target=romanji.slice(0,val.length);
    totalChars++;
    
    const lastChar=val[val.length-1];
    highlightKey(lastChar||'');
    
    if(val===target){
        correctChars++;
        charIndex=val.length;
        playSound(440+combo*20,0.05);
        
        if(val===romanji){
            wordsTyped++;
            combo++;
            if(combo>maxCombo)maxCombo=combo;
            const basePoints=romanji.length*10;
            const comboBonus=combo*5;
            const diffMultiplier={easy:1,normal:1.5,hard:2}[difficulty];
            score+=Math.round((basePoints+comboBonus)*diffMultiplier);
            showCombo();
            playSound(660,0.1);
            
            if(wordsTyped%10===0)levelUp();
            
            newWord();
            const targetWords=mode==='time'?20:15;
            const progress=Math.min(wordsTyped/targetWords*100,100);
            document.getElementById('progressBar').style.width=progress+'%';
            if(mode!=='time'&&wordsTyped>=targetWords*level)endGame();
        }
        renderWord();
    }else{
        combo=1;
        missedChars[lastChar]=(missedChars[lastChar]||0)+1;
        highlightKey(lastChar,true);
        playSound(220,0.1);
        const chars=document.getElementById('wordReading').querySelectorAll('.char');
        if(chars[charIndex])chars[charIndex].classList.add('wrong');
    }
    updateStats();
};

input.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();restart()}};

createKeyboard();
restart();
</script>
</body>
</html>
