<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Typing Game - タイピングゲーム</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="container">
<h1>⌨️ タイピングゲーム</h1>
<div class="options-row">
<select id="difficultySelect">
<option value="easy">初級</option>
<option value="normal" selected>中級</option>
<option value="hard">上級</option>
</select>
<select id="themeSelect">
<option value="default">デフォルト</option>
<option value="dark">ダーク</option>
<option value="neon">ネオン</option>
<option value="pastel">パステル</option>
</select>
<button class="btn-icon" id="customTextBtn" title="カスタムテキスト">📝</button>
<button class="btn-icon" id="statsBtn" title="詳細統計">📊</button>
<button class="btn-icon" id="practiceBtn" title="苦手練習">🎯</button>
</div>
<div class="modes">
<button class="active" data-mode="japanese">日本語</button>
<button data-mode="english">英語</button>
<button data-mode="code">コード</button>
<button data-mode="proverbs">ことわざ</button>
<button data-mode="time">タイムアタック</button>
<button data-mode="programming">プログラミング</button>
<button data-mode="business">ビジネス</button>
<button data-mode="hiragana">ひらがな</button>
<button data-mode="speech">英語スピーチ</button>
<button data-mode="custom">カスタム</button>
</div>
<div class="stats">
<div class="stat"><div class="stat-val" id="wpm">0</div><div class="stat-label">WPM</div></div>
<div class="stat"><div class="stat-val" id="accuracy">100%</div><div class="stat-label">正確率</div></div>
<div class="stat"><div class="stat-val" id="timeLeft">60</div><div class="stat-label" id="timeLabel">残り</div></div>
<div class="stat"><div class="stat-val" id="score">0</div><div class="stat-label">スコア</div></div>
<div class="stat"><div class="stat-val" id="level">1</div><div class="stat-label">レベル</div></div>
</div>
<div class="word-box">
<div class="level-badge" id="levelBadge">Lv.1</div>
<div class="word-main" id="wordMain"></div>
<div class="word-reading" id="wordReading"></div>
</div>
<input type="text" id="typingInput" placeholder="ここに入力..." autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="keyboard" id="keyboard"></div>
</div>
<div class="combo" id="combo"><div class="combo-num" id="comboNum">0</div><div class="combo-text">COMBO!</div></div>

<!-- 結果画面 -->
<div class="result" id="result">
<h2>🎉 結果発表!</h2>
<div class="result-stats" id="resultStats"></div>
<div class="result-buttons">
<button onclick="restart()">もう一度</button>
<button class="secondary" onclick="shareResult()">📤 シェア</button>
<button class="secondary" onclick="practiceMissedWords()">🔄 ミス再練習</button>
</div>
<div class="miss-analysis" id="missAnalysis"></div>
<div class="wpm-chart-container" id="wpmChartContainer">
<h3>📈 WPM推移</h3>
<canvas id="wpmChart" width="400" height="150"></canvas>
</div>
<div class="key-accuracy" id="keyAccuracy"></div>
</div>

<!-- カスタムテキストモーダル -->
<div class="modal" id="customModal">
<div class="modal-content">
<div class="modal-header">
<h2>📝 カスタムテキスト</h2>
<button class="modal-close" onclick="closeModal('customModal')">&times;</button>
</div>
<div class="modal-body">
<div class="tabs">
<button class="tab-btn active" data-tab="input">テキスト入力</button>
<button class="tab-btn" data-tab="saved">保存済み</button>
<button class="tab-btn" data-tab="presets">プリセット</button>
</div>
<div class="tab-content active" id="tab-input">
<textarea id="customTextArea" placeholder="練習したいテキストを入力してください...&#10;&#10;例：the quick brown fox jumps over the lazy dog"></textarea>
<div class="custom-options">
<input type="text" id="customTextName" placeholder="テキスト名（保存用）">
<button class="btn-primary" onclick="saveCustomText()">💾 保存</button>
</div>
<button class="btn-primary btn-full" onclick="useCustomText()">▶️ このテキストで練習開始</button>
</div>
<div class="tab-content" id="tab-saved">
<div class="saved-list" id="savedTextList"></div>
</div>
<div class="tab-content" id="tab-presets">
<div class="preset-category">
<h4>💻 プログラミング用語</h4>
<div class="preset-list" id="presetProgramming"></div>
</div>
<div class="preset-category">
<h4>💼 ビジネス文書</h4>
<div class="preset-list" id="presetBusiness"></div>
</div>
<div class="preset-category">
<h4>🇯🇵 日本語（ひらがな）</h4>
<div class="preset-list" id="presetHiragana"></div>
</div>
<div class="preset-category">
<h4>🎤 英語スピーチ</h4>
<div class="preset-list" id="presetSpeech"></div>
</div>
</div>
</div>
</div>
</div>

<!-- 詳細統計モーダル -->
<div class="modal" id="statsModal">
<div class="modal-content modal-large">
<div class="modal-header">
<h2>📊 詳細統計</h2>
<button class="modal-close" onclick="closeModal('statsModal')">&times;</button>
</div>
<div class="modal-body">
<div class="stats-grid">
<div class="stats-card">
<h4>🎯 総合統計</h4>
<div class="stats-detail" id="overallStats"></div>
</div>
<div class="stats-card">
<h4>⌨️ キー別正確率</h4>
<div class="key-grid" id="keyStatsGrid"></div>
</div>
<div class="stats-card">
<h4>❌ ミスした文字</h4>
<div class="miss-detail" id="missedCharsDetail"></div>
</div>
<div class="stats-card">
<h4>📈 セッション履歴</h4>
<div class="session-history" id="sessionHistory"></div>
</div>
</div>
<button class="btn-secondary" onclick="clearAllStats()">🗑️ 統計をリセット</button>
</div>
</div>
</div>

<!-- 苦手練習モーダル -->
<div class="modal" id="practiceModal">
<div class="modal-content">
<div class="modal-header">
<h2>🎯 苦手練習モード</h2>
<button class="modal-close" onclick="closeModal('practiceModal')">&times;</button>
</div>
<div class="modal-body">
<div class="practice-section">
<h4>❌ ミスの多い文字</h4>
<div class="weak-chars" id="weakChars"></div>
<button class="btn-primary" onclick="startWeakCharPractice()">この文字を集中練習</button>
</div>
<div class="practice-section">
<h4>📝 ミスした単語</h4>
<div class="missed-words" id="missedWordsList"></div>
<button class="btn-primary" onclick="startMissedWordPractice()">ミス単語を再練習</button>
</div>
</div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
