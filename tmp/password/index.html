<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード生成器 - Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>🔐 パスワード生成器</h1>
    
    <div class="container">
        <div class="password-display">
            <div class="password-text" id="password">クリックして生成</div>
            <button class="copy-btn" id="copy-btn" onclick="copyPassword()">📋 コピー</button>
        </div>
        
        <div class="strength-meter">
            <div class="strength-label">
                <span>強度</span>
                <span id="strength-text">-</span>
            </div>
            <div class="strength-bar">
                <div class="strength-fill" id="strength-fill"></div>
            </div>
        </div>
        
        <div class="option-group">
            <label>パスワードの長さ</label>
            <input type="range" class="length-slider" id="length" min="4" max="64" value="16">
            <div class="length-display"><span id="length-value">16</span> 文字</div>
        </div>
        
        <div class="option-group">
            <label>含める文字</label>
            <div class="checkboxes">
                <label class="checkbox-item">
                    <input type="checkbox" id="uppercase" checked>
                    <span>大文字 (A-Z)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="lowercase" checked>
                    <span>小文字 (a-z)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="numbers" checked>
                    <span>数字 (0-9)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="symbols" checked>
                    <span>記号 (!@#$%)</span>
                </label>
            </div>
        </div>
        
        <button class="generate-btn" onclick="generatePassword()">🔄 パスワードを生成</button>
        
        <div class="history">
            <h3>📜 履歴</h3>
            <div class="history-list" id="history-list"></div>
        </div>
    </div>
    
    <div class="toast" id="toast">コピーしました！</div>

    <script src="script.js"></script>
</body>
</html>
