<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード生成器 - Password Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 100;
        }
        .back-link:hover { background: rgba(255,255,255,0.2); }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .container {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .password-display {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .password-text {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            word-break: break-all;
            color: #00ff88;
            min-height: 1.5em;
        }
        
        .copy-btn {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border: none;
            color: #000;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .copy-btn:hover { transform: scale(1.05); }
        .copy-btn.copied { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        
        .strength-meter {
            margin-bottom: 25px;
        }
        
        .strength-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        
        .strength-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .strength-fill {
            height: 100%;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .strength-weak { width: 25%; background: #e74c3c; }
        .strength-fair { width: 50%; background: #f39c12; }
        .strength-good { width: 75%; background: #3498db; }
        .strength-strong { width: 100%; background: #00ff88; }
        
        .option-group {
            margin-bottom: 20px;
        }
        
        .option-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
        }
        
        .length-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .length-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #00ff88;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .length-display {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff88;
        }
        
        .checkboxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .checkbox-item:hover { background: rgba(255,255,255,0.1); }
        
        .checkbox-item input {
            width: 18px;
            height: 18px;
            accent-color: #00ff88;
        }
        
        .checkbox-item span {
            font-size: 0.85rem;
        }
        
        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .history {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .history h3 {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 15px;
        }
        
        .history-list {
            max-height: 150px;
            overflow-y: auto;
        }
        
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }
        
        .history-item button {
            background: transparent;
            border: none;
            color: #4facfe;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #00ff88;
            color: #000;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            transition: transform 0.3s;
            z-index: 1000;
        }
        
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>🔐 パスワード生成器</h1>
    
    <div class="container">
        <div class="password-display">
            <div class="password-text" id="password">クリックして生成</div>
            <button class="copy-btn" id="copy-btn" onclick="copyPassword()">📋 コピー</button>
        </div>
        
        <div class="strength-meter">
            <div class="strength-label">
                <span>強度</span>
                <span id="strength-text">-</span>
            </div>
            <div class="strength-bar">
                <div class="strength-fill" id="strength-fill"></div>
            </div>
        </div>
        
        <div class="option-group">
            <label>パスワードの長さ</label>
            <input type="range" class="length-slider" id="length" min="4" max="64" value="16">
            <div class="length-display"><span id="length-value">16</span> 文字</div>
        </div>
        
        <div class="option-group">
            <label>含める文字</label>
            <div class="checkboxes">
                <label class="checkbox-item">
                    <input type="checkbox" id="uppercase" checked>
                    <span>大文字 (A-Z)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="lowercase" checked>
                    <span>小文字 (a-z)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="numbers" checked>
                    <span>数字 (0-9)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="symbols" checked>
                    <span>記号 (!@#$%)</span>
                </label>
            </div>
        </div>
        
        <button class="generate-btn" onclick="generatePassword()">🔄 パスワードを生成</button>
        
        <div class="history">
            <h3>📜 履歴</h3>
            <div class="history-list" id="history-list"></div>
        </div>
    </div>
    
    <div class="toast" id="toast">コピーしました！</div>

    <script>
        const chars = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };
        
        let history = JSON.parse(localStorage.getItem('password-history') || '[]');
        let currentPassword = '';
        
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            let charset = '';
            
            if (document.getElementById('uppercase').checked) charset += chars.uppercase;
            if (document.getElementById('lowercase').checked) charset += chars.lowercase;
            if (document.getElementById('numbers').checked) charset += chars.numbers;
            if (document.getElementById('symbols').checked) charset += chars.symbols;
            
            if (!charset) {
                charset = chars.lowercase;
                document.getElementById('lowercase').checked = true;
            }
            
            currentPassword = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            
            for (let i = 0; i < length; i++) {
                currentPassword += charset[array[i] % charset.length];
            }
            
            document.getElementById('password').textContent = currentPassword;
            updateStrength();
            addToHistory(currentPassword);
        }
        
        function updateStrength() {
            const password = currentPassword;
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (password.length >= 16) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const fill = document.getElementById('strength-fill');
            const text = document.getElementById('strength-text');
            
            fill.className = 'strength-fill';
            
            if (strength <= 2) {
                fill.classList.add('strength-weak');
                text.textContent = '弱い';
                text.style.color = '#e74c3c';
            } else if (strength <= 4) {
                fill.classList.add('strength-fair');
                text.textContent = 'まあまあ';
                text.style.color = '#f39c12';
            } else if (strength <= 5) {
                fill.classList.add('strength-good');
                text.textContent = '良い';
                text.style.color = '#3498db';
            } else {
                fill.classList.add('strength-strong');
                text.textContent = '強い';
                text.style.color = '#00ff88';
            }
        }
        
        function copyPassword() {
            if (!currentPassword) return;
            
            navigator.clipboard.writeText(currentPassword).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.textContent = '✓ コピー完了';
                btn.classList.add('copied');
                
                showToast();
                
                setTimeout(() => {
                    btn.textContent = '📋 コピー';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
        
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function addToHistory(password) {
            history.unshift(password);
            if (history.length > 10) history.pop();
            localStorage.setItem('password-history', JSON.stringify(history));
            renderHistory();
        }
        
        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = history.map((pw, i) => `
                <div class="history-item">
                    <span>${pw.substring(0, 20)}${pw.length > 20 ? '...' : ''}</span>
                    <button onclick="copyFromHistory(${i})">📋</button>
                </div>
            `).join('');
        }
        
        function copyFromHistory(index) {
            navigator.clipboard.writeText(history[index]).then(() => {
                showToast();
            });
        }
        
        // イベントリスナー
        document.getElementById('length').addEventListener('input', e => {
            document.getElementById('length-value').textContent = e.target.value;
        });
        
        // 初期化
        renderHistory();
        generatePassword();
    </script>
</body>
</html>
