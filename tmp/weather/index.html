<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Weather Widget - 天気ウィジェット</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>🌤️ 天気ウィジェット</h1>
<div class="weather-card" id="weatherCard">
<div class="location">
<span>📍</span>
<select id="citySelect">
<option value="tokyo">東京</option>
<option value="osaka">大阪</option>
<option value="nagoya">名古屋</option>
<option value="sapporo">札幌</option>
<option value="fukuoka">福岡</option>
<option value="sendai">仙台</option>
<option value="kyoto">京都</option>
<option value="naha">那覇</option>
</select>
</div>
<div class="weather-icon" id="weatherIcon">☀️</div>
<div class="temperature"><span id="temp">25</span><span>°C</span></div>
<div class="description" id="description">晴れ</div>
<div class="details">
<div class="detail">
<div class="detail-value" id="humidity">65%</div>
<div class="detail-label">湿度</div>
</div>
<div class="detail">
<div class="detail-value" id="wind">5m/s</div>
<div class="detail-label">風速</div>
</div>
<div class="detail">
<div class="detail-value" id="uv">4</div>
<div class="detail-label">UV指数</div>
</div>
</div>
</div>
<div class="hourly">
<h2>⏰ 時間別予報</h2>
<div class="hourly-list" id="hourlyList"></div>
</div>
<div class="forecast">
<h2>📅 週間予報</h2>
<div class="forecast-list" id="forecastList"></div>
</div>
<div class="info">※ デモ用のモック天気データです</div>
<div class="animations" id="animations"></div>
<script src="script.js"></script>
</body>
</html>
