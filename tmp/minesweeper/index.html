<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マインスイーパー - Minesweeper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 100;
        }
        .back-link:hover { background: rgba(255,255,255,0.2); }
        
        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        
        .game-info {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            padding: 15px 30px;
            border-radius: 15px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .info-label {
            font-size: 0.8rem;
            opacity: 0.7;
        }
        
        .info-value {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        
        .info-value.red { color: #e74c3c; }
        
        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .diff-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .diff-btn:hover { background: rgba(255,255,255,0.2); }
        .diff-btn.active { 
            background: #27ae60; 
            border-color: #27ae60; 
        }
        
        .board-wrapper {
            background: #bdc3c7;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .board {
            display: grid;
            gap: 2px;
            background: #7f8c8d;
        }
        
        .cell {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            background: #95a5a6;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
            border: 2px outset #bdc3c7;
        }
        
        .cell:hover:not(.revealed):not(.flagged) {
            background: #a6b5b7;
        }
        
        .cell.revealed {
            background: #ecf0f1;
            border: 1px solid #bdc3c7;
            cursor: default;
        }
        
        .cell.flagged {
            background: #95a5a6;
        }
        
        .cell.mine {
            background: #e74c3c;
        }
        
        .cell.exploded {
            background: #c0392b;
            animation: explode 0.3s ease-out;
        }
        
        @keyframes explode {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .cell.num-1 { color: #3498db; }
        .cell.num-2 { color: #27ae60; }
        .cell.num-3 { color: #e74c3c; }
        .cell.num-4 { color: #9b59b6; }
        .cell.num-5 { color: #e67e22; }
        .cell.num-6 { color: #1abc9c; }
        .cell.num-7 { color: #34495e; }
        .cell.num-8 { color: #7f8c8d; }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 25px;
            background: #27ae60;
            border: none;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #2ecc71;
            transform: translateY(-2px);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: linear-gradient(135deg, #2d3436, #636e72);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }
        
        .modal-content h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .modal-content.win h2 { color: #2ecc71; }
        .modal-content.lose h2 { color: #e74c3c; }
        
        .modal-content p {
            margin-bottom: 20px;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .stats {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .stat-row:last-child { margin-bottom: 0; }
        
        .best-times {
            margin-top: 20px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
        }
        
        .best-times h4 {
            margin-bottom: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .best-time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .best-time-row:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>💣 マインスイーパー</h1>
    
    <div class="game-info">
        <div class="info-item">
            <span class="info-label">💣 残り地雷</span>
            <span class="info-value" id="mine-count">10</span>
        </div>
        <div class="info-item">
            <span class="info-label">⏱️ タイム</span>
            <span class="info-value" id="timer">000</span>
        </div>
        <div class="info-item">
            <span class="info-label">🏆 ベスト</span>
            <span class="info-value" id="best-time">---</span>
        </div>
    </div>
    
    <div class="difficulty-selector">
        <button class="diff-btn active" data-difficulty="easy">初級 (9×9)</button>
        <button class="diff-btn" data-difficulty="medium">中級 (16×16)</button>
        <button class="diff-btn" data-difficulty="hard">上級 (30×16)</button>
    </div>
    
    <div class="board-wrapper">
        <div class="board" id="board"></div>
    </div>
    
    <div class="controls">
        <button class="btn" id="new-game">🔄 新しいゲーム</button>
    </div>
    
    <div class="best-times">
        <h4>🏆 ベストタイム</h4>
        <div class="best-time-row">
            <span>初級</span>
            <span id="best-easy">---</span>
        </div>
        <div class="best-time-row">
            <span>中級</span>
            <span id="best-medium">---</span>
        </div>
        <div class="best-time-row">
            <span>上級</span>
            <span id="best-hard">---</span>
        </div>
    </div>
    
    <div class="modal" id="modal">
        <div class="modal-content" id="modal-content">
            <h2 id="modal-title">ゲーム終了</h2>
            <p id="modal-message"></p>
            <div class="stats" id="modal-stats"></div>
            <button class="btn" onclick="newGame()">もう一度プレイ</button>
        </div>
    </div>

    <script>
        const difficulties = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };
        
        let currentDifficulty = 'easy';
        let board = [];
        let revealed = [];
        let flagged = [];
        let gameOver = false;
        let gameStarted = false;
        let timer = 0;
        let timerInterval = null;
        let minesRemaining = 10;
        
        // ベストタイム読み込み
        let bestTimes = JSON.parse(localStorage.getItem('minesweeper-best') || '{}');
        updateBestTimesDisplay();
        
        function initGame() {
            const { rows, cols, mines } = difficulties[currentDifficulty];
            
            board = Array(rows).fill().map(() => Array(cols).fill(0));
            revealed = Array(rows).fill().map(() => Array(cols).fill(false));
            flagged = Array(rows).fill().map(() => Array(cols).fill(false));
            gameOver = false;
            gameStarted = false;
            minesRemaining = mines;
            timer = 0;
            
            if (timerInterval) clearInterval(timerInterval);
            
            document.getElementById('mine-count').textContent = mines;
            document.getElementById('timer').textContent = '000';
            document.getElementById('best-time').textContent = bestTimes[currentDifficulty] ? formatTime(bestTimes[currentDifficulty]) : '---';
            
            renderBoard();
        }
        
        function placeMines(excludeRow, excludeCol) {
            const { rows, cols, mines } = difficulties[currentDifficulty];
            let placed = 0;
            
            while (placed < mines) {
                const row = Math.floor(Math.random() * rows);
                const col = Math.floor(Math.random() * cols);
                
                // 最初にクリックしたセルとその周囲には地雷を置かない
                const isExcluded = Math.abs(row - excludeRow) <= 1 && Math.abs(col - excludeCol) <= 1;
                
                if (board[row][col] !== -1 && !isExcluded) {
                    board[row][col] = -1;
                    placed++;
                }
            }
            
            // 数字を計算
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] !== -1) {
                        board[r][c] = countAdjacentMines(r, c);
                    }
                }
            }
        }
        
        function countAdjacentMines(row, col) {
            const { rows, cols } = difficulties[currentDifficulty];
            let count = 0;
            
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = row + dr;
                    const nc = col + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) {
                        count++;
                    }
                }
            }
            
            return count;
        }
        
        function renderBoard() {
            const { rows, cols } = difficulties[currentDifficulty];
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${cols}, 35px)`;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    if (revealed[r][c]) {
                        cell.classList.add('revealed');
                        if (board[r][c] === -1) {
                            cell.textContent = '💣';
                            cell.classList.add('mine');
                        } else if (board[r][c] > 0) {
                            cell.textContent = board[r][c];
                            cell.classList.add(`num-${board[r][c]}`);
                        }
                    } else if (flagged[r][c]) {
                        cell.textContent = '🚩';
                        cell.classList.add('flagged');
                    }
                    
                    cell.addEventListener('click', () => handleClick(r, c));
                    cell.addEventListener('contextmenu', e => {
                        e.preventDefault();
                        handleRightClick(r, c);
                    });
                    
                    boardEl.appendChild(cell);
                }
            }
        }
        
        function handleClick(row, col) {
            if (gameOver || flagged[row][col]) return;
            
            if (!gameStarted) {
                gameStarted = true;
                placeMines(row, col);
                startTimer();
            }
            
            revealCell(row, col);
            renderBoard();
            checkWin();
        }
        
        function handleRightClick(row, col) {
            if (gameOver || revealed[row][col]) return;
            
            flagged[row][col] = !flagged[row][col];
            minesRemaining += flagged[row][col] ? -1 : 1;
            
            const mineCountEl = document.getElementById('mine-count');
            mineCountEl.textContent = minesRemaining;
            mineCountEl.classList.toggle('red', minesRemaining < 0);
            
            renderBoard();
        }
        
        function revealCell(row, col) {
            const { rows, cols } = difficulties[currentDifficulty];
            
            if (row < 0 || row >= rows || col < 0 || col >= cols) return;
            if (revealed[row][col] || flagged[row][col]) return;
            
            revealed[row][col] = true;
            
            if (board[row][col] === -1) {
                // 地雷に当たった
                endGame(false, row, col);
                return;
            }
            
            if (board[row][col] === 0) {
                // 空のセルは周囲も開く
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        revealCell(row + dr, col + dc);
                    }
                }
            }
        }
        
        function checkWin() {
            const { rows, cols, mines } = difficulties[currentDifficulty];
            let revealedCount = 0;
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (revealed[r][c]) revealedCount++;
                }
            }
            
            if (revealedCount === rows * cols - mines) {
                endGame(true);
            }
        }
        
        function endGame(won, explodedRow = -1, explodedCol = -1) {
            gameOver = true;
            clearInterval(timerInterval);
            
            const { rows, cols } = difficulties[currentDifficulty];
            
            // すべての地雷を表示
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] === -1) {
                        revealed[r][c] = true;
                    }
                }
            }
            
            renderBoard();
            
            // 爆発したセルにアニメーション
            if (!won && explodedRow >= 0) {
                const cells = document.querySelectorAll('.cell');
                const index = explodedRow * difficulties[currentDifficulty].cols + explodedCol;
                cells[index].classList.add('exploded');
            }
            
            // ベストタイム更新
            if (won) {
                if (!bestTimes[currentDifficulty] || timer < bestTimes[currentDifficulty]) {
                    bestTimes[currentDifficulty] = timer;
                    localStorage.setItem('minesweeper-best', JSON.stringify(bestTimes));
                    updateBestTimesDisplay();
                }
            }
            
            // モーダル表示
            setTimeout(() => {
                const modal = document.getElementById('modal');
                const modalContent = document.getElementById('modal-content');
                const modalTitle = document.getElementById('modal-title');
                const modalMessage = document.getElementById('modal-message');
                const modalStats = document.getElementById('modal-stats');
                
                modalContent.className = `modal-content ${won ? 'win' : 'lose'}`;
                modalTitle.textContent = won ? '🎉 クリア！' : '💥 ゲームオーバー';
                modalMessage.textContent = won ? 'おめでとうございます！' : '地雷を踏んでしまいました...';
                
                modalStats.innerHTML = `
                    <div class="stat-row">
                        <span>タイム</span>
                        <span>${formatTime(timer)}</span>
                    </div>
                    <div class="stat-row">
                        <span>難易度</span>
                        <span>${currentDifficulty === 'easy' ? '初級' : currentDifficulty === 'medium' ? '中級' : '上級'}</span>
                    </div>
                    ${won && (!bestTimes[currentDifficulty] || timer <= bestTimes[currentDifficulty]) ? '<div class="stat-row"><span>🏆 新記録！</span><span></span></div>' : ''}
                `;
                
                modal.classList.add('active');
            }, 500);
        }
        
        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                document.getElementById('timer').textContent = String(timer).padStart(3, '0');
            }, 1000);
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return mins > 0 ? `${mins}:${String(secs).padStart(2, '0')}` : `${secs}秒`;
        }
        
        function updateBestTimesDisplay() {
            document.getElementById('best-easy').textContent = bestTimes.easy ? formatTime(bestTimes.easy) : '---';
            document.getElementById('best-medium').textContent = bestTimes.medium ? formatTime(bestTimes.medium) : '---';
            document.getElementById('best-hard').textContent = bestTimes.hard ? formatTime(bestTimes.hard) : '---';
        }
        
        function newGame() {
            document.getElementById('modal').classList.remove('active');
            initGame();
        }
        
        // イベントリスナー
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDifficulty = btn.dataset.difficulty;
                initGame();
            });
        });
        
        document.getElementById('new-game').addEventListener('click', newGame);
        
        // 初期化
        initGame();
    </script>
</body>
</html>
