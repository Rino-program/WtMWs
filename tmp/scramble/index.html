<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語スクランブル | Word Scramble</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    
    <div class="container">
        <h1 id="title">単語スクランブル</h1>
        
        <div class="settings">
            <div class="setting-group">
                <label for="language">言語 / Language:</label>
                <select id="language">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label for="difficulty">難易度:</label>
                <select id="difficulty">
                    <option value="easy">簡単 (3-4文字)</option>
                    <option value="medium" selected>普通 (5-6文字)</option>
                    <option value="hard">難しい (7文字以上)</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label for="timerToggle">
                    <input type="checkbox" id="timerToggle">
                    タイマー有効
                </label>
                <select id="timerDuration">
                    <option value="30">30秒</option>
                    <option value="60" selected>60秒</option>
                    <option value="90">90秒</option>
                </select>
            </div>
        </div>
        
        <div class="score-board">
            <div class="score-item">
                <span id="scoreLabel">スコア</span>
                <span id="score" class="score-value">0</span>
            </div>
            <div class="score-item">
                <span id="streakLabel">連続正解</span>
                <span id="streak" class="score-value">0</span>
            </div>
            <div class="score-item">
                <span id="bestStreakLabel">最高連続</span>
                <span id="bestStreak" class="score-value">0</span>
            </div>
        </div>
        
        <div class="timer-display" id="timerDisplay">
            <span id="timerLabel">残り時間:</span>
            <span id="timer">60</span><span id="timerUnit">秒</span>
        </div>
        
        <div class="game-area">
            <div class="scrambled-word" id="scrambledWord">スタートを押してね</div>
            
            <div class="hint-area" id="hintArea">
                <span id="hintText"></span>
            </div>
            
            <input type="text" id="answerInput" placeholder="答えを入力..." autocomplete="off" disabled>
            
            <div class="button-group">
                <button id="startBtn" class="btn btn-primary">スタート</button>
                <button id="hintBtn" class="btn btn-secondary" disabled>ヒント</button>
                <button id="skipBtn" class="btn btn-secondary" disabled>スキップ</button>
            </div>
            
            <div class="message" id="message"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
