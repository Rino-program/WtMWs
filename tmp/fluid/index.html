<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Fluid Simulation - 流体シミュレーション</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<canvas id="cv"></canvas>
<div class="info">ドラッグで流体を動かす<br>マルチタッチ対応</div>
<div class="ctrl">
<select id="colorMode">
<option value="velocity">速度</option>
<option value="rainbow">レインボー</option>
<option value="fire">炎</option>
<option value="smoke">煙</option>
<option value="ink">インク</option>
</select>
<label>粘性<input type="range" id="visc" min="0" max="0.0001" step="0.000001" value="0.00001"></label>
<label>拡散<input type="range" id="diff" min="0" max="0.0001" step="0.000001" value="0.00001"></label>
<label>力<input type="range" id="force" min="1" max="20" value="8"></label>
<button onclick="clear_()">クリア</button>
</div>
<script src="script.js"></script>
</body>
</html>
