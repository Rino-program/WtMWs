<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お絵かきボード（シンプル版）</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    
    <div class="toolbar">
        <div class="tool-group">
            <button class="tool-btn active" data-tool="brush" title="ブラシ">🖌️</button>
            <button class="tool-btn" data-tool="pencil" title="鉛筆">✏️</button>
            <button class="tool-btn" data-tool="eraser" title="消しゴム">🧹</button>
            <button class="tool-btn" data-tool="fill" title="塗りつぶし">🪣</button>
        </div>
        
        <div class="tool-group">
            <button class="tool-btn" data-tool="line" title="直線">📏</button>
            <button class="tool-btn" data-tool="rect" title="四角形">⬜</button>
            <button class="tool-btn" data-tool="circle" title="円">⭕</button>
            <button class="tool-btn" data-tool="triangle" title="三角形">🔺</button>
        </div>
        
        <div class="tool-group">
            <div class="color-picker-wrapper">
                <input type="color" id="color-picker" value="#000000">
                <div class="color-display" id="color-display"></div>
            </div>
            <div class="preset-colors">
                <div class="preset-color" style="background:#000000" data-color="#000000"></div>
                <div class="preset-color" style="background:#ffffff" data-color="#ffffff"></div>
                <div class="preset-color" style="background:#e74c3c" data-color="#e74c3c"></div>
                <div class="preset-color" style="background:#3498db" data-color="#3498db"></div>
                <div class="preset-color" style="background:#2ecc71" data-color="#2ecc71"></div>
                <div class="preset-color" style="background:#f39c12" data-color="#f39c12"></div>
                <div class="preset-color" style="background:#9b59b6" data-color="#9b59b6"></div>
            </div>
        </div>
        
        <div class="tool-group">
            <div class="slider-group">
                <label>サイズ: <span id="size-value">5</span></label>
                <input type="range" id="brush-size" min="1" max="50" value="5">
            </div>
            <div class="slider-group">
                <label>透明度: <span id="opacity-value">100</span>%</label>
                <input type="range" id="brush-opacity" min="1" max="100" value="100">
            </div>
        </div>
        
        <div class="tool-group">
            <button class="tool-btn" id="undo-btn" title="元に戻す">↩️</button>
            <button class="tool-btn" id="redo-btn" title="やり直し">↪️</button>
            <button class="tool-btn" id="clear-btn" title="全消去">🗑️</button>
            <button class="tool-btn" id="save-btn" title="保存">💾</button>
        </div>
    </div>
    
    <div class="canvas-container">
        <div class="canvas-wrapper">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
    </div>
    
    <div class="layer-panel">
        <h3>📑 レイヤー</h3>
        <div class="layers" id="layers"></div>
        <div class="layer-controls">
            <button class="layer-btn" id="add-layer">+ 追加</button>
            <button class="layer-btn" id="delete-layer">削除</button>
            <button class="layer-btn" id="merge-layers">結合</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
