<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .upload-area {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .upload-area:hover,
        .upload-area.dragover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            font-weight: 500;
        }

        .visualizer-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 30px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        button.active {
            background: rgba(76, 175, 80, 0.4);
            border-color: rgba(76, 175, 80, 0.6);
        }

        .info {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 15px;
            text-align: center;
        }

        .wave-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            opacity: 0.8;
        }

        svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="audio/*">
            <div class="upload-text">📁 Drag & drop your audio file here or click to select</div>
        </div>

        <div class="visualizer-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <button id="playBtn" class="active">▶ Play</button>
            <button id="pauseBtn">⏸ Pause</button>
            <button id="stopBtn">⏹ Stop</button>
        </div>

        <div class="info">
            <p>Supported formats: MP3, WAV, OGG, FLAC</p>
            <p id="filename">No audio file loaded</p>
        </div>
    </div>

    <div class="wave-container" id="waveContainer"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const filenameDisplay = document.getElementById('filename');
        const waveContainer = document.getElementById('waveContainer');

        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let bufferLength = null;
        let audioElement = null;
        let source = null;
        let isPlaying = false;

        // Set canvas size
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Initialize Web Audio API
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
        }

        // Handle file upload
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                loadAudio(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                loadAudio(e.target.files[0]);
            }
        });

        // Load audio file
        function loadAudio(file) {
            initAudioContext();
            
            const url = URL.createObjectURL(file);
            
            // Create audio element
            if (audioElement) {
                audioElement.pause();
            }
            
            audioElement = new Audio();
            audioElement.src = url;
            audioElement.crossOrigin = 'anonymous';
            
            // Create source and connect to analyser
            if (source) {
                source.disconnect();
            }
            
            source = audioContext.createMediaElementAudioSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            
            filenameDisplay.textContent = `Now loaded: ${file.name}`;
            isPlaying = false;
            updateButtonStates();
            animate();
        }

        // Playback controls
        playBtn.addEventListener('click', () => {
            if (!audioElement) return;
            initAudioContext();
            audioContext.resume().then(() => {
                audioElement.play();
                isPlaying = true;
                updateButtonStates();
            });
        });

        pauseBtn.addEventListener('click', () => {
            if (!audioElement) return;
            audioElement.pause();
            isPlaying = false;
            updateButtonStates();
        });

        stopBtn.addEventListener('click', () => {
            if (!audioElement) return;
            audioElement.pause();
            audioElement.currentTime = 0;
            isPlaying = false;
            updateButtonStates();
        });

        audioElement?.addEventListener('ended', () => {
            isPlaying = false;
            updateButtonStates();
        });

        function updateButtonStates() {
            playBtn.classList.toggle('active', isPlaying);
            pauseBtn.classList.toggle('active', !isPlaying && audioElement?.currentTime > 0);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            if (!analyser) return;
            
            analyser.getByteFrequencyData(dataArray);
            
            // Clear canvas with gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1e3c72');
            gradient.addColorStop(1, '#2a5298');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw circle with animated colors
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 80;
            
            // Animated hue based on audio
            const hue = (Date.now() / 50 + dataArray[0] / 255 * 360) % 360;
            
            // Draw filled circle with gradient
            const circleGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            circleGradient.addColorStop(0, `hsla(${hue}, 100%, 60%, 0.8)`);
            circleGradient.addColorStop(1, `hsla(${(hue + 60) % 360}, 100%, 40%, 0.4)`);
            
            ctx.fillStyle = circleGradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw frequency bars around circle
            const barCount = bufferLength;
            for (let i = 0; i < barCount; i++) {
                const angle = (i / barCount) * Math.PI * 2;
                const barHeight = (dataArray[i] / 255) * 100;
                
                const x1 = centerX + Math.cos(angle) * radius;
                const y1 = centerY + Math.sin(angle) * radius;
                const x2 = centerX + Math.cos(angle) * (radius + barHeight);
                const y2 = centerY + Math.sin(angle) * (radius + barHeight);
                
                const barHue = (hue + (i / barCount) * 360) % 360;
                ctx.strokeStyle = `hsla(${barHue}, 100%, 50%, 0.8)`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }

        // Create animated wave SVG at bottom
        function createWaveSVG() {
            const svg = `
                <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#2196F3;stop-opacity:0.4" />
                        </linearGradient>
                    </defs>
                    <path d="M0,60 Q150,20 300,60 T600,60 T900,60 T1200,60 L1200,120 L0,120 Z" 
                          fill="url(#waveGrad)" 
                          class="wave"
                          style="animation: wave 8s linear infinite;">
                    </path>
                    <path d="M0,60 Q150,30 300,60 T600,60 T900,60 T1200,60 L1200,120 L0,120 Z" 
                          fill="url(#waveGrad)" 
                          opacity="0.5"
                          class="wave"
                          style="animation: wave 12s linear infinite reverse;">
                    </path>
                </svg>
            `;
            
            waveContainer.innerHTML = svg;
            
            // Add animation if not already in styles
            if (!document.querySelector('style[data-wave-animation]')) {
                const style = document.createElement('style');
                style.setAttribute('data-wave-animation', 'true');
                style.textContent = `
                    @keyframes wave {
                        0% {
                            transform: translateX(0);
                        }
                        100% {
                            transform: translateX(300px);
                        }
                    }
                `;
                document.head.appendChild(style);
            }
        }

        createWaveSVG();
        animate();
    </script>
</body>
</html>
