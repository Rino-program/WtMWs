<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音楽ビジュアライザー - Audio Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    
    <canvas id="canvas"></canvas>
    
    <div class="track-info" id="track-info">
        <h2>🎵 音楽ビジュアライザー</h2>
        <p>音楽ファイルをアップロードまたはマイク入力で開始</p>
    </div>
    
    <!-- 設定パネル -->
    <div class="settings-panel" id="settings-panel">
        <div class="settings-header" id="settings-toggle">
            <h3>⚙️ 設定</h3>
            <span class="toggle-icon">▼</span>
        </div>
        
        <div class="settings-content" id="settings-content">
            <!-- 入力モード切替 -->
            <div class="option-group">
                <label>入力モード</label>
                <div class="mode-switcher">
                    <button class="mode-btn active" id="file-mode-btn" data-mode="file">📁 ファイル</button>
                    <button class="mode-btn" id="mic-mode-btn" data-mode="mic">🎤 マイク</button>
                </div>
            </div>
            
            <!-- ビジュアルモード -->
            <div class="option-group">
                <label>表示モード</label>
                <div class="viz-mode-buttons">
                    <button class="viz-btn active" data-mode="bars">バー</button>
                    <button class="viz-btn" data-mode="wave">波形</button>
                    <button class="viz-btn" data-mode="circle">サークル</button>
                    <button class="viz-btn" data-mode="particles">粒子</button>
                    <button class="viz-btn" data-mode="spectrogram">スペクトログラム</button>
                </div>
            </div>
            
            <!-- カラーテーマ -->
            <div class="option-group">
                <label>カラーテーマ</label>
                <div class="color-theme-buttons">
                    <button class="theme-btn active" data-theme="rainbow">🌈 レインボー</button>
                    <button class="theme-btn" data-theme="neon">💜 ネオン</button>
                    <button class="theme-btn" data-theme="ocean">🌊 オーシャン</button>
                    <button class="theme-btn" data-theme="sunset">🌅 サンセット</button>
                    <button class="theme-btn" data-theme="mono">⚪ モノクロ</button>
                </div>
            </div>
            
            <!-- 感度 -->
            <div class="option-group">
                <label>感度: <span id="sensitivity-value">1.0</span></label>
                <input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1" class="slider">
            </div>
            
            <!-- バーの数 -->
            <div class="option-group">
                <label>バーの数: <span id="bar-count-value">64</span></label>
                <input type="range" id="bar-count" min="16" max="256" step="8" value="64" class="slider">
            </div>
            
            <!-- アニメーション速度 -->
            <div class="option-group">
                <label>アニメーション速度: <span id="animation-speed-value">1.0</span>x</label>
                <input type="range" id="animation-speed" min="0.5" max="2" step="0.1" value="1" class="slider">
            </div>
            
            <!-- 背景の透明度 -->
            <div class="option-group">
                <label>トレイル効果: <span id="bg-opacity-value">80</span>%</label>
                <input type="range" id="bg-opacity" min="0" max="100" step="5" value="80" class="slider">
            </div>
            
            <!-- フルスクリーン -->
            <div class="option-group">
                <button class="fullscreen-btn" id="fullscreen-btn">⛶ フルスクリーン</button>
            </div>
        </div>
    </div>
    
    <!-- コントロール -->
    <div class="controls" id="controls">
        <!-- ファイルアップロード -->
        <div class="upload-area" id="upload-area">
            <h3>🎵 音楽をドロップ または クリック</h3>
            <p>MP3, WAV, OGG対応</p>
            <input type="file" id="file-input" accept="audio/*">
        </div>
        
        <!-- マイクコントロール -->
        <div class="mic-control" id="mic-control" style="display: none;">
            <button class="mic-start-btn" id="mic-start-btn">🎤 マイク開始</button>
            <div class="mic-level">
                <div class="mic-level-bar" id="mic-level-bar"></div>
            </div>
            <p class="mic-status" id="mic-status">マイクをクリックして開始</p>
        </div>
        
        <!-- 再生コントロール -->
        <div class="playback-controls" id="playback-controls" style="display: none;">
            <button class="play-btn" id="play-btn">▶</button>
            <span class="time" id="current-time">0:00</span>
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="time" id="duration">0:00</span>
            <div class="volume-control">
                <span class="volume-icon" id="volume-icon">🔊</span>
                <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.1" value="1">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
