<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quotes - 名言生成</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>💬 名言ジェネレーター</h1>
<div class="daily-quote">
<span>✨ 今日の名言</span> - 毎日1つの名言をお届け
</div>
<div class="quote-card" id="quoteCard">
<div class="quote-text" id="quoteText">「千里の道も一歩から」</div>
<div class="quote-author" id="quoteAuthor">老子</div>
<div class="category-badge" id="categoryBadge">人生</div>
</div>
<div class="controls">
<button onclick="newQuote()">🎲 ランダム名言</button>
<button onclick="toggleFavorite()" id="favBtn" class="secondary">❤️ お気に入り</button>
<button onclick="shareQuote()" class="secondary">📤 シェア</button>
<button onclick="copyQuote()" class="secondary">📋 コピー</button>
</div>
<div class="categories">
<button class="active" data-cat="all">すべて</button>
<button data-cat="life">人生</button>
<button data-cat="success">成功</button>
<button data-cat="love">愛</button>
<button data-cat="wisdom">知恵</button>
<button data-cat="motivation">モチベーション</button>
<button data-cat="humor">ユーモア</button>
</div>
<div class="favorites" id="favoritesSection">
<h2>⭐ お気に入り <span id="favCount">0件</span></h2>
<div class="favorites-list" id="favoritesList"></div>
</div>
<div class="share-modal" id="shareModal">
<div class="share-content">
<h3>📤 シェア</h3>
<div class="share-preview" id="sharePreview"></div>
<div class="share-buttons">
<button style="background:#1DA1F2;color:#fff" onclick="shareTwitter()">Twitter</button>
<button style="background:#25D366;color:#fff" onclick="shareLine()">LINE</button>
<button style="background:#666;color:#fff" onclick="closeShare()">閉じる</button>
</div>
</div>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script src="script.js"></script>
</body>
</html>
