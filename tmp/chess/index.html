<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チェス - Chess Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>♔ チェスゲーム ♚</h1>
    
    <div class="game-container">
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>
        
        <div class="side-panel">
            <div class="status white-turn" id="status">白のターン</div>
            
            <div class="captured">
                <h3>取られた白の駒</h3>
                <div class="captured-pieces" id="captured-white"></div>
            </div>
            
            <div class="captured">
                <h3>取られた黒の駒</h3>
                <div class="captured-pieces" id="captured-black"></div>
            </div>
            
            <div class="history">
                <h3>棋譜</h3>
                <div class="move-list" id="move-list"></div>
            </div>
            
            <div class="controls">
                <button class="btn" onclick="newGame()">新しいゲーム</button>
                <button class="btn secondary" onclick="undoMove()">待った</button>
            </div>
        </div>
    </div>
    
    <div class="promotion-modal" id="promotion-modal">
        <div class="promotion-choices">
            <h3>駒を選択してください</h3>
            <div class="promotion-pieces" id="promotion-pieces"></div>
        </div>
    </div>
    
    <div class="game-over-modal" id="game-over-modal">
        <div class="game-over-content">
            <h2 id="game-over-title">ゲーム終了</h2>
            <p id="game-over-message"></p>
            <button class="btn" onclick="newGame()">もう一度プレイ</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
