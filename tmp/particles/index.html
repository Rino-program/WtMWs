<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パーティクルギャラクシー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <h3>🌌 コントロール</h3>
        <div class="control-group">
            <label>モード</label>
            <select id="mode">
                <option value="attract">引力モード</option>
                <option value="repel">斥力モード</option>
                <option value="orbit">軌道モード</option>
                <option value="swarm">群れモード</option>
                <option value="firework">花火モード</option>
            </select>
        </div>
        <div class="control-group">
            <label>パーティクル数: <span id="countVal">400</span></label>
            <input type="range" id="particleCount" min="100" max="1500" value="400">
        </div>
        <div class="control-group">
            <label>力の強さ: <span id="gravVal">0.5</span></label>
            <input type="range" id="gravity" min="0" max="2" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label>色相: <span id="hueVal">0</span></label>
            <input type="range" id="hue" min="0" max="360" value="0">
        </div>
        <div class="control-group">
            <label>軌跡: <span id="trailVal">0.05</span></label>
            <input type="range" id="trail" min="0.01" max="0.3" step="0.01" value="0.05">
        </div>
        <div>
            <button class="btn" id="reset">リセット</button>
            <button class="btn" id="explode">爆発</button>
        </div>
    </div>
    <a href="../" class="back-link">← 戻る</a>
    <div class="info">マウスを動かしてパーティクルを操作 | クリックで追加</div>

    <script src="script.js"></script>
</body>
</html>
