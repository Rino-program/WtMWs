<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Calculator - 電卓</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="calculator" id="calculator">
<h1>🔢 電卓</h1>

<!-- モード切替 -->
<div class="mode-switch">
<button class="active" data-mode="basic">基本</button>
<button data-mode="scientific">関数</button>
</div>

<!-- 角度モード切替（関数電卓モードのみ表示） -->
<div class="angle-mode" id="angleMode">
<button class="active" data-angle="deg">DEG</button>
<button data-angle="rad">RAD</button>
</div>

<!-- ディスプレイ -->
<div class="display">
<div class="expression" id="expression"></div>
<div class="result" id="result">0</div>
</div>

<!-- メモリ機能 -->
<div class="memory-buttons" id="memoryButtons">
<button class="btn btn-memory" data-mem="mc">MC</button>
<button class="btn btn-memory" data-mem="mr">MR</button>
<button class="btn btn-memory" data-mem="m+">M+</button>
<button class="btn btn-memory" data-mem="m-">M-</button>
<button class="btn btn-memory" data-mem="ms">MS</button>
</div>

<!-- 関数電卓ボタン -->
<div class="scientific" id="scientific">
<!-- 行1: 三角関数 -->
<button class="btn btn-trig" data-func="sin">sin</button>
<button class="btn btn-trig" data-func="cos">cos</button>
<button class="btn btn-trig" data-func="tan">tan</button>
<button class="btn btn-trig" data-func="asin">sin⁻¹</button>
<button class="btn btn-trig" data-func="acos">cos⁻¹</button>
<button class="btn btn-trig" data-func="atan">tan⁻¹</button>
<!-- 行2: 対数・指数 -->
<button class="btn btn-log" data-func="log">log</button>
<button class="btn btn-log" data-func="ln">ln</button>
<button class="btn btn-log" data-func="exp">eˣ</button>
<button class="btn btn-log" data-func="10pow">10ˣ</button>
<button class="btn btn-const" data-func="pi">π</button>
<button class="btn btn-const" data-func="e">e</button>
<!-- 行3: 累乗・ルート -->
<button class="btn btn-pow" data-func="pow2">x²</button>
<button class="btn btn-pow" data-func="pow3">x³</button>
<button class="btn btn-pow" data-func="pow">xⁿ</button>
<button class="btn btn-pow" data-func="sqrt">√</button>
<button class="btn btn-pow" data-func="cbrt">³√</button>
<button class="btn btn-pow" data-func="nroot">ⁿ√</button>
<!-- 行4: その他 -->
<button class="btn btn-other" data-func="abs">|x|</button>
<button class="btn btn-other" data-func="inv">1/x</button>
<button class="btn btn-other" data-func="fact">n!</button>
<button class="btn btn-bracket" data-func="(">(</button>
<button class="btn btn-bracket" data-func=")">)</button>
<button class="btn btn-other" data-func="mod">mod</button>
</div>

<!-- 基本ボタン -->
<div class="buttons">
<button class="btn btn-clear" id="clear">C</button>
<button class="btn btn-clear" id="clearEntry">CE</button>
<button class="btn btn-func" data-op="backspace">⌫</button>
<button class="btn btn-op" data-op="/">÷</button>
<button class="btn btn-num" data-num="7">7</button>
<button class="btn btn-num" data-num="8">8</button>
<button class="btn btn-num" data-num="9">9</button>
<button class="btn btn-op" data-op="*">×</button>
<button class="btn btn-num" data-num="4">4</button>
<button class="btn btn-num" data-num="5">5</button>
<button class="btn btn-num" data-num="6">6</button>
<button class="btn btn-op" data-op="-">−</button>
<button class="btn btn-num" data-num="1">1</button>
<button class="btn btn-num" data-num="2">2</button>
<button class="btn btn-num" data-num="3">3</button>
<button class="btn btn-op" data-op="+">+</button>
<button class="btn btn-sign" data-op="sign">±</button>
<button class="btn btn-num" data-num="0">0</button>
<button class="btn btn-num" data-num=".">.</button>
<button class="btn btn-op" data-op="percent">%</button>
<button class="btn btn-eq" id="equals">=</button>
</div>

<!-- 履歴 -->
<div class="history-section">
<div class="history-header">
<span>📜 履歴</span>
<button class="clear-history" id="clearHistory">クリア</button>
</div>
<div class="history" id="history"></div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
