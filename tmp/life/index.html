<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライフゲーム</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0d1117;overflow:hidden;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
        canvas{display:block;border:1px solid rgba(255,255,255,0.1);border-radius:5px;cursor:crosshair}
        .controls{position:fixed;top:20px;left:20px;background:rgba(0,0,0,0.8);padding:20px;border-radius:15px;color:#fff;z-index:10;border:1px solid rgba(255,255,255,0.1)}
        .controls h3{margin-bottom:15px;background:linear-gradient(90deg,#10ac84,#1dd1a1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .control-group{margin-bottom:12px}
        .control-group label{display:block;margin-bottom:5px;font-size:0.85rem;color:rgba(255,255,255,0.8)}
        select,input[type="range"]{width:150px;padding:5px;border-radius:8px;border:none;background:rgba(255,255,255,0.1);color:#fff;accent-color:#10ac84}
        .btn{background:linear-gradient(135deg,#10ac84,#1dd1a1);border:none;color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:0.8rem;margin:3px;transition:transform 0.2s}
        .btn:hover{transform:scale(1.05)}
        .btn.active{background:linear-gradient(135deg,#ee5a24,#f79f1f)}
        .back-link{position:fixed;top:20px;right:20px;color:#fff;text-decoration:none;background:rgba(255,255,255,0.1);padding:10px 20px;border-radius:25px;z-index:10}
        .back-link:hover{background:rgba(255,255,255,0.2)}
        .stats{position:fixed;bottom:20px;left:20px;color:rgba(255,255,255,0.6);font-size:0.8rem;background:rgba(0,0,0,0.5);padding:10px 15px;border-radius:10px}
        .presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <h3>🧬 ライフゲーム</h3>
        <div class="control-group">
            <label>ルール</label>
            <select id="rule">
                <option value="conway">Conway's Life</option>
                <option value="highlife">HighLife</option>
                <option value="daynight">Day & Night</option>
                <option value="seeds">Seeds</option>
                <option value="maze">Maze</option>
            </select>
        </div>
        <div class="control-group">
            <label>速度: <span id="speedVal">10</span> fps</label>
            <input type="range" id="speed" min="1" max="60" value="10">
        </div>
        <div class="control-group">
            <label>セルサイズ: <span id="sizeVal">8</span></label>
            <input type="range" id="cellSize" min="4" max="20" value="8">
        </div>
        <div>
            <button class="btn" id="playPause">▶ 再生</button>
            <button class="btn" id="step">1ステップ</button>
            <button class="btn" id="clear">クリア</button>
            <button class="btn" id="random">ランダム</button>
        </div>
        <div class="presets">
            <button class="btn" data-pattern="glider">グライダー</button>
            <button class="btn" data-pattern="pulsar">パルサー</button>
            <button class="btn" data-pattern="spaceship">宇宙船</button>
            <button class="btn" data-pattern="gosper">ゴスパー銃</button>
        </div>
    </div>
    
    <a href="../" class="back-link">← 戻る</a>
    <div class="stats" id="stats">世代: 0 | 生存: 0</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stats = document.getElementById('stats');
        
        let cellSize = 8, cols, rows, grid, nextGrid;
        let running = false, generation = 0, interval;
        let fps = 10, rule = 'conway';
        let isDrawing = false, drawState = 1;
        
        const rules = {
            conway: { birth: [3], survive: [2, 3] },
            highlife: { birth: [3, 6], survive: [2, 3] },
            daynight: { birth: [3, 6, 7, 8], survive: [3, 4, 6, 7, 8] },
            seeds: { birth: [2], survive: [] },
            maze: { birth: [3], survive: [1, 2, 3, 4, 5] }
        };
        
        const patterns = {
            glider: [[0,1],[1,2],[2,0],[2,1],[2,2]],
            pulsar: (() => {
                const p = [];
                const offsets = [[2,0],[3,0],[4,0],[0,2],[0,3],[0,4],[5,2],[5,3],[5,4],[2,5],[3,5],[4,5]];
                for (let qx = 0; qx < 2; qx++) {
                    for (let qy = 0; qy < 2; qy++) {
                        offsets.forEach(([x, y]) => {
                            p.push([x + qx * 7, y + qy * 7]);
                        });
                    }
                }
                return p;
            })(),
            spaceship: [[0,1],[0,2],[1,0],[1,1],[1,2],[1,3],[2,0],[2,1],[2,3],[2,4],[3,2],[3,3]],
            gosper: [[0,4],[0,5],[1,4],[1,5],[10,4],[10,5],[10,6],[11,3],[11,7],[12,2],[12,8],[13,2],[13,8],[14,5],[15,3],[15,7],[16,4],[16,5],[16,6],[17,5],[20,2],[20,3],[20,4],[21,2],[21,3],[21,4],[22,1],[22,5],[24,0],[24,1],[24,5],[24,6],[34,2],[34,3],[35,2],[35,3]]
        };
        
        const resize = () => {
            canvas.width = Math.min(800, innerWidth - 40);
            canvas.height = Math.min(600, innerHeight - 100);
            cols = Math.floor(canvas.width / cellSize);
            rows = Math.floor(canvas.height / cellSize);
            initGrid();
        };
        
        const initGrid = () => {
            grid = Array(rows).fill().map(() => Array(cols).fill(0));
            nextGrid = Array(rows).fill().map(() => Array(cols).fill(0));
            generation = 0;
        };
        
        const countNeighbors = (x, y) => {
            let count = 0;
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = (x + dx + cols) % cols;
                    const ny = (y + dy + rows) % rows;
                    count += grid[ny][nx];
                }
            }
            return count;
        };
        
        const step = () => {
            const r = rules[rule];
            let alive = 0;
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const n = countNeighbors(x, y);
                    const cell = grid[y][x];
                    
                    if (cell === 0 && r.birth.includes(n)) nextGrid[y][x] = 1;
                    else if (cell === 1 && r.survive.includes(n)) nextGrid[y][x] = 1;
                    else nextGrid[y][x] = 0;
                    
                    if (nextGrid[y][x]) alive++;
                }
            }
            
            [grid, nextGrid] = [nextGrid, grid];
            generation++;
            stats.textContent = `世代: ${generation} | 生存: ${alive}`;
        };
        
        const draw = () => {
            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y][x]) {
                        const hue = (x + y + generation * 2) % 360;
                        ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
                        ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
                    }
                }
            }
            
            // グリッド線（オプション）
            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= cols; x++) {
                ctx.beginPath();
                ctx.moveTo(x * cellSize, 0);
                ctx.lineTo(x * cellSize, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= rows; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * cellSize);
                ctx.lineTo(canvas.width, y * cellSize);
                ctx.stroke();
            }
        };
        
        const placePattern = (pattern, cx, cy) => {
            pattern.forEach(([dx, dy]) => {
                const x = (cx + dx) % cols;
                const y = (cy + dy) % rows;
                if (x >= 0 && y >= 0) grid[y][x] = 1;
            });
        };
        
        const toggleCell = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / cellSize);
            const y = Math.floor((e.clientY - rect.top) / cellSize);
            if (x >= 0 && x < cols && y >= 0 && y < rows) {
                grid[y][x] = drawState;
                draw();
            }
        };
        
        const startStop = () => {
            running = !running;
            document.getElementById('playPause').textContent = running ? '⏸ 停止' : '▶ 再生';
            document.getElementById('playPause').classList.toggle('active', running);
            
            if (running) {
                const loop = () => {
                    if (!running) return;
                    step();
                    draw();
                    setTimeout(loop, 1000 / fps);
                };
                loop();
            }
        };
        
        canvas.addEventListener('mousedown', e => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / cellSize);
            const y = Math.floor((e.clientY - rect.top) / cellSize);
            if (x >= 0 && x < cols && y >= 0 && y < rows) {
                drawState = grid[y][x] ? 0 : 1;
                isDrawing = true;
                toggleCell(e);
            }
        });
        canvas.addEventListener('mousemove', e => { if (isDrawing) toggleCell(e); });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);
        
        document.getElementById('playPause').addEventListener('click', startStop);
        document.getElementById('step').addEventListener('click', () => { step(); draw(); });
        document.getElementById('clear').addEventListener('click', () => { initGrid(); draw(); });
        document.getElementById('random').addEventListener('click', () => {
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    grid[y][x] = Math.random() < 0.3 ? 1 : 0;
                }
            }
            generation = 0;
            draw();
        });
        
        document.getElementById('rule').addEventListener('change', e => rule = e.target.value);
        document.getElementById('speed').addEventListener('input', e => {
            fps = +e.target.value;
            document.getElementById('speedVal').textContent = fps;
        });
        document.getElementById('cellSize').addEventListener('input', e => {
            cellSize = +e.target.value;
            document.getElementById('sizeVal').textContent = cellSize;
            resize();
            draw();
        });
        
        document.querySelectorAll('[data-pattern]').forEach(btn => {
            btn.addEventListener('click', () => {
                const pattern = patterns[btn.dataset.pattern];
                const cx = Math.floor(cols / 2) - 10;
                const cy = Math.floor(rows / 2) - 5;
                placePattern(pattern, cx, cy);
                draw();
            });
        });
        
        addEventListener('resize', () => { resize(); draw(); });
        
        resize();
        draw();
    </script>
</body>
</html>
