<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライフゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <h3>🧬 ライフゲーム</h3>
        <div class="control-group">
            <label>ルール</label>
            <select id="rule">
                <option value="conway">Conway's Life</option>
                <option value="highlife">HighLife</option>
                <option value="daynight">Day & Night</option>
                <option value="seeds">Seeds</option>
                <option value="maze">Maze</option>
            </select>
        </div>
        <div class="control-group">
            <label>速度: <span id="speedVal">10</span> fps</label>
            <input type="range" id="speed" min="1" max="60" value="10">
        </div>
        <div class="control-group">
            <label>セルサイズ: <span id="sizeVal">8</span></label>
            <input type="range" id="cellSize" min="4" max="20" value="8">
        </div>
        <div>
            <button class="btn" id="playPause">▶ 再生</button>
            <button class="btn" id="step">1ステップ</button>
            <button class="btn" id="clear">クリア</button>
            <button class="btn" id="random">ランダム</button>
        </div>
        <div class="presets">
            <button class="btn" data-pattern="glider">グライダー</button>
            <button class="btn" data-pattern="pulsar">パルサー</button>
            <button class="btn" data-pattern="spaceship">宇宙船</button>
            <button class="btn" data-pattern="gosper">ゴスパー銃</button>
        </div>
    </div>
    
    <a href="../" class="back-link">← 戻る</a>
    <div class="stats" id="stats">世代: 0 | 生存: 0</div>

    <script src="script.js"></script>
</body>
</html>
