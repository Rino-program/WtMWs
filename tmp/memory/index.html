<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Memory Game - 神経衰弱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px;touch-action:manipulation}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
.back:hover{opacity:1}
h1{font-size:clamp(1.3rem,4vw,1.8rem);margin:20px 0 15px;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.game-options{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.game-options select{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 15px;border-radius:8px;font-size:0.85rem}
.stats{display:flex;gap:15px;margin-bottom:15px;flex-wrap:wrap;justify-content:center}
.stat{background:rgba(255,255,255,0.08);padding:10px 18px;border-radius:10px;text-align:center;min-width:70px}
.stat-val{font-size:1.4rem;color:#4facfe;font-weight:bold}
.stat-label{font-size:0.7rem;color:#aaa}
.combo-display{height:30px;margin-bottom:10px;font-size:1.2rem;color:#ffd700;text-align:center}
.board{display:grid;gap:8px;max-width:500px;width:100%;perspective:1000px}
.card{aspect-ratio:1;border-radius:12px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1)}
.card.flipped{transform:rotateY(180deg)}
.card.matched{pointer-events:none}
.card.matched .card-front{background:linear-gradient(135deg,#43e97b,#38f9d7);animation:matchPulse 0.5s ease}
@keyframes matchPulse{50%{transform:rotateY(180deg) scale(1.1)}}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center}
.card-back{background:linear-gradient(135deg,#2d2d44,#1a1a2e);border:2px solid rgba(255,255,255,0.1)}
.card-back::before{content:'?';font-size:clamp(1.5rem,5vw,2rem);color:rgba(255,255,255,0.3)}
.card-front{background:linear-gradient(135deg,#667eea,#764ba2);transform:rotateY(180deg);font-size:clamp(1.5rem,6vw,2.5rem)}
.hint-btn{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#fa709a,#fee140);border:none;font-size:1.2rem;cursor:pointer;z-index:50;box-shadow:0 4px 15px rgba(0,0,0,0.3);transition:transform 0.2s}
.hint-btn:active{transform:scale(0.95)}
.hint-btn:disabled{opacity:0.5;cursor:not-allowed}
.hint-count{position:absolute;top:-5px;right:-5px;background:#f5576c;color:#fff;width:20px;height:20px;border-radius:50%;font-size:0.7rem;display:flex;align-items:center;justify-content:center}
.result{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.result.show{display:flex}
.result h2{font-size:2rem;margin-bottom:20px;color:#4facfe}
.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:25px;max-width:350px;width:100%}
.result-stat{background:rgba(255,255,255,0.08);padding:20px;border-radius:12px;text-align:center}
.result-stat .val{font-size:1.8rem;color:#4facfe;font-weight:bold}
.result-stat .label{color:#aaa;margin-top:8px;font-size:0.85rem}
.result-stat.best{border:2px solid #ffd700}
.result-stat.best .val{color:#ffd700}
.result button{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:14px 35px;border-radius:10px;font-size:1rem;cursor:pointer;margin:5px}
.result .secondary{background:rgba(255,255,255,0.1)}
.stars{position:fixed;pointer-events:none;z-index:300}
.star{position:absolute;font-size:2rem;animation:starFall 1s ease-out forwards}
@keyframes starFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(100px) rotate(180deg)}}
.leaderboard{margin-top:20px;width:100%;max-width:350px}
.leaderboard h3{font-size:0.9rem;color:#888;margin-bottom:10px;text-align:center}
.leaderboard-list{max-height:150px;overflow-y:auto}
.leaderboard-item{display:flex;justify-content:space-between;padding:10px 15px;background:rgba(255,255,255,0.05);border-radius:8px;margin-bottom:5px;font-size:0.85rem}
.leaderboard-item.highlight{background:rgba(79,172,254,0.2);border:1px solid #4facfe}
.leaderboard-item .rank{color:#ffd700;font-weight:bold;width:30px}
.leaderboard-item .size{color:#888}
.leaderboard-item .score{color:#4facfe}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>🃏 神経衰弱</h1>
<div class="game-options">
<select id="sizeSelect">
<option value="3">3x3 (簡単)</option>
<option value="4" selected>4x4 (普通)</option>
<option value="5">5x5 (難しい)</option>
<option value="6">6x6 (超難)</option>
</select>
<select id="themeSelect">
<option value="emoji">絵文字</option>
<option value="animals">動物</option>
<option value="food">食べ物</option>
<option value="symbols">記号</option>
<option value="flags">国旗</option>
</select>
<select id="modeSelect">
<option value="classic">クラシック</option>
<option value="timeattack">タイムアタック</option>
<option value="zen">ZENモード</option>
</select>
</div>
<div class="stats">
<div class="stat"><div class="stat-val" id="moves">0</div><div class="stat-label">手数</div></div>
<div class="stat"><div class="stat-val" id="pairs">0</div><div class="stat-label">ペア</div></div>
<div class="stat"><div class="stat-val" id="time">0:00</div><div class="stat-label" id="timeLabel">時間</div></div>
<div class="stat"><div class="stat-val" id="combo">x1</div><div class="stat-label">コンボ</div></div>
</div>
<div class="combo-display" id="comboDisplay"></div>
<div class="board" id="board"></div>
<button class="hint-btn" id="hintBtn" onclick="useHint()">💡<span class="hint-count" id="hintCount">3</span></button>
<div class="result" id="result">
<h2>🎉 クリア!</h2>
<div class="result-stats" id="resultStats"></div>
<div>
<button onclick="restart()">もう一度</button>
<button class="secondary" onclick="changeDifficulty()">難易度変更</button>
</div>
<div class="leaderboard">
<h3>🏆 ランキング</h3>
<div class="leaderboard-list" id="leaderboard"></div>
</div>
</div>
<div class="stars" id="stars"></div>
<script>
const themes={
    emoji:['🍎','🍊','🍋','🍇','🍓','🍒','🥝','🍑','🌸','🌻','🌈','⭐','🌙','❄️','🔥','💎','🎀','🎈'],
    animals:['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦'],
    food:['🍕','🍔','🍟','🌭','🍿','🧀','🥚','🍳','🥓','🥞','🧇','🍞','🥐','🥨','🥯','🍩','🍪','🎂'],
    symbols:['♠️','♥️','♦️','♣️','🔴','🟠','🟡','🟢','🔵','🟣','⚫','⬜','🔶','🔷','🔺','🔻','💠','🔘'],
    flags:['🇯🇵','🇺🇸','🇬🇧','🇫🇷','🇩🇪','🇮🇹','🇪🇸','🇨🇳','🇰🇷','🇧🇷','🇦🇺','🇨🇦','🇷🇺','🇮🇳','🇲🇽','🇳🇱','🇸🇪','🇨🇭']
};

let size=4,theme='emoji',mode='classic';
let cards=[],flipped=[],matched=0,moves=0,combo=1,maxCombo=1;
let timer=null,seconds=0,timeLimit=0,hints=3;
let canFlip=true,gameStarted=false;
let leaderboard=JSON.parse(localStorage.getItem('memoryLeaderboard')||'[]');

const audioCtx=new(window.AudioContext||window.webkitAudioContext)();
function playSound(freq,dur=0.1){
    try{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        osc.frequency.value=freq;
        osc.connect(gain);gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.15,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);
        osc.start();osc.stop(audioCtx.currentTime+dur);
    }catch{}
}

document.getElementById('sizeSelect').onchange=e=>{size=+e.target.value;restart()};
document.getElementById('themeSelect').onchange=e=>{theme=e.target.value;restart()};
document.getElementById('modeSelect').onchange=e=>{
    mode=e.target.value;
    document.getElementById('timeLabel').textContent=mode==='timeattack'?'残り時間':'時間';
    restart();
};

function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.random()*(i+1)|0;
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}

function createBoard(){
    const board=document.getElementById('board');
    board.innerHTML='';
    board.style.gridTemplateColumns=`repeat(${size},1fr)`;
    
    const totalCards=size*size;
    const pairs=Math.floor(totalCards/2);
    const selected=shuffle([...themes[theme]]).slice(0,pairs);
    
    // For odd number of cards, add one extra card
    cards=shuffle([...selected,...selected,...(totalCards%2?[selected[0]]:[]));
    
    cards.forEach((emoji,i)=>{
        const card=document.createElement('div');
        card.className='card';
        card.dataset.idx=i;
        card.innerHTML=`
            <div class="card-face card-back"></div>
            <div class="card-face card-front">${emoji}</div>
        `;
        card.onclick=()=>flipCard(i);
        board.appendChild(card);
    });
}

function flipCard(idx){
    if(!canFlip||flipped.includes(idx))return;
    const cardEls=[...document.querySelectorAll('.card')];
    if(cardEls[idx].classList.contains('matched'))return;
    
    if(!gameStarted){
        gameStarted=true;
        if(mode==='timeattack'){
            timeLimit={3:30,4:60,5:120,6:180}[size];
            seconds=timeLimit;
            timer=setInterval(()=>{
                seconds--;
                updateTime();
                if(seconds<=0)timeUp();
            },1000);
        }else if(mode!=='zen'){
            timer=setInterval(()=>{
                seconds++;
                updateTime();
            },1000);
        }
    }
    
    cardEls[idx].classList.add('flipped');
    flipped.push(idx);
    playSound(440+flipped.length*100);
    
    if(flipped.length===2){
        moves++;
        document.getElementById('moves').textContent=moves;
        canFlip=false;
        
        const[a,b]=flipped;
        if(cards[a]===cards[b]){
            setTimeout(()=>{
                cardEls[a].classList.add('matched');
                cardEls[b].classList.add('matched');
                matched++;
                combo++;
                if(combo>maxCombo)maxCombo=combo;
                
                document.getElementById('pairs').textContent=matched;
                document.getElementById('combo').textContent='x'+combo;
                
                if(combo>=3)showComboEffect(combo);
                playSound(880,0.15);
                
                flipped=[];
                canFlip=true;
                
                const totalPairs=Math.floor(size*size/2);
                if(matched>=totalPairs)endGame();
            },300);
        }else{
            combo=1;
            document.getElementById('combo').textContent='x1';
            setTimeout(()=>{
                cardEls[a].classList.remove('flipped');
                cardEls[b].classList.remove('flipped');
                flipped=[];
                canFlip=true;
            },800);
        }
    }
}

function showComboEffect(c){
    const el=document.getElementById('comboDisplay');
    el.textContent=`🔥 ${c}x COMBO!`;
    el.style.animation='none';
    void el.offsetWidth;
    el.style.animation='pulse 0.5s ease';
    setTimeout(()=>el.textContent='',1500);
}

function useHint(){
    if(hints<=0||!canFlip)return;
    hints--;
    document.getElementById('hintCount').textContent=hints;
    if(hints<=0)document.getElementById('hintBtn').disabled=true;
    
    const cardEls=[...document.querySelectorAll('.card')];
    const unmatched=cardEls.filter(c=>!c.classList.contains('matched')&&!c.classList.contains('flipped'));
    if(unmatched.length<2)return;
    
    // Find a matching pair
    for(let i=0;i<unmatched.length;i++){
        for(let j=i+1;j<unmatched.length;j++){
            const idx1=+unmatched[i].dataset.idx;
            const idx2=+unmatched[j].dataset.idx;
            if(cards[idx1]===cards[idx2]){
                unmatched[i].classList.add('flipped');
                unmatched[j].classList.add('flipped');
                setTimeout(()=>{
                    unmatched[i].classList.remove('flipped');
                    unmatched[j].classList.remove('flipped');
                },1000);
                return;
            }
        }
    }
}

function updateTime(){
    const m=Math.floor(Math.abs(seconds)/60);
    const s=Math.abs(seconds)%60;
    document.getElementById('time').textContent=`${m}:${s.toString().padStart(2,'0')}`;
    if(mode==='timeattack'&&seconds<=10){
        document.getElementById('time').style.color='#f5576c';
    }
}

function timeUp(){
    clearInterval(timer);
    document.getElementById('result').querySelector('h2').textContent='⏰ 時間切れ!';
    showResult(false);
}

function endGame(){
    clearInterval(timer);
    createStars();
    playSound(523);setTimeout(()=>playSound(659),100);setTimeout(()=>playSound(784),200);
    
    const score=calculateScore();
    saveToLeaderboard(score);
    showResult(true,score);
}

function calculateScore(){
    const baseScore=1000;
    const movesPenalty=moves*10;
    const timePenalty=mode==='zen'?0:seconds*(mode==='timeattack'?-10:5);
    const comboBonus=maxCombo*50;
    const sizeBonus=size*size*20;
    return Math.max(0,baseScore-movesPenalty-timePenalty+comboBonus+sizeBonus);
}

function saveToLeaderboard(score){
    const entry={
        score,
        moves,
        time:seconds,
        size:`${size}x${size}`,
        date:Date.now()
    };
    leaderboard.push(entry);
    leaderboard.sort((a,b)=>b.score-a.score);
    leaderboard=leaderboard.slice(0,20);
    localStorage.setItem('memoryLeaderboard',JSON.stringify(leaderboard));
}

function showResult(won,score=0){
    const m=Math.floor(seconds/60);
    const s=seconds%60;
    const efficiency=Math.round((matched/(moves||1))*100);
    
    document.getElementById('resultStats').innerHTML=`
        <div class="result-stat"><div class="val">${moves}</div><div class="label">手数</div></div>
        <div class="result-stat"><div class="val">${m}:${s.toString().padStart(2,'0')}</div><div class="label">時間</div></div>
        <div class="result-stat"><div class="val">x${maxCombo}</div><div class="label">最大コンボ</div></div>
        <div class="result-stat${score>0?' best':''}"><div class="val">${score}</div><div class="label">スコア</div></div>
    `;
    
    document.getElementById('leaderboard').innerHTML=leaderboard.slice(0,5).map((e,i)=>`
        <div class="leaderboard-item${e.score===score?' highlight':''}">
            <span class="rank">#${i+1}</span>
            <span class="size">${e.size}</span>
            <span class="score">${e.score}pt</span>
        </div>
    `).join('');
    
    document.getElementById('result').classList.add('show');
}

function createStars(){
    const container=document.getElementById('stars');
    for(let i=0;i<10;i++){
        const star=document.createElement('div');
        star.className='star';
        star.textContent='⭐';
        star.style.left=Math.random()*100+'%';
        star.style.top=Math.random()*50+'%';
        star.style.animationDelay=Math.random()*0.5+'s';
        container.appendChild(star);
        setTimeout(()=>star.remove(),1500);
    }
}

function restart(){
    document.getElementById('result').classList.remove('show');
    clearInterval(timer);
    timer=null;
    seconds=0;
    moves=0;
    matched=0;
    combo=1;
    maxCombo=1;
    hints=3;
    flipped=[];
    canFlip=true;
    gameStarted=false;
    
    document.getElementById('moves').textContent='0';
    document.getElementById('pairs').textContent='0';
    document.getElementById('time').textContent='0:00';
    document.getElementById('time').style.color='#4facfe';
    document.getElementById('combo').textContent='x1';
    document.getElementById('hintCount').textContent='3';
    document.getElementById('hintBtn').disabled=false;
    document.getElementById('comboDisplay').textContent='';
    
    createBoard();
}

function changeDifficulty(){
    document.getElementById('result').classList.remove('show');
}

restart();
</script>
</body>
</html>
