<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Memory Game - 神経衰弱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;touch-action:manipulation}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
.back:hover{opacity:1}
h1{font-size:clamp(1.3rem,4vw,1.8rem);margin:20px 0 15px;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.stat{background:rgba(255,255,255,0.1);padding:10px 20px;border-radius:10px;text-align:center}
.stat-val{font-size:1.5rem;color:#4facfe;font-weight:bold}
.stat-label{font-size:0.75rem;color:#aaa}
.modes{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.modes button{background:rgba(255,255,255,0.1);border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:0.85rem}
.modes button.active{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.board{display:grid;gap:8px;max-width:500px;width:100%}
.card{aspect-ratio:1;background:linear-gradient(135deg,#2d2d44,#1a1a2e);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:clamp(1.5rem,6vw,2.5rem);transition:transform 0.3s,background 0.3s;transform-style:preserve-3d;position:relative;perspective:1000px}
.card:active{transform:scale(0.95)}
.card.flipped{background:linear-gradient(135deg,#667eea,#764ba2)}
.card.matched{background:linear-gradient(135deg,#43e97b,#38f9d7);pointer-events:none}
.card-inner{display:none}
.card.flipped .card-inner{display:block}
.result{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:200;flex-direction:column;align-items:center;justify-content:center}
.result.show{display:flex}
.result h2{font-size:2rem;margin-bottom:20px;color:#4facfe}
.result p{font-size:1.2rem;margin-bottom:30px;color:#aaa}
.result button{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:12px 30px;border-radius:10px;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>🃏 神経衰弱</h1>
<div class="stats">
<div class="stat"><div class="stat-val" id="moves">0</div><div class="stat-label">手数</div></div>
<div class="stat"><div class="stat-val" id="pairs">0</div><div class="stat-label">ペア</div></div>
<div class="stat"><div class="stat-val" id="time">0:00</div><div class="stat-label">時間</div></div>
</div>
<div class="modes">
<button class="active" data-size="4">4x4</button>
<button data-size="6">6x6</button>
</div>
<div class="board" id="board"></div>
<div class="result" id="result">
<h2>🎉 クリア!</h2>
<p id="resultText"></p>
<button onclick="restart()">もう一度</button>
</div>
<script>
const emojis=['🍎','🍊','🍋','🍇','🍓','🍒','🥝','🍑','🌸','🌻','🌈','⭐','🌙','❄️','🔥','💎','🎀','🎈'];
let size=4,cards=[],flipped=[],matched=0,moves=0,timer=null,seconds=0,canFlip=true;

document.querySelectorAll('.modes button').forEach(btn=>{
btn.onclick=function(){
document.querySelector('.modes .active').classList.remove('active');
this.classList.add('active');
size=+this.dataset.size;
restart();
};
});

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.random()*(i+1)|0;
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}

function createBoard(){
const board=document.getElementById('board');
board.innerHTML='';
board.style.gridTemplateColumns=`repeat(${size},1fr)`;
const pairs=size*size/2;
const selected=shuffle([...emojis]).slice(0,pairs);
cards=shuffle([...selected,...selected]);
cards.forEach((emoji,i)=>{
const card=document.createElement('div');
card.className='card';
card.dataset.idx=i;
card.innerHTML=`<span class="card-inner">${emoji}</span>`;
card.onclick=()=>flipCard(i);
board.appendChild(card);
});
}

function flipCard(idx){
if(!canFlip||flipped.includes(idx)||document.querySelectorAll('.card')[idx].classList.contains('matched'))return;
const cardEls=document.querySelectorAll('.card');
cardEls[idx].classList.add('flipped');
flipped.push(idx);
if(!timer){
timer=setInterval(()=>{
seconds++;
const m=seconds/60|0,s=seconds%60;
document.getElementById('time').textContent=`${m}:${s.toString().padStart(2,'0')}`;
},1000);
}
if(flipped.length===2){
moves++;
document.getElementById('moves').textContent=moves;
canFlip=false;
const[a,b]=flipped;
if(cards[a]===cards[b]){
cardEls[a].classList.add('matched');
cardEls[b].classList.add('matched');
matched++;
document.getElementById('pairs').textContent=matched;
flipped=[];
canFlip=true;
if(matched===size*size/2)endGame();
}else{
setTimeout(()=>{
cardEls[a].classList.remove('flipped');
cardEls[b].classList.remove('flipped');
flipped=[];
canFlip=true;
},800);
}
}
}

function endGame(){
clearInterval(timer);
const m=seconds/60|0,s=seconds%60;
document.getElementById('resultText').textContent=`${moves}手、${m}分${s}秒でクリア!`;
document.getElementById('result').classList.add('show');
}

function restart(){
document.getElementById('result').classList.remove('show');
clearInterval(timer);
timer=null;seconds=0;moves=0;matched=0;flipped=[];canFlip=true;
document.getElementById('moves').textContent='0';
document.getElementById('pairs').textContent='0';
document.getElementById('time').textContent='0:00';
createBoard();
}

restart();
</script>
</body>
</html>
