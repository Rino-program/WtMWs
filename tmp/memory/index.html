<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Memory Game - 神経衰弱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>🃏 神経衰弱</h1>
<div class="game-options">
<select id="sizeSelect">
<option value="3">3x3 (簡単)</option>
<option value="4" selected>4x4 (普通)</option>
<option value="5">5x5 (難しい)</option>
<option value="6">6x6 (超難)</option>
</select>
<select id="themeSelect">
<option value="emoji">絵文字</option>
<option value="animals">動物</option>
<option value="food">食べ物</option>
<option value="symbols">記号</option>
<option value="flags">国旗</option>
</select>
<select id="modeSelect">
<option value="classic">クラシック</option>
<option value="timeattack">タイムアタック</option>
<option value="zen">ZENモード</option>
</select>
</div>
<div class="stats">
<div class="stat"><div class="stat-val" id="moves">0</div><div class="stat-label">手数</div></div>
<div class="stat"><div class="stat-val" id="pairs">0</div><div class="stat-label">ペア</div></div>
<div class="stat"><div class="stat-val" id="time">0:00</div><div class="stat-label" id="timeLabel">時間</div></div>
<div class="stat"><div class="stat-val" id="combo">x1</div><div class="stat-label">コンボ</div></div>
</div>
<div class="combo-display" id="comboDisplay"></div>
<div class="board" id="board"></div>
<button class="hint-btn" id="hintBtn" onclick="useHint()">💡<span class="hint-count" id="hintCount">3</span></button>
<div class="result" id="result">
<h2>🎉 クリア!</h2>
<div class="result-stats" id="resultStats"></div>
<div>
<button onclick="restart()">もう一度</button>
<button class="secondary" onclick="changeDifficulty()">難易度変更</button>
</div>
<div class="leaderboard">
<h3>🏆 ランキング</h3>
<div class="leaderboard-list" id="leaderboard"></div>
</div>
</div>
<div class="stars" id="stars"></div>
<script src="script.js"></script>
</body>
</html>
