<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Paint Pro - お絵かき</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;touch-action:none;font-family:'Segoe UI',sans-serif}
.back{position:fixed;top:12px;left:12px;color:#fff;text-decoration:none;font-size:1.2rem;z-index:200;opacity:0.7}
.back:hover{opacity:1}
#mainCanvas{display:block;cursor:crosshair;position:absolute;top:0;left:0}
.toolbar{position:fixed;top:50%;left:10px;transform:translateY(-50%);background:rgba(0,0,0,0.9);padding:10px;border-radius:12px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toolbar button{background:#333;border:none;color:#fff;width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.toolbar button:hover{background:#444}
.toolbar button.active{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#000}
.toolbar .separator{height:1px;background:#444;margin:5px 0}
.top-bar{position:fixed;top:0;left:50px;right:0;height:50px;background:rgba(0,0,0,0.85);display:flex;align-items:center;padding:0 15px;gap:15px;z-index:100}
.top-bar .logo{font-size:1rem;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold}
.top-bar-section{display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid #333}
.top-bar-section:last-child{border:none}
.color-picker{display:flex;gap:4px;align-items:center}
.color-btn{width:24px;height:24px;border-radius:4px;border:2px solid transparent;cursor:pointer;transition:transform 0.1s}
.color-btn:hover{transform:scale(1.1)}
.color-btn.active{border-color:#fff}
input[type=color]{width:30px;height:30px;border:none;border-radius:6px;cursor:pointer;padding:0;background:transparent}
input[type=range]{width:70px;height:4px;-webkit-appearance:none;background:#444;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#4facfe;border-radius:50%;cursor:pointer}
.size-preview{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#222;border-radius:6px}
.size-dot{background:#fff;border-radius:50%;transition:all 0.1s}
.brush-select{display:flex;gap:4px}
.brush-btn{background:#333;border:none;color:#aaa;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:0.75rem}
.brush-btn.active{background:#4facfe;color:#000}
.layers-panel{position:fixed;top:60px;right:10px;width:180px;background:rgba(0,0,0,0.9);border-radius:12px;padding:10px;z-index:100}
.layers-panel h3{font-size:0.8rem;color:#888;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.layers-panel h3 button{background:#333;border:none;color:#fff;width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:0.8rem}
.layer-item{display:flex;align-items:center;gap:8px;padding:8px;background:#222;border-radius:6px;margin-bottom:5px;cursor:pointer}
.layer-item.active{border:1px solid #4facfe}
.layer-item input[type=checkbox]{width:16px;height:16px}
.layer-item .layer-name{flex:1;font-size:0.8rem;color:#fff}
.layer-item input[type=range]{width:50px}
.layer-preview{width:30px;height:30px;background:#333;border-radius:4px}
.history-info{position:fixed;bottom:15px;left:60px;background:rgba(0,0,0,0.7);padding:8px 15px;border-radius:8px;font-size:0.75rem;color:#888}
.canvas-info{position:fixed;bottom:15px;right:15px;background:rgba(0,0,0,0.7);padding:8px 15px;border-radius:8px;font-size:0.75rem;color:#888}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:300;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#1a1a2e;padding:25px;border-radius:15px;max-width:400px;width:90%}
.modal-content h2{margin-bottom:15px;color:#4facfe}
.modal-content .form-group{margin-bottom:15px}
.modal-content label{display:block;margin-bottom:5px;color:#888;font-size:0.85rem}
.modal-content input,.modal-content select{width:100%;padding:10px;background:#222;border:1px solid #333;border-radius:8px;color:#fff}
.modal-content .btn-row{display:flex;gap:10px;margin-top:20px}
.modal-content button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer}
.modal-content .btn-primary{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#000}
.modal-content .btn-secondary{background:#333;color:#fff}
.shortcuts-help{display:none;position:fixed;top:60px;left:60px;background:rgba(0,0,0,0.95);padding:15px;border-radius:10px;z-index:150;font-size:0.8rem;color:#aaa}
.shortcuts-help.show{display:block}
.shortcuts-help h4{color:#4facfe;margin-bottom:10px}
.shortcuts-help div{margin-bottom:5px}
.shortcuts-help kbd{background:#333;padding:2px 6px;border-radius:3px;color:#fff}
@media(max-width:768px){
.layers-panel{display:none}
.top-bar{left:0;padding-left:50px}
.top-bar-section{padding:0 5px}
}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="top-bar">
<span class="logo">🎨 Paint Pro</span>
<div class="top-bar-section">
<div class="color-picker">
<div class="color-btn active" style="background:#fff" data-c="#ffffff"></div>
<div class="color-btn" style="background:#000" data-c="#000000"></div>
<div class="color-btn" style="background:#ff6b6b" data-c="#ff6b6b"></div>
<div class="color-btn" style="background:#feca57" data-c="#feca57"></div>
<div class="color-btn" style="background:#48dbfb" data-c="#48dbfb"></div>
<div class="color-btn" style="background:#1dd1a1" data-c="#1dd1a1"></div>
<div class="color-btn" style="background:#f093fb" data-c="#f093fb"></div>
<input type="color" id="customColor" value="#ffffff" title="カスタム色">
</div>
</div>
<div class="top-bar-section">
<span style="color:#888;font-size:0.75rem">サイズ</span>
<input type="range" id="size" min="1" max="80" value="5">
<div class="size-preview"><div class="size-dot" id="sizeDot"></div></div>
</div>
<div class="top-bar-section">
<span style="color:#888;font-size:0.75rem">不透明度</span>
<input type="range" id="opacity" min="0" max="100" value="100">
<span id="opacityVal" style="color:#fff;font-size:0.75rem;width:30px">100%</span>
</div>
<div class="top-bar-section brush-select">
<button class="brush-btn active" data-brush="pen">ペン</button>
<button class="brush-btn" data-brush="pencil">鉛筆</button>
<button class="brush-btn" data-brush="airbrush">エアブラシ</button>
<button class="brush-btn" data-brush="marker">マーカー</button>
</div>
</div>
<div class="toolbar">
<button id="penBtn" class="active" title="ペン (B)">✏️</button>
<button id="eraserBtn" title="消しゴム (E)">🧽</button>
<button id="fillBtn" title="塗りつぶし (G)">🪣</button>
<button id="pickerBtn" title="スポイト (I)">💉</button>
<button id="lineBtn" title="直線 (L)">📏</button>
<button id="rectBtn" title="矩形 (R)">⬜</button>
<button id="circleBtn" title="円 (C)">⭕</button>
<button id="textBtn" title="テキスト (T)">🔤</button>
<div class="separator"></div>
<button id="undoBtn" title="戻る (Ctrl+Z)">↩️</button>
<button id="redoBtn" title="やり直し (Ctrl+Y)">↪️</button>
<div class="separator"></div>
<button id="gridBtn" title="グリッド">📐</button>
<button id="clearBtn" title="全消去">🗑️</button>
<button id="saveBtn" title="保存 (Ctrl+S)">💾</button>
<button id="settingsBtn" title="設定">⚙️</button>
<button id="helpBtn" title="ヘルプ (?)">❓</button>
</div>
<canvas id="mainCanvas"></canvas>
<div class="layers-panel">
<h3>レイヤー <button onclick="addLayer()">+</button></h3>
<div id="layersList"></div>
</div>
<div class="history-info" id="historyInfo">履歴: 0/30</div>
<div class="canvas-info" id="canvasInfo">1920 × 1080</div>
<div class="shortcuts-help" id="shortcutsHelp">
<h4>ショートカット</h4>
<div><kbd>B</kbd> ペン</div>
<div><kbd>E</kbd> 消しゴム</div>
<div><kbd>G</kbd> 塗りつぶし</div>
<div><kbd>I</kbd> スポイト</div>
<div><kbd>L</kbd> 直線</div>
<div><kbd>R</kbd> 矩形</div>
<div><kbd>C</kbd> 円</div>
<div><kbd>T</kbd> テキスト</div>
<div><kbd>Ctrl+Z</kbd> 戻る</div>
<div><kbd>Ctrl+Y</kbd> やり直し</div>
<div><kbd>Ctrl+S</kbd> 保存</div>
<div><kbd>[</kbd> <kbd>]</kbd> サイズ変更</div>
</div>
<div class="modal" id="settingsModal">
<div class="modal-content">
<h2>⚙️ キャンバス設定</h2>
<div class="form-group">
<label>幅 (px)</label>
<input type="number" id="canvasWidth" value="1920">
</div>
<div class="form-group">
<label>高さ (px)</label>
<input type="number" id="canvasHeight" value="1080">
</div>
<div class="form-group">
<label>保存形式</label>
<select id="saveFormat">
<option value="png">PNG</option>
<option value="jpeg">JPEG</option>
</select>
</div>
<div class="btn-row">
<button class="btn-secondary" onclick="closeModal()">キャンセル</button>
<button class="btn-primary" onclick="applySettings()">適用</button>
</div>
</div>
</div>
<div class="modal" id="textModal">
<div class="modal-content">
<h2>🔤 テキスト挿入</h2>
<div class="form-group">
<label>テキスト</label>
<input type="text" id="textInput" placeholder="テキストを入力...">
</div>
<div class="form-group">
<label>フォントサイズ</label>
<input type="number" id="fontSize" value="24" min="8" max="200">
</div>
<div class="form-group">
<label>フォント</label>
<select id="fontFamily">
<option value="sans-serif">Sans-serif</option>
<option value="serif">Serif</option>
<option value="monospace">Monospace</option>
</select>
</div>
<div class="btn-row">
<button class="btn-secondary" onclick="closeModal()">キャンセル</button>
<button class="btn-primary" onclick="insertText()">挿入</button>
</div>
</div>
</div>
<script>
const cv=document.getElementById('mainCanvas'),ctx=cv.getContext('2d');
let W,H,drawing=false,color='#ffffff',size=5,opacity=1,tool='pen',brush='pen';
let lastX,lastY,startX,startY,showGrid=false,saveFormat='png';
let history=[],historyIndex=-1,maxHistory=30;
let layers=[{name:'レイヤー1',visible:true,opacity:1,canvas:null}];
let activeLayer=0,textPos=null;

function resize(){
    W=cv.width=innerWidth;
    H=cv.height=innerHeight-50;
    cv.style.top='50px';
    redraw();
    updateCanvasInfo();
}

function initLayers(){
    layers[0].canvas=document.createElement('canvas');
    layers[0].canvas.width=W;
    layers[0].canvas.height=H;
    const lctx=layers[0].canvas.getContext('2d');
    lctx.fillStyle='#1a1a2e';
    lctx.fillRect(0,0,W,H);
    renderLayersList();
}

function redraw(){
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(0,0,W,H);
    layers.forEach(layer=>{
        if(layer.visible&&layer.canvas){
            ctx.globalAlpha=layer.opacity;
            ctx.drawImage(layer.canvas,0,0);
        }
    });
    ctx.globalAlpha=1;
    if(showGrid)drawGrid();
}

function drawGrid(){
    ctx.strokeStyle='rgba(255,255,255,0.1)';
    ctx.lineWidth=0.5;
    const gridSize=50;
    for(let x=0;x<W;x+=gridSize){
        ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=0;y<H;y+=gridSize){
        ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }
}

function getLayerCtx(){
    return layers[activeLayer].canvas.getContext('2d');
}

function saveToHistory(){
    const imgData=getLayerCtx().getImageData(0,0,W,H);
    history=history.slice(0,historyIndex+1);
    history.push(imgData);
    if(history.length>maxHistory)history.shift();
    historyIndex=history.length-1;
    updateHistoryInfo();
}

function undo(){
    if(historyIndex>0){
        historyIndex--;
        getLayerCtx().putImageData(history[historyIndex],0,0);
        redraw();
        updateHistoryInfo();
    }
}

function redo(){
    if(historyIndex<history.length-1){
        historyIndex++;
        getLayerCtx().putImageData(history[historyIndex],0,0);
        redraw();
        updateHistoryInfo();
    }
}

function updateHistoryInfo(){
    document.getElementById('historyInfo').textContent=`履歴: ${historyIndex+1}/${history.length}`;
}

function updateCanvasInfo(){
    document.getElementById('canvasInfo').textContent=`${W} × ${H}`;
}

function updateSizeDot(){
    const d=Math.min(Math.max(3,size),25);
    document.getElementById('sizeDot').style.cssText=`width:${d}px;height:${d}px`;
}

function updateToolBtns(){
    document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
    const btnMap={pen:'penBtn',eraser:'eraserBtn',fill:'fillBtn',picker:'pickerBtn',line:'lineBtn',rect:'rectBtn',circle:'circleBtn',text:'textBtn'};
    if(btnMap[tool])document.getElementById(btnMap[tool]).classList.add('active');
}

function renderLayersList(){
    document.getElementById('layersList').innerHTML=layers.map((l,i)=>`
        <div class="layer-item${i===activeLayer?' active':''}" onclick="selectLayer(${i})">
            <input type="checkbox" ${l.visible?'checked':''} onclick="event.stopPropagation();toggleLayerVisibility(${i})">
            <span class="layer-name">${l.name}</span>
            <input type="range" min="0" max="100" value="${l.opacity*100}" onclick="event.stopPropagation()" oninput="setLayerOpacity(${i},this.value)">
        </div>
    `).join('');
}

function addLayer(){
    if(layers.length>=5)return alert('最大5レイヤーまでです');
    const newCanvas=document.createElement('canvas');
    newCanvas.width=W;
    newCanvas.height=H;
    layers.push({name:`レイヤー${layers.length+1}`,visible:true,opacity:1,canvas:newCanvas});
    activeLayer=layers.length-1;
    renderLayersList();
}

function selectLayer(i){
    activeLayer=i;
    renderLayersList();
}

function toggleLayerVisibility(i){
    layers[i].visible=!layers[i].visible;
    redraw();
    renderLayersList();
}

function setLayerOpacity(i,val){
    layers[i].opacity=val/100;
    redraw();
}

// Drawing functions
function draw(x,y){
    const lctx=getLayerCtx();
    lctx.globalAlpha=opacity;
    
    if(brush==='airbrush'){
        for(let i=0;i<10;i++){
            const angle=Math.random()*Math.PI*2;
            const radius=Math.random()*size;
            const px=x+Math.cos(angle)*radius;
            const py=y+Math.sin(angle)*radius;
            lctx.beginPath();
            lctx.arc(px,py,1,0,Math.PI*2);
            lctx.fillStyle=tool==='eraser'?'#1a1a2e':color;
            lctx.fill();
        }
    }else if(brush==='pencil'){
        lctx.globalAlpha=opacity*0.3;
        lctx.beginPath();
        lctx.moveTo(lastX,lastY);
        lctx.lineTo(x,y);
        lctx.strokeStyle=tool==='eraser'?'#1a1a2e':color;
        lctx.lineWidth=size*0.8;
        lctx.lineCap='round';
        lctx.stroke();
    }else if(brush==='marker'){
        lctx.globalAlpha=opacity*0.6;
        lctx.beginPath();
        lctx.moveTo(lastX,lastY);
        lctx.lineTo(x,y);
        lctx.strokeStyle=tool==='eraser'?'#1a1a2e':color;
        lctx.lineWidth=size*1.5;
        lctx.lineCap='square';
        lctx.stroke();
    }else{
        lctx.beginPath();
        lctx.moveTo(lastX,lastY);
        lctx.lineTo(x,y);
        lctx.strokeStyle=tool==='eraser'?'#1a1a2e':color;
        lctx.lineWidth=size;
        lctx.lineCap='round';
        lctx.lineJoin='round';
        lctx.stroke();
    }
    
    lctx.globalAlpha=1;
    lastX=x;lastY=y;
    redraw();
}

function drawShape(x,y,preview=false){
    const targetCtx=preview?ctx:getLayerCtx();
    if(preview)redraw();
    
    targetCtx.strokeStyle=color;
    targetCtx.fillStyle=color;
    targetCtx.lineWidth=size;
    targetCtx.globalAlpha=opacity;
    
    if(tool==='line'){
        targetCtx.beginPath();
        targetCtx.moveTo(startX,startY);
        targetCtx.lineTo(x,y);
        targetCtx.stroke();
    }else if(tool==='rect'){
        targetCtx.strokeRect(startX,startY,x-startX,y-startY);
    }else if(tool==='circle'){
        const rx=Math.abs(x-startX)/2;
        const ry=Math.abs(y-startY)/2;
        const cx=startX+(x-startX)/2;
        const cy=startY+(y-startY)/2;
        targetCtx.beginPath();
        targetCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
        targetCtx.stroke();
    }
    targetCtx.globalAlpha=1;
}

function floodFill(sx,sy,fillColor){
    const lctx=getLayerCtx();
    const img=lctx.getImageData(0,0,W,H);
    const data=img.data;
    const idx=(sy*W+sx)*4;
    const target=[data[idx],data[idx+1],data[idx+2]];
    const fill=hexToRgb(fillColor);
    if(target[0]===fill[0]&&target[1]===fill[1]&&target[2]===fill[2])return;
    
    const stack=[[sx,sy]];
    const visited=new Set();
    while(stack.length){
        const[x,y]=stack.pop();
        if(x<0||x>=W||y<0||y>=H)continue;
        const key=x+','+y;
        if(visited.has(key))continue;
        const i=(y*W+x)*4;
        if(Math.abs(data[i]-target[0])>30||Math.abs(data[i+1]-target[1])>30||Math.abs(data[i+2]-target[2])>30)continue;
        visited.add(key);
        data[i]=fill[0];data[i+1]=fill[1];data[i+2]=fill[2];data[i+3]=255*opacity;
        stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    lctx.putImageData(img,0,0);
    redraw();
}

function pickColor(x,y){
    const pixel=ctx.getImageData(x,y,1,1).data;
    color='#'+[pixel[0],pixel[1],pixel[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
    document.getElementById('customColor').value=color;
    document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
    tool='pen';
    updateToolBtns();
}

function hexToRgb(hex){
    return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
}

// Event handlers
function handleStart(e){
    e.preventDefault();
    const p=e.touches?e.touches[0]:e;
    const x=p.clientX,y=p.clientY-50;
    startX=lastX=x;startY=lastY=y;
    
    if(tool==='fill'){
        saveToHistory();
        floodFill(x|0,y|0,color);
    }else if(tool==='picker'){
        pickColor(x|0,y|0);
    }else if(tool==='text'){
        textPos={x,y};
        document.getElementById('textModal').classList.add('show');
    }else{
        drawing=true;
        if(['pen','eraser'].includes(tool))saveToHistory();
    }
}

function handleMove(e){
    if(!drawing)return;
    e.preventDefault();
    const p=e.touches?e.touches[0]:e;
    const x=p.clientX,y=p.clientY-50;
    
    if(['line','rect','circle'].includes(tool)){
        drawShape(x,y,true);
    }else{
        draw(x,y);
    }
}

function handleEnd(e){
    if(!drawing)return;
    drawing=false;
    if(['line','rect','circle'].includes(tool)){
        const p=e.changedTouches?e.changedTouches[0]:e;
        const x=p.clientX,y=p.clientY-50;
        saveToHistory();
        drawShape(x,y,false);
        redraw();
    }
}

function insertText(){
    if(!textPos)return;
    const text=document.getElementById('textInput').value;
    if(!text)return;
    const fontSize=document.getElementById('fontSize').value;
    const fontFamily=document.getElementById('fontFamily').value;
    
    saveToHistory();
    const lctx=getLayerCtx();
    lctx.font=`${fontSize}px ${fontFamily}`;
    lctx.fillStyle=color;
    lctx.globalAlpha=opacity;
    lctx.fillText(text,textPos.x,textPos.y);
    lctx.globalAlpha=1;
    redraw();
    closeModal();
    document.getElementById('textInput').value='';
}

function closeModal(){
    document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));
}

function applySettings(){
    const newW=+document.getElementById('canvasWidth').value||W;
    const newH=+document.getElementById('canvasHeight').value||H;
    saveFormat=document.getElementById('saveFormat').value;
    if(newW!==W||newH!==H){
        layers.forEach(l=>{
            const newCanvas=document.createElement('canvas');
            newCanvas.width=newW;
            newCanvas.height=newH;
            const nctx=newCanvas.getContext('2d');
            nctx.fillStyle='#1a1a2e';
            nctx.fillRect(0,0,newW,newH);
            nctx.drawImage(l.canvas,0,0);
            l.canvas=newCanvas;
        });
        W=newW;H=newH;
        cv.width=W;cv.height=H;
        redraw();
        updateCanvasInfo();
    }
    closeModal();
}

function save(){
    const tempCanvas=document.createElement('canvas');
    tempCanvas.width=W;
    tempCanvas.height=H;
    const tempCtx=tempCanvas.getContext('2d');
    if(saveFormat==='jpeg'){
        tempCtx.fillStyle='#1a1a2e';
        tempCtx.fillRect(0,0,W,H);
    }
    layers.forEach(l=>{
        if(l.visible){
            tempCtx.globalAlpha=l.opacity;
            tempCtx.drawImage(l.canvas,0,0);
        }
    });
    const a=document.createElement('a');
    a.download=`painting.${saveFormat}`;
    a.href=tempCanvas.toDataURL(`image/${saveFormat}`);
    a.click();
}

// UI bindings
document.getElementById('size').oninput=e=>{size=+e.target.value;updateSizeDot()};
document.getElementById('opacity').oninput=e=>{
    opacity=e.target.value/100;
    document.getElementById('opacityVal').textContent=e.target.value+'%';
};
document.getElementById('customColor').oninput=e=>{
    color=e.target.value;
    document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
};

document.querySelectorAll('.color-btn').forEach(btn=>{
    btn.onclick=function(){
        document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        color=this.dataset.c;
        if(tool==='eraser'){tool='pen';updateToolBtns()}
    };
});

document.querySelectorAll('.brush-btn').forEach(btn=>{
    btn.onclick=function(){
        document.querySelectorAll('.brush-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        brush=this.dataset.brush;
    };
});

document.getElementById('penBtn').onclick=()=>{tool='pen';updateToolBtns()};
document.getElementById('eraserBtn').onclick=()=>{tool='eraser';updateToolBtns()};
document.getElementById('fillBtn').onclick=()=>{tool='fill';updateToolBtns()};
document.getElementById('pickerBtn').onclick=()=>{tool='picker';updateToolBtns()};
document.getElementById('lineBtn').onclick=()=>{tool='line';updateToolBtns()};
document.getElementById('rectBtn').onclick=()=>{tool='rect';updateToolBtns()};
document.getElementById('circleBtn').onclick=()=>{tool='circle';updateToolBtns()};
document.getElementById('textBtn').onclick=()=>{tool='text';updateToolBtns()};
document.getElementById('undoBtn').onclick=undo;
document.getElementById('redoBtn').onclick=redo;
document.getElementById('gridBtn').onclick=()=>{showGrid=!showGrid;redraw()};
document.getElementById('clearBtn').onclick=()=>{
    if(confirm('キャンバスをクリアしますか？')){
        saveToHistory();
        const lctx=getLayerCtx();
        lctx.fillStyle='#1a1a2e';
        lctx.fillRect(0,0,W,H);
        redraw();
    }
};
document.getElementById('saveBtn').onclick=save;
document.getElementById('settingsBtn').onclick=()=>document.getElementById('settingsModal').classList.add('show');
document.getElementById('helpBtn').onclick=()=>document.getElementById('shortcutsHelp').classList.toggle('show');

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT')return;
    if(e.ctrlKey||e.metaKey){
        if(e.key==='z'){e.preventDefault();undo()}
        if(e.key==='y'){e.preventDefault();redo()}
        if(e.key==='s'){e.preventDefault();save()}
        return;
    }
    switch(e.key.toLowerCase()){
        case'b':tool='pen';break;
        case'e':tool='eraser';break;
        case'g':tool='fill';break;
        case'i':tool='picker';break;
        case'l':tool='line';break;
        case'r':tool='rect';break;
        case'c':tool='circle';break;
        case't':tool='text';break;
        case'[':size=Math.max(1,size-5);document.getElementById('size').value=size;updateSizeDot();break;
        case']':size=Math.min(80,size+5);document.getElementById('size').value=size;updateSizeDot();break;
        case'?':document.getElementById('shortcutsHelp').classList.toggle('show');break;
        default:return;
    }
    updateToolBtns();
});

// Canvas events
cv.addEventListener('mousedown',handleStart);
cv.addEventListener('mousemove',handleMove);
cv.addEventListener('mouseup',handleEnd);
cv.addEventListener('mouseleave',handleEnd);
cv.addEventListener('touchstart',handleStart,{passive:false});
cv.addEventListener('touchmove',handleMove,{passive:false});
cv.addEventListener('touchend',handleEnd);

// Init
resize();
window.onresize=resize;
initLayers();
updateSizeDot();
saveToHistory();
</script>
</body>
</html>
