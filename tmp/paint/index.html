<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Paint - お絵かき</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;touch-action:none}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
.back:hover{opacity:1}
canvas{display:block;cursor:crosshair}
.toolbar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:12px 18px;border-radius:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:95vw;z-index:10}
.toolbar button{background:#333;border:none;color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.toolbar button:active{transform:scale(0.95)}
.toolbar button.active{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.color-picker{display:flex;gap:6px}
.color-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.color-btn.active{border-color:#fff;transform:scale(1.1)}
input[type=range]{width:80px;height:6px;-webkit-appearance:none;background:#444;border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#4facfe;border-radius:50%}
input[type=color]{width:36px;height:36px;border:none;border-radius:8px;cursor:pointer;padding:0}
.size-preview{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.size-dot{background:#fff;border-radius:50%}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<canvas id="cv"></canvas>
<div class="toolbar">
<div class="color-picker">
<div class="color-btn active" style="background:#fff" data-c="#ffffff"></div>
<div class="color-btn" style="background:#ff6b6b" data-c="#ff6b6b"></div>
<div class="color-btn" style="background:#feca57" data-c="#feca57"></div>
<div class="color-btn" style="background:#48dbfb" data-c="#48dbfb"></div>
<div class="color-btn" style="background:#1dd1a1" data-c="#1dd1a1"></div>
<div class="color-btn" style="background:#f093fb" data-c="#f093fb"></div>
<input type="color" id="customColor" value="#ffffff" title="カスタム色">
</div>
<input type="range" id="size" min="1" max="50" value="5">
<div class="size-preview"><div class="size-dot" id="sizeDot"></div></div>
<button id="penBtn" class="active" title="ペン">✏️</button>
<button id="eraserBtn" title="消しゴム">🧽</button>
<button id="fillBtn" title="塗りつぶし">🪣</button>
<button id="clearBtn" title="全消去">🗑️</button>
<button id="saveBtn" title="保存">💾</button>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,drawing=false,color='#ffffff',size=5,tool='pen',lastX,lastY;

function resize(){
const data=ctx.getImageData(0,0,W||1,H||1);
W=cv.width=innerWidth;H=cv.height=innerHeight;
ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
if(data.width>1)ctx.putImageData(data,0,0);
}
resize();window.onresize=resize;

function updateSizeDot(){
const d=Math.max(3,size);
document.getElementById('sizeDot').style.cssText=`width:${d}px;height:${d}px`;
}
updateSizeDot();

document.getElementById('size').oninput=function(){size=+this.value;updateSizeDot()};
document.getElementById('customColor').oninput=function(){
color=this.value;
document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
};

document.querySelectorAll('.color-btn').forEach(btn=>{
btn.onclick=function(){
document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
this.classList.add('active');
color=this.dataset.c;
if(tool==='eraser'){tool='pen';updateToolBtns()}
};
});

function updateToolBtns(){
document.getElementById('penBtn').classList.toggle('active',tool==='pen');
document.getElementById('eraserBtn').classList.toggle('active',tool==='eraser');
document.getElementById('fillBtn').classList.toggle('active',tool==='fill');
}

document.getElementById('penBtn').onclick=()=>{tool='pen';updateToolBtns()};
document.getElementById('eraserBtn').onclick=()=>{tool='eraser';updateToolBtns()};
document.getElementById('fillBtn').onclick=()=>{tool='fill';updateToolBtns()};
document.getElementById('clearBtn').onclick=()=>{ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H)};
document.getElementById('saveBtn').onclick=()=>{
const a=document.createElement('a');
a.download='painting.png';
a.href=cv.toDataURL();
a.click();
};

function draw(x,y){
ctx.beginPath();
ctx.moveTo(lastX,lastY);
ctx.lineTo(x,y);
ctx.strokeStyle=tool==='eraser'?'#1a1a2e':color;
ctx.lineWidth=size;
ctx.lineCap='round';
ctx.lineJoin='round';
ctx.stroke();
lastX=x;lastY=y;
}

function floodFill(sx,sy,fillColor){
const img=ctx.getImageData(0,0,W,H);
const data=img.data;
const target=getPixel(sx,sy);
const fill=hexToRgb(fillColor);
if(target[0]===fill[0]&&target[1]===fill[1]&&target[2]===fill[2])return;
const stack=[[sx,sy]];
const visited=new Set();
while(stack.length){
const[x,y]=stack.pop();
const key=x+','+y;
if(visited.has(key)||x<0||x>=W||y<0||y>=H)continue;
const idx=(y*W+x)*4;
if(Math.abs(data[idx]-target[0])>30||Math.abs(data[idx+1]-target[1])>30||Math.abs(data[idx+2]-target[2])>30)continue;
visited.add(key);
data[idx]=fill[0];data[idx+1]=fill[1];data[idx+2]=fill[2];
stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
}
ctx.putImageData(img,0,0);
function getPixel(x,y){const i=(y*W+x)*4;return[data[i],data[i+1],data[i+2]]}
}

function hexToRgb(hex){
const r=parseInt(hex.slice(1,3),16);
const g=parseInt(hex.slice(3,5),16);
const b=parseInt(hex.slice(5,7),16);
return[r,g,b];
}

function handleStart(e){
e.preventDefault();
const p=e.touches?e.touches[0]:e;
const x=p.clientX,y=p.clientY;
if(tool==='fill'){
floodFill(x|0,y|0,color);
}else{
drawing=true;
lastX=x;lastY=y;
}
}
function handleMove(e){
if(!drawing)return;
e.preventDefault();
const p=e.touches?e.touches[0]:e;
draw(p.clientX,p.clientY);
}
function handleEnd(){drawing=false}

cv.addEventListener('mousedown',handleStart);
cv.addEventListener('mousemove',handleMove);
cv.addEventListener('mouseup',handleEnd);
cv.addEventListener('mouseleave',handleEnd);
cv.addEventListener('touchstart',handleStart,{passive:false});
cv.addEventListener('touchmove',handleMove,{passive:false});
cv.addEventListener('touchend',handleEnd);
</script>
</body>
</html>
