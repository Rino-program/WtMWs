<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Paint Pro - 高機能お絵かき</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="top-bar">
<span class="logo">🎨 Paint Pro（高機能版）</span>
<div class="top-bar-section">
<div class="color-picker">
<div class="color-btn active" style="background:#fff" data-c="#ffffff"></div>
<div class="color-btn" style="background:#000" data-c="#000000"></div>
<div class="color-btn" style="background:#ff6b6b" data-c="#ff6b6b"></div>
<div class="color-btn" style="background:#feca57" data-c="#feca57"></div>
<div class="color-btn" style="background:#48dbfb" data-c="#48dbfb"></div>
<div class="color-btn" style="background:#1dd1a1" data-c="#1dd1a1"></div>
<div class="color-btn" style="background:#f093fb" data-c="#f093fb"></div>
<input type="color" id="customColor" value="#ffffff" title="カスタム色">
</div>
</div>
<div class="top-bar-section">
<button id="brushPanelBtn" class="brush-panel-btn" title="ブラシパネル">🖌️ ブラシ</button>
</div>
</div>

<!-- ブラシパネル -->
<div class="brush-panel" id="brushPanel">
<div class="brush-panel-header">
<h3>🖌️ ブラシ設定</h3>
<button class="close-btn" onclick="toggleBrushPanel()">×</button>
</div>

<div class="brush-panel-section">
<h4>プリセットブラシ</h4>
<div class="brush-presets" id="brushPresets">
<div class="brush-preset-item active" data-brush="pencil" title="鉛筆">
<span class="brush-icon">✏️</span>
<span class="brush-name">鉛筆</span>
</div>
<div class="brush-preset-item" data-brush="pen" title="ペン">
<span class="brush-icon">🖊️</span>
<span class="brush-name">ペン</span>
</div>
<div class="brush-preset-item" data-brush="marker" title="マーカー">
<span class="brush-icon">🖍️</span>
<span class="brush-name">マーカー</span>
</div>
<div class="brush-preset-item" data-brush="watercolor" title="水彩">
<span class="brush-icon">💧</span>
<span class="brush-name">水彩</span>
</div>
<div class="brush-preset-item" data-brush="airbrush" title="エアブラシ">
<span class="brush-icon">💨</span>
<span class="brush-name">エアブラシ</span>
</div>
<div class="brush-preset-item" data-brush="crayon" title="クレヨン">
<span class="brush-icon">🖍️</span>
<span class="brush-name">クレヨン</span>
</div>
<div class="brush-preset-item" data-brush="highlighter" title="蛍光ペン">
<span class="brush-icon">🌟</span>
<span class="brush-name">蛍光ペン</span>
</div>
</div>
</div>

<div class="brush-panel-section">
<h4>ブラシ設定</h4>
<div class="brush-setting">
<label>サイズ</label>
<div class="setting-row">
<input type="range" id="brushSize" min="1" max="100" value="5">
<input type="number" id="brushSizeNum" min="1" max="100" value="5">
</div>
</div>
<div class="brush-setting">
<label>不透明度</label>
<div class="setting-row">
<input type="range" id="brushOpacity" min="0" max="100" value="100">
<span id="brushOpacityVal">100%</span>
</div>
</div>
<div class="brush-setting">
<label>硬さ</label>
<div class="setting-row">
<input type="range" id="brushHardness" min="0" max="100" value="100">
<span id="brushHardnessVal">100%</span>
</div>
</div>
<div class="brush-setting">
<label>流量</label>
<div class="setting-row">
<input type="range" id="brushFlow" min="1" max="100" value="100">
<span id="brushFlowVal">100%</span>
</div>
</div>
</div>

<div class="brush-panel-section">
<h4>プレビュー</h4>
<canvas id="brushPreview" width="200" height="80"></canvas>
</div>

<div class="brush-panel-section">
<h4>カスタムブラシ</h4>
<div class="custom-brush-controls">
<input type="text" id="customBrushName" placeholder="ブラシ名">
<button id="saveCustomBrush" class="btn-small">保存</button>
</div>
<div class="custom-brushes" id="customBrushes"></div>
</div>
</div>

<div class="toolbar">
<button id="penBtn" class="active" title="ペン (B)">✏️</button>
<button id="eraserBtn" title="消しゴム (E)">🧽</button>
<button id="fillBtn" title="塗りつぶし (G)">🪣</button>
<button id="pickerBtn" title="スポイト (I)">💉</button>
<button id="lineBtn" title="直線 (L)">📏</button>
<button id="rectBtn" title="矩形 (R)">⬜</button>
<button id="circleBtn" title="円 (C)">⭕</button>
<button id="textBtn" title="テキスト (T)">🔤</button>
<div class="separator"></div>
<button id="undoBtn" title="戻る (Ctrl+Z)">↩️</button>
<button id="redoBtn" title="やり直し (Ctrl+Y)">↪️</button>
<div class="separator"></div>
<button id="gridBtn" title="グリッド">📐</button>
<button id="clearBtn" title="全消去">🗑️</button>
<button id="saveBtn" title="保存 (Ctrl+S)">💾</button>
<button id="settingsBtn" title="設定">⚙️</button>
<button id="helpBtn" title="ヘルプ (?)">❓</button>
</div>
<canvas id="mainCanvas"></canvas>
<div class="layers-panel">
<h3>レイヤー <button onclick="addLayer()">+</button></h3>
<div id="layersList"></div>
</div>
<div class="brush-info" id="brushInfo">
<div class="brush-indicator" id="brushIndicator">✏️</div>
<span id="currentBrushName">鉛筆</span>
<span id="currentBrushSize">3px</span>
</div>
<div class="history-info" id="historyInfo">履歴: 0/30</div>
<div class="canvas-info" id="canvasInfo">1920 × 1080</div>
<div class="shortcuts-help" id="shortcutsHelp">
<h4>ショートカット</h4>
<div><kbd>B</kbd> ペン</div>
<div><kbd>E</kbd> 消しゴム</div>
<div><kbd>G</kbd> 塗りつぶし</div>
<div><kbd>I</kbd> スポイト</div>
<div><kbd>L</kbd> 直線</div>
<div><kbd>R</kbd> 矩形</div>
<div><kbd>C</kbd> 円</div>
<div><kbd>T</kbd> テキスト</div>
<div><kbd>P</kbd> ブラシパネル</div>
<div><kbd>Ctrl+Z</kbd> 戻る</div>
<div><kbd>Ctrl+Y</kbd> やり直し</div>
<div><kbd>Ctrl+S</kbd> 保存</div>
<div><kbd>[</kbd> <kbd>]</kbd> サイズ変更</div>
</div>
<div class="modal" id="settingsModal">
<div class="modal-content">
<h2>⚙️ キャンバス設定</h2>
<div class="form-group">
<label>幅 (px)</label>
<input type="number" id="canvasWidth" value="1920">
</div>
<div class="form-group">
<label>高さ (px)</label>
<input type="number" id="canvasHeight" value="1080">
</div>
<div class="form-group">
<label>保存形式</label>
<select id="saveFormat">
<option value="png">PNG</option>
<option value="jpeg">JPEG</option>
</select>
</div>
<div class="btn-row">
<button class="btn-secondary" onclick="closeModal()">キャンセル</button>
<button class="btn-primary" onclick="applySettings()">適用</button>
</div>
</div>
</div>
<div class="modal" id="textModal">
<div class="modal-content">
<h2>🔤 テキスト挿入</h2>
<div class="form-group">
<label>テキスト</label>
<input type="text" id="textInput" placeholder="テキストを入力...">
</div>
<div class="form-group">
<label>フォントサイズ</label>
<input type="number" id="fontSize" value="24" min="8" max="200">
</div>
<div class="form-group">
<label>フォント</label>
<select id="fontFamily">
<option value="sans-serif">Sans-serif</option>
<option value="serif">Serif</option>
<option value="monospace">Monospace</option>
</select>
</div>
<div class="btn-row">
<button class="btn-secondary" onclick="closeModal()">キャンセル</button>
<button class="btn-primary" onclick="insertText()">挿入</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
