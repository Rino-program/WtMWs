<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Color Picker - カラーピッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>🎨 カラーピッカー</h1>
<div class="container">
<div class="picker-section">
<div class="color-preview" id="preview">カラープレビュー</div>
<div class="sliders">
<div class="slider-group">
<label><span>色相 (H)</span><span id="hueVal">180°</span></label>
<input type="range" id="hueSlider" min="0" max="360" value="180">
</div>
<div class="slider-group">
<label><span>彩度 (S)</span><span id="satVal">70%</span></label>
<input type="range" id="satSlider" min="0" max="100" value="70">
</div>
<div class="slider-group">
<label><span>明度 (L)</span><span id="lightVal">55%</span></label>
<input type="range" id="lightSlider" min="0" max="100" value="55">
</div>
</div>
</div>
<div class="values">
<div class="value-box">
<label>HEX</label>
<input type="text" id="hexInput" value="#4DB8B8">
<button class="copy-btn" onclick="copyValue('hex')">コピー</button>
</div>
<div class="value-box">
<label>RGB</label>
<input type="text" id="rgbInput" value="rgb(77, 184, 184)">
<button class="copy-btn" onclick="copyValue('rgb')">コピー</button>
</div>
<div class="value-box">
<label>HSL</label>
<input type="text" id="hslInput" value="hsl(180, 70%, 55%)">
<button class="copy-btn" onclick="copyValue('hsl')">コピー</button>
</div>
</div>
<div class="palette-section">
<h2>🎯 プリセットパレット</h2>
<div class="palette" id="palette"></div>
</div>
<div class="generated-section">
<h2>✨ 生成されたカラー <button onclick="generateRandom()">ランダム生成</button></h2>
<div class="generated" id="generated"></div>
</div>
<div class="harmony-section">
<h2>🎭 カラーハーモニー</h2>
<div class="harmony-types">
<button class="active" data-type="complementary">補色</button>
<button data-type="analogous">類似色</button>
<button data-type="triadic">トライアド</button>
<button data-type="split">スプリット補色</button>
<button data-type="tetradic">テトラド</button>
</div>
<div class="harmony-colors" id="harmony"></div>
</div>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script src="script.js"></script>
</body>
</html>
