<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独パズル - Sudoku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>🔢 数独パズル</h1>
    
    <div class="game-container">
        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>
        
        <div class="side-panel">
            <div class="difficulty">
                <h3>難易度</h3>
                <div class="difficulty-btns">
                    <button class="diff-btn active" data-level="easy">かんたん</button>
                    <button class="diff-btn" data-level="medium">ふつう</button>
                    <button class="diff-btn" data-level="hard">むずかしい</button>
                    <button class="diff-btn" data-level="expert">エキスパート</button>
                </div>
            </div>
            
            <div class="stats">
                <div class="stat-row">
                    <span>⏱️ 時間</span>
                    <span class="stat-value" id="timer">00:00</span>
                </div>
                <div class="stat-row">
                    <span>❌ ミス</span>
                    <span class="stat-value" id="mistakes">0/3</span>
                </div>
                <div class="stat-row">
                    <span>💡 ヒント</span>
                    <span class="stat-value" id="hints">3</span>
                </div>
            </div>

            <div class="options">
                <label class="option-toggle">
                    <input type="checkbox" id="auto-check" checked>
                    <span>🔍 自動エラーチェック</span>
                </label>
                <label class="option-toggle">
                    <input type="checkbox" id="highlight-same">
                    <span>✨ 同じ数字をハイライト</span>
                </label>
            </div>
            
            <div class="number-pad" id="number-pad">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
            </div>
            
            <div class="controls">
                <button class="btn memo-btn" id="memo-btn">📝 メモモード: OFF</button>
                <button class="btn" id="hint-btn">💡 ヒント</button>
                <button class="btn" id="erase-btn">🧹 消去</button>
                <button class="btn primary" id="new-game-btn">🎮 新しいゲーム</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2>🎉 クリア！</h2>
            <p id="win-message">おめでとうございます！</p>
            <button class="btn primary" onclick="startNewGame()">もう一度プレイ</button>
        </div>
    </div>
    
    <div class="modal" id="lose-modal">
        <div class="modal-content">
            <h2>😢 ゲームオーバー</h2>
            <p>ミスが3回になりました</p>
            <button class="btn primary" onclick="startNewGame()">もう一度プレイ</button>
        </div>
    </div>

    <div class="modal" id="hint-modal">
        <div class="modal-content hint-explanation">
            <h2>💡 ヒント解説</h2>
            <div id="hint-detail"></div>
            <button class="btn primary" onclick="closeHintModal()">閉じる</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
