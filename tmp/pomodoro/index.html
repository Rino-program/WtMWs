<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pomodoro Timer - ポモドーロタイマー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>🍅 ポモドーロタイマー</h1>
<div class="mode-tabs">
<button class="active" data-mode="work">作業 25分</button>
<button data-mode="short">小休憩 5分</button>
<button data-mode="long">長休憩 15分</button>
</div>
<div class="timer-container">
<svg class="timer-ring" viewBox="0 0 280 280">
<circle class="bg" cx="140" cy="140" r="125"/>
<circle class="progress work" id="progress" cx="140" cy="140" r="125" stroke-dasharray="785.4" stroke-dashoffset="0"/>
</svg>
<div class="timer-display">
<div class="timer-time" id="time">25:00</div>
<div class="timer-label" id="label">作業時間</div>
</div>
</div>
<div class="controls">
<button class="btn-reset" id="resetBtn">↺</button>
<button class="btn-start" id="startBtn">▶</button>
<button class="btn-skip" id="skipBtn">⏭</button>
</div>
<div class="stats">
<div class="stat">
<div class="stat-value" id="pomodoroCount">0</div>
<div class="stat-label">完了セッション</div>
</div>
<div class="stat">
<div class="stat-value" id="totalTime">0分</div>
<div class="stat-label">累計作業時間</div>
</div>
</div>
<div class="settings">
<h3>⚙️ 設定</h3>
<div class="setting-row">
<label>作業時間（分）</label>
<input type="number" id="workDuration" value="25" min="1" max="60">
</div>
<div class="setting-row">
<label>小休憩（分）</label>
<input type="number" id="shortBreak" value="5" min="1" max="30">
</div>
<div class="setting-row">
<label>長休憩（分）</label>
<input type="number" id="longBreak" value="15" min="1" max="60">
</div>
<div class="setting-row">
<label>サウンド</label>
<div class="toggle active" id="soundToggle"></div>
</div>
<div class="setting-row">
<label>自動開始</label>
<div class="toggle" id="autoStartToggle"></div>
</div>
</div>
<div class="tasks">
<h3>📝 タスクリスト</h3>
<div class="task-input">
<input type="text" id="taskInput" placeholder="タスクを追加...">
<button id="addTaskBtn">追加</button>
</div>
<div class="task-list" id="taskList"></div>
</div>
<script src="script.js"></script>
</body>
</html>
