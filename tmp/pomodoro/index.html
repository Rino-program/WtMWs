<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pomodoro Timer - ポモドーロタイマー</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
h1{font-size:clamp(1.5rem,4vw,2rem);margin-bottom:20px;background:linear-gradient(90deg,#f5576c,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mode-tabs{display:flex;gap:8px;margin-bottom:25px}
.mode-tabs button{background:rgba(255,255,255,0.08);border:none;color:#888;padding:12px 20px;border-radius:20px;cursor:pointer;font-size:0.9rem;transition:all 0.2s}
.mode-tabs button.active{color:#fff}
.mode-tabs button[data-mode="work"].active{background:linear-gradient(135deg,#f5576c,#f093fb)}
.mode-tabs button[data-mode="short"].active{background:linear-gradient(135deg,#43e97b,#38f9d7)}
.mode-tabs button[data-mode="long"].active{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.timer-container{position:relative;width:280px;height:280px;margin:20px 0}
.timer-ring{width:100%;height:100%}
.timer-ring circle{fill:none;stroke-width:8}
.timer-ring .bg{stroke:rgba(255,255,255,0.1)}
.timer-ring .progress{stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 0.5s,stroke 0.3s}
.timer-ring .progress.work{stroke:#f5576c}
.timer-ring .progress.short{stroke:#43e97b}
.timer-ring .progress.long{stroke:#4facfe}
.timer-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.timer-time{font-size:4rem;font-weight:200;letter-spacing:-2px}
.timer-label{font-size:0.9rem;color:#888;margin-top:5px}
.controls{display:flex;gap:15px;margin:25px 0}
.controls button{width:70px;height:70px;border-radius:50%;border:none;font-size:1.5rem;cursor:pointer;transition:all 0.2s}
.controls button:active{transform:scale(0.95)}
.btn-start{background:linear-gradient(135deg,#f5576c,#f093fb);color:#fff}
.btn-reset{background:rgba(255,255,255,0.1);color:#fff}
.btn-skip{background:rgba(79,172,254,0.2);color:#4facfe}
.stats{display:flex;gap:25px;margin-top:20px}
.stat{text-align:center;padding:15px 25px;background:rgba(255,255,255,0.05);border-radius:15px}
.stat-value{font-size:2rem;font-weight:bold;background:linear-gradient(90deg,#f5576c,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:0.8rem;color:#888;margin-top:5px}
.settings{margin-top:30px;padding:20px;background:rgba(0,0,0,0.3);border-radius:15px;width:100%;max-width:400px}
.settings h3{font-size:1rem;color:#888;margin-bottom:15px}
.setting-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.setting-row label{color:#aaa;font-size:0.9rem}
.setting-row input{width:80px;padding:8px;text-align:center;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;font-size:1rem}
.setting-row input:focus{border-color:#f5576c;outline:none}
.toggle{position:relative;width:50px;height:26px;background:rgba(255,255,255,0.1);border-radius:13px;cursor:pointer;transition:background 0.3s}
.toggle.active{background:linear-gradient(135deg,#f5576c,#f093fb)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform 0.3s}
.toggle.active::after{transform:translateX(24px)}
.tasks{margin-top:25px;width:100%;max-width:400px}
.tasks h3{font-size:1rem;color:#888;margin-bottom:15px}
.task-input{display:flex;gap:10px;margin-bottom:15px}
.task-input input{flex:1;padding:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:0.95rem}
.task-input button{padding:12px 20px;background:linear-gradient(135deg,#f5576c,#f093fb);border:none;border-radius:10px;color:#fff;cursor:pointer}
.task-list{max-height:200px;overflow-y:auto}
.task-item{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,0.05);border-radius:10px;margin-bottom:8px}
.task-item input[type=checkbox]{width:20px;height:20px;accent-color:#f5576c}
.task-item.done span{text-decoration:line-through;color:#666}
.task-item button{margin-left:auto;background:none;border:none;color:#666;cursor:pointer;font-size:1.2rem}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>🍅 ポモドーロタイマー</h1>
<div class="mode-tabs">
<button class="active" data-mode="work">作業 25分</button>
<button data-mode="short">小休憩 5分</button>
<button data-mode="long">長休憩 15分</button>
</div>
<div class="timer-container">
<svg class="timer-ring" viewBox="0 0 280 280">
<circle class="bg" cx="140" cy="140" r="125"/>
<circle class="progress work" id="progress" cx="140" cy="140" r="125" stroke-dasharray="785.4" stroke-dashoffset="0"/>
</svg>
<div class="timer-display">
<div class="timer-time" id="time">25:00</div>
<div class="timer-label" id="label">作業時間</div>
</div>
</div>
<div class="controls">
<button class="btn-reset" id="resetBtn">↺</button>
<button class="btn-start" id="startBtn">▶</button>
<button class="btn-skip" id="skipBtn">⏭</button>
</div>
<div class="stats">
<div class="stat">
<div class="stat-value" id="pomodoroCount">0</div>
<div class="stat-label">完了セッション</div>
</div>
<div class="stat">
<div class="stat-value" id="totalTime">0分</div>
<div class="stat-label">累計作業時間</div>
</div>
</div>
<div class="settings">
<h3>⚙️ 設定</h3>
<div class="setting-row">
<label>作業時間（分）</label>
<input type="number" id="workDuration" value="25" min="1" max="60">
</div>
<div class="setting-row">
<label>小休憩（分）</label>
<input type="number" id="shortBreak" value="5" min="1" max="30">
</div>
<div class="setting-row">
<label>長休憩（分）</label>
<input type="number" id="longBreak" value="15" min="1" max="60">
</div>
<div class="setting-row">
<label>サウンド</label>
<div class="toggle active" id="soundToggle"></div>
</div>
<div class="setting-row">
<label>自動開始</label>
<div class="toggle" id="autoStartToggle"></div>
</div>
</div>
<div class="tasks">
<h3>📝 タスクリスト</h3>
<div class="task-input">
<input type="text" id="taskInput" placeholder="タスクを追加...">
<button id="addTaskBtn">追加</button>
</div>
<div class="task-list" id="taskList"></div>
</div>
<script>
const circumference=2*Math.PI*125;
const progress=document.getElementById('progress');
const timeDisplay=document.getElementById('time');
const labelDisplay=document.getElementById('label');
progress.style.strokeDasharray=circumference;

const modes={
    work:{duration:25*60,label:'作業時間',class:'work'},
    short:{duration:5*60,label:'小休憩',class:'short'},
    long:{duration:15*60,label:'長休憩',class:'long'}
};

let currentMode='work',remaining=modes.work.duration,total=modes.work.duration;
let running=false,interval;
let pomodoroCount=0,totalMinutes=0;
let soundEnabled=true,autoStart=false;
let tasks=JSON.parse(localStorage.getItem('pomodoroTasks')||'[]');

function updateDisplay(){
    const m=Math.floor(remaining/60);
    const s=remaining%60;
    timeDisplay.textContent=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    const offset=circumference*(1-remaining/total);
    progress.style.strokeDashoffset=offset;
    document.title=`${timeDisplay.textContent} - ポモドーロ`;
}

function setMode(mode){
    currentMode=mode;
    total=modes[mode].duration;
    remaining=total;
    labelDisplay.textContent=modes[mode].label;
    progress.className='progress '+modes[mode].class;
    document.querySelectorAll('.mode-tabs button').forEach(b=>{
        b.classList.toggle('active',b.dataset.mode===mode);
    });
    updateDisplay();
}

function tick(){
    remaining--;
    if(remaining<=0){
        stop();
        playSound();
        if(currentMode==='work'){
            pomodoroCount++;
            totalMinutes+=modes.work.duration/60;
            updateStats();
            localStorage.setItem('pomodoroStats',JSON.stringify({count:pomodoroCount,minutes:totalMinutes}));
        }
        const next=currentMode==='work'?(pomodoroCount%4===0?'long':'short'):'work';
        setMode(next);
        if(autoStart)start();
    }
    updateDisplay();
}

function start(){
    if(running)return;
    running=true;
    interval=setInterval(tick,1000);
    document.getElementById('startBtn').textContent='⏸';
}

function stop(){
    running=false;
    clearInterval(interval);
    document.getElementById('startBtn').textContent='▶';
}

function toggle(){
    running?stop():start();
}

function reset(){
    stop();
    remaining=total;
    updateDisplay();
}

function skip(){
    stop();
    const next=currentMode==='work'?(pomodoroCount%4===0?'long':'short'):'work';
    setMode(next);
}

function playSound(){
    if(!soundEnabled)return;
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,150,300].forEach(delay=>{
        setTimeout(()=>{
            const osc=ctx.createOscillator();
            const gain=ctx.createGain();
            osc.connect(gain);gain.connect(ctx.destination);
            osc.frequency.value=currentMode==='work'?523:784;
            gain.gain.setValueAtTime(0.3,ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.2);
            osc.start();osc.stop(ctx.currentTime+0.2);
        },delay);
    });
}

function updateStats(){
    document.getElementById('pomodoroCount').textContent=pomodoroCount;
    document.getElementById('totalTime').textContent=totalMinutes+'分';
}

function saveTasks(){
    localStorage.setItem('pomodoroTasks',JSON.stringify(tasks));
}

function renderTasks(){
    document.getElementById('taskList').innerHTML=tasks.map((t,i)=>`
        <div class="task-item${t.done?' done':''}">
            <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})">
            <span>${t.text}</span>
            <button onclick="deleteTask(${i})">×</button>
        </div>
    `).join('');
}

window.toggleTask=function(i){
    tasks[i].done=!tasks[i].done;
    saveTasks();renderTasks();
};

window.deleteTask=function(i){
    tasks.splice(i,1);
    saveTasks();renderTasks();
};

function addTask(){
    const input=document.getElementById('taskInput');
    if(!input.value.trim())return;
    tasks.push({text:input.value.trim(),done:false});
    input.value='';
    saveTasks();renderTasks();
}

document.getElementById('startBtn').onclick=toggle;
document.getElementById('resetBtn').onclick=reset;
document.getElementById('skipBtn').onclick=skip;

document.querySelectorAll('.mode-tabs button').forEach(btn=>{
    btn.onclick=()=>setMode(btn.dataset.mode);
});

document.getElementById('workDuration').onchange=e=>{
    modes.work.duration=+e.target.value*60;
    if(currentMode==='work')setMode('work');
};
document.getElementById('shortBreak').onchange=e=>{
    modes.short.duration=+e.target.value*60;
    if(currentMode==='short')setMode('short');
};
document.getElementById('longBreak').onchange=e=>{
    modes.long.duration=+e.target.value*60;
    if(currentMode==='long')setMode('long');
};

document.getElementById('soundToggle').onclick=function(){
    soundEnabled=!soundEnabled;
    this.classList.toggle('active',soundEnabled);
};

document.getElementById('autoStartToggle').onclick=function(){
    autoStart=!autoStart;
    this.classList.toggle('active',autoStart);
};

document.getElementById('addTaskBtn').onclick=addTask;
document.getElementById('taskInput').onkeydown=e=>{if(e.key==='Enter')addTask()};

// 復元
const savedStats=JSON.parse(localStorage.getItem('pomodoroStats')||'{}');
if(savedStats.count){pomodoroCount=savedStats.count;totalMinutes=savedStats.minutes||0;updateStats()}

setMode('work');
renderTasks();
</script>
</body>
</html>
