<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Dキューブワールド</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="scene" id="scene">
        <div class="cube-container" id="cubeContainer"></div>
    </div>
    
    <div class="controls">
        <h3>🎲 3D設定</h3>
        <div class="control-group">
            <label>配置モード</label>
            <select id="layoutMode">
                <option value="orbit">オービット</option>
                <option value="helix">ヘリックス</option>
                <option value="grid">グリッド</option>
                <option value="sphere">スフィア</option>
                <option value="tower">タワー</option>
            </select>
        </div>
        <div class="control-group">
            <label>キューブ数: <span id="countVal">6</span></label>
            <input type="range" id="cubeCount" min="3" max="12" value="6">
        </div>
        <div class="control-group">
            <label>サイズ: <span id="sizeVal">60</span></label>
            <input type="range" id="cubeSize" min="30" max="100" value="60">
        </div>
        <div class="control-group">
            <label>回転速度: <span id="speedVal">20</span>s</label>
            <input type="range" id="speed" min="5" max="60" value="20">
        </div>
        <div class="control-group">
            <label>色相: <span id="hueVal">160</span></label>
            <input type="range" id="hue" min="0" max="360" value="160">
        </div>
        <div>
            <button class="btn" id="toggleAnim">停止</button>
            <button class="btn" id="randomize">ランダム</button>
        </div>
    </div>
    
    <a href="../" class="back-link">← 戻る</a>

    <script src="script.js"></script>
</body>
</html>
