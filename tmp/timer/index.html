<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Timer - タイマー＆ストップウォッチ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
h1{font-size:clamp(1.5rem,4vw,2rem);margin-bottom:25px;background:linear-gradient(90deg,#43e97b,#38f9d7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:10px;margin-bottom:30px}
.tabs button{background:rgba(255,255,255,0.1);border:none;color:#fff;padding:12px 25px;border-radius:25px;cursor:pointer;font-size:1rem;transition:all 0.2s}
.tabs button.active{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#000}
.panel{display:none;text-align:center;width:100%;max-width:500px}
.panel.active{display:block}
.time-display{font-size:clamp(3rem,12vw,6rem);font-weight:200;margin:30px 0;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.time-display.warning{color:#fa709a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:0.7}}
.ms{font-size:0.4em;color:#888}
.controls{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
.controls button{width:80px;height:80px;border-radius:50%;border:none;font-size:1.5rem;cursor:pointer;transition:all 0.2s}
.controls button:active{transform:scale(0.95)}
.btn-start{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#000}
.btn-stop{background:linear-gradient(135deg,#f5576c,#f093fb);color:#fff}
.btn-reset{background:rgba(255,255,255,0.1);color:#fff}
.btn-lap{background:rgba(79,172,254,0.3);color:#4facfe}
.timer-presets{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap;justify-content:center}
.timer-presets button{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px 18px;border-radius:20px;cursor:pointer;font-size:0.9rem}
.timer-presets button:hover{background:rgba(255,255,255,0.15)}
.timer-custom{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:20px}
.timer-custom input{width:60px;padding:12px;text-align:center;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:10px;color:#fff;font-size:1.2rem}
.timer-custom span{color:#888;font-size:1.2rem}
.laps{max-height:200px;overflow-y:auto;margin-top:25px;text-align:left}
.lap{display:flex;justify-content:space-between;padding:10px 15px;background:rgba(255,255,255,0.05);border-radius:8px;margin-bottom:8px}
.lap-num{color:#888}
.lap-time{color:#4facfe}
.lap-diff{color:#43e97b;font-size:0.85rem}
.progress-ring{width:250px;height:250px;margin:0 auto 20px}
.progress-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.progress-ring .bg{stroke:rgba(255,255,255,0.1)}
.progress-ring .progress{stroke:url(#gradient);transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 0.3s}
.timer-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.5rem;font-weight:200}
.ring-container{position:relative;width:250px;height:250px;margin:0 auto 20px}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>⏱️ タイマー＆ストップウォッチ</h1>
<div class="tabs">
<button class="active" data-tab="stopwatch">ストップウォッチ</button>
<button data-tab="timer">タイマー</button>
</div>

<div class="panel active" id="stopwatch">
<div class="time-display" id="swDisplay">00:00:00<span class="ms">.000</span></div>
<div class="controls">
<button class="btn-start" id="swStart">▶</button>
<button class="btn-lap" id="swLap" disabled>📍</button>
<button class="btn-reset" id="swReset">↺</button>
</div>
<div class="laps" id="laps"></div>
</div>

<div class="panel" id="timer">
<div class="timer-presets">
<button data-time="60">1分</button>
<button data-time="180">3分</button>
<button data-time="300">5分</button>
<button data-time="600">10分</button>
<button data-time="1800">30分</button>
<button data-time="3600">1時間</button>
</div>
<div class="timer-custom">
<input type="number" id="timerH" value="0" min="0" max="23">
<span>:</span>
<input type="number" id="timerM" value="5" min="0" max="59">
<span>:</span>
<input type="number" id="timerS" value="0" min="0" max="59">
</div>
<div class="ring-container">
<svg class="progress-ring" viewBox="0 0 250 250">
<defs><linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#43e97b"/><stop offset="100%" stop-color="#38f9d7"/>
</linearGradient></defs>
<circle class="bg" cx="125" cy="125" r="110"/>
<circle class="progress" id="timerProgress" cx="125" cy="125" r="110" stroke-dasharray="691.15" stroke-dashoffset="0"/>
</svg>
<div class="timer-display" id="timerDisplay">05:00</div>
</div>
<div class="controls">
<button class="btn-start" id="timerStart">▶</button>
<button class="btn-reset" id="timerReset">↺</button>
</div>
</div>

<script>
// ストップウォッチ
let swRunning=false,swStart=0,swElapsed=0,swInterval,laps=[];
const swDisplay=document.getElementById('swDisplay');
const lapsEl=document.getElementById('laps');

function formatTime(ms,showMs=true){
    const h=Math.floor(ms/3600000);
    const m=Math.floor((ms%3600000)/60000);
    const s=Math.floor((ms%60000)/1000);
    const msec=ms%1000;
    let str=`${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    if(showMs)str+=`<span class="ms">.${msec.toString().padStart(3,'0')}</span>`;
    return str;
}

function formatTimeSimple(ms){
    const h=Math.floor(ms/3600000);
    const m=Math.floor((ms%3600000)/60000);
    const s=Math.floor((ms%60000)/1000);
    if(h>0)return`${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    return`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function updateStopwatch(){
    const current=Date.now()-swStart+swElapsed;
    swDisplay.innerHTML=formatTime(current);
}

document.getElementById('swStart').onclick=function(){
    if(swRunning){
        swRunning=false;
        swElapsed+=Date.now()-swStart;
        clearInterval(swInterval);
        this.textContent='▶';
        this.className='btn-start controls button';
        document.getElementById('swLap').disabled=true;
    }else{
        swRunning=true;
        swStart=Date.now();
        swInterval=setInterval(updateStopwatch,10);
        this.textContent='⏸';
        this.className='btn-stop controls button';
        document.getElementById('swLap').disabled=false;
    }
};

document.getElementById('swLap').onclick=function(){
    if(!swRunning)return;
    const current=Date.now()-swStart+swElapsed;
    const diff=laps.length>0?current-laps[laps.length-1].time:current;
    laps.push({time:current,diff});
    renderLaps();
};

document.getElementById('swReset').onclick=function(){
    swRunning=false;
    swElapsed=0;
    clearInterval(swInterval);
    swDisplay.innerHTML=formatTime(0);
    document.getElementById('swStart').textContent='▶';
    document.getElementById('swStart').className='btn-start controls button';
    document.getElementById('swLap').disabled=true;
    laps=[];
    lapsEl.innerHTML='';
};

function renderLaps(){
    lapsEl.innerHTML=laps.map((lap,i)=>`
        <div class="lap">
            <span class="lap-num">ラップ ${i+1}</span>
            <span class="lap-diff">+${formatTimeSimple(lap.diff)}</span>
            <span class="lap-time">${formatTimeSimple(lap.time)}</span>
        </div>
    `).reverse().join('');
}

// タイマー
let timerRunning=false,timerTotal=300000,timerRemaining=300000,timerInterval;
const timerDisplay=document.getElementById('timerDisplay');
const timerProgress=document.getElementById('timerProgress');
const circumference=2*Math.PI*110;
timerProgress.style.strokeDasharray=circumference;

function updateTimer(){
    timerRemaining-=100;
    if(timerRemaining<=0){
        timerRemaining=0;
        stopTimer();
        playAlarm();
    }
    timerDisplay.textContent=formatTimeSimple(timerRemaining);
    const progress=(timerTotal-timerRemaining)/timerTotal;
    timerProgress.style.strokeDashoffset=circumference*(1-progress);
    timerDisplay.parentElement.querySelector('.progress').style.stroke=
        timerRemaining<10000?'#f5576c':'url(#gradient)';
    if(timerRemaining<10000)timerDisplay.classList.add('warning');
}

function stopTimer(){
    timerRunning=false;
    clearInterval(timerInterval);
    document.getElementById('timerStart').textContent='▶';
    document.getElementById('timerStart').className='btn-start controls button';
}

function playAlarm(){
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,200,400].forEach(delay=>{
        setTimeout(()=>{
            const osc=ctx.createOscillator();
            const gain=ctx.createGain();
            osc.connect(gain);gain.connect(ctx.destination);
            osc.frequency.value=880;
            gain.gain.setValueAtTime(0.3,ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3);
            osc.start();osc.stop(ctx.currentTime+0.3);
        },delay);
    });
}

function setTimerFromInputs(){
    const h=+document.getElementById('timerH').value||0;
    const m=+document.getElementById('timerM').value||0;
    const s=+document.getElementById('timerS').value||0;
    timerTotal=timerRemaining=(h*3600+m*60+s)*1000;
    timerDisplay.textContent=formatTimeSimple(timerRemaining);
    timerProgress.style.strokeDashoffset=0;
    timerDisplay.classList.remove('warning');
}

document.getElementById('timerStart').onclick=function(){
    if(timerRunning){
        stopTimer();
    }else{
        if(timerRemaining<=0)setTimerFromInputs();
        if(timerRemaining<=0)return;
        timerRunning=true;
        timerInterval=setInterval(updateTimer,100);
        this.textContent='⏸';
        this.className='btn-stop controls button';
    }
};

document.getElementById('timerReset').onclick=function(){
    stopTimer();
    setTimerFromInputs();
};

document.querySelectorAll('.timer-presets button').forEach(btn=>{
    btn.onclick=function(){
        const secs=+this.dataset.time;
        const h=Math.floor(secs/3600);
        const m=Math.floor((secs%3600)/60);
        const s=secs%60;
        document.getElementById('timerH').value=h;
        document.getElementById('timerM').value=m;
        document.getElementById('timerS').value=s;
        setTimerFromInputs();
    };
});

['timerH','timerM','timerS'].forEach(id=>{
    document.getElementById(id).onchange=setTimerFromInputs;
});

document.querySelectorAll('.tabs button').forEach(btn=>{
    btn.onclick=function(){
        document.querySelector('.tabs .active').classList.remove('active');
        document.querySelector('.panel.active').classList.remove('active');
        this.classList.add('active');
        document.getElementById(this.dataset.tab).classList.add('active');
    };
});

setTimerFromInputs();
</script>
</body>
</html>
