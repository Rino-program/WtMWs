<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Habit Tracker - 習慣トラッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="header">
<h1>📋 習慣トラッカー</h1>
<div class="today-info" id="todayInfo"></div>
</div>
<div class="container">
<div class="stats-row">
<div class="stat-card"><div class="stat-val" id="totalHabits">0</div><div class="stat-label">登録した習慣</div></div>
<div class="stat-card"><div class="stat-val" id="todayDone">0%</div><div class="stat-label">今日の達成率</div></div>
<div class="stat-card"><div class="stat-val" id="maxStreak">0</div><div class="stat-label">最長ストリーク</div></div>
<div class="stat-card"><div class="stat-val" id="totalDays">0</div><div class="stat-label">継続日数</div></div>
</div>
<div class="section">
<div class="section-header">
<span class="section-title">今日の習慣</span>
<button class="add-btn" onclick="openModal()">+</button>
</div>
<div class="habit-list" id="habitList"></div>
<div class="week-view" id="weekView"></div>
</div>
<div class="section">
<div class="section-header"><span class="section-title">カレンダー</span></div>
<div class="calendar">
<div class="calendar-header">
<button class="calendar-nav" onclick="changeMonth(-1)">◀</button>
<span class="calendar-title" id="calendarTitle"></span>
<button class="calendar-nav" onclick="changeMonth(1)">▶</button>
</div>
<div class="calendar-grid" id="calendarGrid"></div>
</div>
</div>
</div>
<div class="modal" id="modal" onclick="event.target===this&&closeModal()">
<div class="modal-content">
<div class="modal-title" id="modalTitle">新しい習慣を追加</div>
<div class="form-group">
<label>習慣名</label>
<input type="text" id="habitName" placeholder="例：毎日運動する">
</div>
<div class="form-group">
<label>アイコン</label>
<div class="icon-picker" id="iconPicker"></div>
</div>
<div class="form-group">
<label>頻度</label>
<select id="habitFreq">
<option value="daily">毎日</option>
<option value="weekdays">平日のみ</option>
<option value="weekends">週末のみ</option>
</select>
</div>
<div class="modal-actions">
<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
<button class="btn-save" onclick="saveHabit()">保存</button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
