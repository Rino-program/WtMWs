<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ランダム生成器 - Random Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #8e2de2 0%, #4a00e0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px 40px;
            color: #fff;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 100;
        }
        .back-link:hover { background: rgba(255,255,255,0.3); }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        
        .generators {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
        }
        
        .generator {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }
        
        .generator h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .result-display {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
        
        .options {
            margin-bottom: 20px;
        }
        
        .option-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .option-row label {
            font-size: 0.9rem;
        }
        
        .option-row input {
            width: 80px;
            padding: 8px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            color: #fff;
            text-align: center;
        }
        
        .generate-btn {
            padding: 15px 40px;
            background: #fff;
            color: #8e2de2;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .generate-btn:active {
            transform: scale(0.95);
        }
        
        /* 特殊スタイル */
        .dice-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .dice {
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #8e2de2;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: none;
        }
        
        .dice.rolling {
            animation: roll 0.1s infinite;
        }
        
        @keyframes roll {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }
        
        .coin {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: transform 0.5s;
        }
        
        .coin.flipping {
            animation: flip 0.5s;
        }
        
        @keyframes flip {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(720deg); }
        }
        
        .color-preview {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            margin: 0 auto 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .color-code {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            padding: 10px 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
        }
        
        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        
        .wheel-section {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }
        
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
        }
        
        .name-list {
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .name-list div {
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .name-list div.selected {
            background: rgba(255,255,255,0.3);
        }
        
        .history-mini {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>🎲 ランダム生成器</h1>
    
    <div class="generators">
        <!-- 数字ランダム -->
        <div class="generator">
            <h2>🔢 数字ランダム</h2>
            <div class="result-display">
                <div class="result-value" id="number-result">?</div>
            </div>
            <div class="options">
                <div class="option-row">
                    <label>最小値</label>
                    <input type="number" id="min-num" value="1">
                    <label>〜</label>
                    <label>最大値</label>
                    <input type="number" id="max-num" value="100">
                </div>
            </div>
            <button class="generate-btn" onclick="generateNumber()">生成</button>
            <div class="history-mini" id="number-history"></div>
        </div>
        
        <!-- サイコロ -->
        <div class="generator">
            <h2>🎲 サイコロ</h2>
            <div class="result-display">
                <div class="dice-container" id="dice-container">
                    <div class="dice">🎲</div>
                </div>
            </div>
            <div class="options">
                <div class="option-row">
                    <label>サイコロ数</label>
                    <input type="number" id="dice-count" value="2" min="1" max="6">
                    <label>面数</label>
                    <input type="number" id="dice-sides" value="6" min="2" max="100">
                </div>
            </div>
            <button class="generate-btn" onclick="rollDice()">振る</button>
            <div class="history-mini" id="dice-total">合計: -</div>
        </div>
        
        <!-- コイントス -->
        <div class="generator">
            <h2>🪙 コイントス</h2>
            <div class="result-display">
                <div class="coin" id="coin">❓</div>
            </div>
            <button class="generate-btn" onclick="flipCoin()">投げる</button>
            <div class="history-mini" id="coin-stats">表: 0 | 裏: 0</div>
        </div>
        
        <!-- 色ランダム -->
        <div class="generator">
            <h2>🎨 色ランダム</h2>
            <div class="result-display" style="flex-direction: column; gap: 10px;">
                <div class="color-preview" id="color-preview" style="background: #8e2de2"></div>
                <div class="color-code" id="color-code" onclick="copyColor()">#8E2DE2</div>
            </div>
            <button class="generate-btn" onclick="generateColor()">生成</button>
        </div>
        
        <!-- リストから選択 -->
        <div class="generator">
            <h2>📋 リストから選択</h2>
            <div class="result-display">
                <div class="result-value" id="list-result" style="font-size: 1.5rem;">?</div>
            </div>
            <div class="name-list" id="name-list" contenteditable="true">
                山田太郎
佐藤花子
田中一郎
鈴木二郎
高橋三郎
                </div>
            <button class="generate-btn" onclick="selectFromList()">選ぶ</button>
        </div>
        
        <!-- Yes/No -->
        <div class="generator">
            <h2>✅ Yes / No</h2>
            <div class="result-display">
                <div class="result-value" id="yesno-result" style="font-size: 3rem;">🤔</div>
            </div>
            <button class="generate-btn" onclick="generateYesNo()">決める</button>
        </div>
        
        <!-- パスワード文字 -->
        <div class="generator">
            <h2>🔤 ランダム文字列</h2>
            <div class="result-display">
                <div class="result-value" id="string-result" style="font-size: 1.3rem; word-break: break-all;">ABC123</div>
            </div>
            <div class="options">
                <div class="option-row">
                    <label>文字数</label>
                    <input type="number" id="string-length" value="8" min="1" max="32">
                </div>
            </div>
            <button class="generate-btn" onclick="generateString()">生成</button>
        </div>
        
        <!-- 日付ランダム -->
        <div class="generator">
            <h2>📅 ランダム日付</h2>
            <div class="result-display">
                <div class="result-value" id="date-result" style="font-size: 1.5rem;">????年??月??日</div>
            </div>
            <div class="options">
                <div class="option-row">
                    <label>年</label>
                    <input type="number" id="year-start" value="2020" style="width: 70px">
                    <label>〜</label>
                    <input type="number" id="year-end" value="2025" style="width: 70px">
                </div>
            </div>
            <button class="generate-btn" onclick="generateDate()">生成</button>
        </div>
    </div>

    <script>
        // 数字ランダム
        let numberHistory = [];
        function generateNumber() {
            const min = parseInt(document.getElementById('min-num').value);
            const max = parseInt(document.getElementById('max-num').value);
            const num = Math.floor(Math.random() * (max - min + 1)) + min;
            
            document.getElementById('number-result').textContent = num;
            
            numberHistory.unshift(num);
            if (numberHistory.length > 5) numberHistory.pop();
            document.getElementById('number-history').textContent = 
                '履歴: ' + numberHistory.join(', ');
        }
        
        // サイコロ
        function rollDice() {
            const count = parseInt(document.getElementById('dice-count').value);
            const sides = parseInt(document.getElementById('dice-sides').value);
            const container = document.getElementById('dice-container');
            
            container.innerHTML = '';
            let total = 0;
            
            for (let i = 0; i < count; i++) {
                const dice = document.createElement('div');
                dice.className = 'dice rolling';
                container.appendChild(dice);
            }
            
            setTimeout(() => {
                const diceElements = container.querySelectorAll('.dice');
                diceElements.forEach(dice => {
                    dice.classList.remove('rolling');
                    const value = Math.floor(Math.random() * sides) + 1;
                    total += value;
                    
                    if (sides === 6) {
                        const faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
                        dice.textContent = faces[value - 1];
                    } else {
                        dice.textContent = value;
                        dice.style.fontSize = '1.5rem';
                    }
                });
                
                document.getElementById('dice-total').textContent = `合計: ${total}`;
            }, 500);
        }
        
        // コイントス
        let coinStats = { heads: 0, tails: 0 };
        function flipCoin() {
            const coin = document.getElementById('coin');
            coin.classList.add('flipping');
            
            setTimeout(() => {
                coin.classList.remove('flipping');
                const isHeads = Math.random() < 0.5;
                
                if (isHeads) {
                    coin.textContent = '😊';
                    coin.style.background = 'linear-gradient(135deg, #ffd700 0%, #ffaa00 100%)';
                    coinStats.heads++;
                } else {
                    coin.textContent = '🦅';
                    coin.style.background = 'linear-gradient(135deg, #c0c0c0 0%, #a0a0a0 100%)';
                    coinStats.tails++;
                }
                
                document.getElementById('coin-stats').textContent = 
                    `表: ${coinStats.heads} | 裏: ${coinStats.tails}`;
            }, 500);
        }
        
        // 色ランダム
        function generateColor() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            const hex = `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`.toUpperCase();
            
            document.getElementById('color-preview').style.background = hex;
            document.getElementById('color-code').textContent = hex;
        }
        
        function copyColor() {
            const code = document.getElementById('color-code').textContent;
            navigator.clipboard.writeText(code);
            document.getElementById('color-code').textContent = 'コピーしました!';
            setTimeout(() => {
                document.getElementById('color-code').textContent = code;
            }, 1000);
        }
        
        // リストから選択
        function selectFromList() {
            const listEl = document.getElementById('name-list');
            const items = listEl.innerText.trim().split('\n').filter(item => item.trim());
            
            if (items.length === 0) return;
            
            const selected = items[Math.floor(Math.random() * items.length)];
            document.getElementById('list-result').textContent = selected;
            
            // ハイライト表示
            listEl.innerHTML = items.map(item => 
                `<div class="${item === selected ? 'selected' : ''}">${item}</div>`
            ).join('');
        }
        
        // Yes/No
        function generateYesNo() {
            const result = document.getElementById('yesno-result');
            const isYes = Math.random() < 0.5;
            
            result.textContent = isYes ? '✅ YES' : '❌ NO';
            result.style.color = isYes ? '#2ecc71' : '#e74c3c';
        }
        
        // ランダム文字列
        function generateString() {
            const length = parseInt(document.getElementById('string-length').value);
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            
            document.getElementById('string-result').textContent = result;
        }
        
        // ランダム日付
        function generateDate() {
            const startYear = parseInt(document.getElementById('year-start').value);
            const endYear = parseInt(document.getElementById('year-end').value);
            
            const year = Math.floor(Math.random() * (endYear - startYear + 1)) + startYear;
            const month = Math.floor(Math.random() * 12) + 1;
            const daysInMonth = new Date(year, month, 0).getDate();
            const day = Math.floor(Math.random() * daysInMonth) + 1;
            
            const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
            const date = new Date(year, month - 1, day);
            const weekday = weekdays[date.getDay()];
            
            document.getElementById('date-result').textContent = 
                `${year}年${month}月${day}日 (${weekday})`;
        }
        
        // 初期化
        generateNumber();
        rollDice();
        generateColor();
        generateString();
        generateDate();
    </script>
</body>
</html>
