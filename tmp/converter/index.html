<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単位変換器 - Unit Converter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 100;
        }
        .back-link:hover { background: rgba(0,0,0,0.3); }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        
        .container {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
        }
        
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }
        
        .tab {
            padding: 10px 18px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .tab:hover { background: rgba(255,255,255,0.2); }
        .tab.active { background: #fff; color: #11998e; }
        
        .converter {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
        }
        
        .input-row input {
            flex: 1;
            padding: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            color: #333;
        }
        
        .input-row input:focus {
            outline: 2px solid #fff;
        }
        
        .input-row select {
            padding: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            color: #333;
            cursor: pointer;
            min-width: 120px;
        }
        
        .swap-btn {
            display: block;
            margin: 15px auto;
            width: 50px;
            height: 50px;
            background: #fff;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s;
            color: #11998e;
        }
        
        .swap-btn:hover { transform: rotate(180deg); }
        
        .result {
            text-align: center;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            margin-top: 20px;
        }
        
        .result-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .result-unit {
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .formula {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .quick-values {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }
        
        .quick-btn {
            padding: 8px 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        
        .quick-btn:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>📐 単位変換器</h1>
    
    <div class="container">
        <div class="category-tabs">
            <button class="tab active" data-category="length">📏 長さ</button>
            <button class="tab" data-category="weight">⚖️ 重量</button>
            <button class="tab" data-category="temperature">🌡️ 温度</button>
            <button class="tab" data-category="data">💾 データ</button>
            <button class="tab" data-category="time">⏰ 時間</button>
            <button class="tab" data-category="area">📐 面積</button>
        </div>
        
        <div class="converter">
            <div class="input-group">
                <label>変換元</label>
                <div class="input-row">
                    <input type="number" id="input-value" value="1" step="any">
                    <select id="from-unit"></select>
                </div>
            </div>
            
            <button class="swap-btn" onclick="swapUnits()">⇅</button>
            
            <div class="input-group">
                <label>変換先</label>
                <div class="input-row">
                    <input type="number" id="output-value" readonly>
                    <select id="to-unit"></select>
                </div>
            </div>
            
            <div class="result">
                <div class="result-value" id="result-display">1</div>
                <div class="result-unit" id="result-unit">メートル = メートル</div>
            </div>
            
            <div class="formula" id="formula">
                1 m = 1 m
            </div>
        </div>
        
        <div class="quick-values" id="quick-values"></div>
    </div>

    <script>
        const units = {
            length: {
                name: '長さ',
                units: {
                    mm: { name: 'ミリメートル', factor: 0.001 },
                    cm: { name: 'センチメートル', factor: 0.01 },
                    m: { name: 'メートル', factor: 1 },
                    km: { name: 'キロメートル', factor: 1000 },
                    inch: { name: 'インチ', factor: 0.0254 },
                    ft: { name: 'フィート', factor: 0.3048 },
                    yard: { name: 'ヤード', factor: 0.9144 },
                    mile: { name: 'マイル', factor: 1609.344 }
                },
                quickValues: [1, 10, 100, 1000]
            },
            weight: {
                name: '重量',
                units: {
                    mg: { name: 'ミリグラム', factor: 0.000001 },
                    g: { name: 'グラム', factor: 0.001 },
                    kg: { name: 'キログラム', factor: 1 },
                    t: { name: 'トン', factor: 1000 },
                    oz: { name: 'オンス', factor: 0.0283495 },
                    lb: { name: 'ポンド', factor: 0.453592 }
                },
                quickValues: [1, 10, 100, 1000]
            },
            temperature: {
                name: '温度',
                units: {
                    c: { name: '摂氏 (°C)', convert: (v, to) => {
                        if (to === 'f') return v * 9/5 + 32;
                        if (to === 'k') return v + 273.15;
                        return v;
                    }},
                    f: { name: '華氏 (°F)', convert: (v, to) => {
                        if (to === 'c') return (v - 32) * 5/9;
                        if (to === 'k') return (v - 32) * 5/9 + 273.15;
                        return v;
                    }},
                    k: { name: 'ケルビン (K)', convert: (v, to) => {
                        if (to === 'c') return v - 273.15;
                        if (to === 'f') return (v - 273.15) * 9/5 + 32;
                        return v;
                    }}
                },
                quickValues: [0, 20, 37, 100],
                special: true
            },
            data: {
                name: 'データ',
                units: {
                    b: { name: 'バイト', factor: 1 },
                    kb: { name: 'キロバイト', factor: 1024 },
                    mb: { name: 'メガバイト', factor: 1048576 },
                    gb: { name: 'ギガバイト', factor: 1073741824 },
                    tb: { name: 'テラバイト', factor: 1099511627776 }
                },
                quickValues: [1, 100, 1024, 4096]
            },
            time: {
                name: '時間',
                units: {
                    ms: { name: 'ミリ秒', factor: 0.001 },
                    s: { name: '秒', factor: 1 },
                    min: { name: '分', factor: 60 },
                    h: { name: '時間', factor: 3600 },
                    day: { name: '日', factor: 86400 },
                    week: { name: '週', factor: 604800 },
                    year: { name: '年', factor: 31536000 }
                },
                quickValues: [1, 60, 3600, 86400]
            },
            area: {
                name: '面積',
                units: {
                    mm2: { name: '平方ミリメートル', factor: 0.000001 },
                    cm2: { name: '平方センチメートル', factor: 0.0001 },
                    m2: { name: '平方メートル', factor: 1 },
                    km2: { name: '平方キロメートル', factor: 1000000 },
                    ha: { name: 'ヘクタール', factor: 10000 },
                    acre: { name: 'エーカー', factor: 4046.86 }
                },
                quickValues: [1, 100, 10000, 1000000]
            }
        };
        
        let currentCategory = 'length';
        
        function initCategory(category) {
            currentCategory = category;
            const cat = units[category];
            const fromSelect = document.getElementById('from-unit');
            const toSelect = document.getElementById('to-unit');
            
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';
            
            Object.entries(cat.units).forEach(([key, unit]) => {
                fromSelect.innerHTML += `<option value="${key}">${unit.name}</option>`;
                toSelect.innerHTML += `<option value="${key}">${unit.name}</option>`;
            });
            
            // デフォルト選択
            const keys = Object.keys(cat.units);
            fromSelect.value = keys[0];
            toSelect.value = keys[Math.min(2, keys.length - 1)];
            
            // クイック値
            const quickContainer = document.getElementById('quick-values');
            quickContainer.innerHTML = cat.quickValues.map(v => 
                `<button class="quick-btn" onclick="setQuickValue(${v})">${v}</button>`
            ).join('');
            
            convert();
        }
        
        function convert() {
            const input = parseFloat(document.getElementById('input-value').value) || 0;
            const fromUnit = document.getElementById('from-unit').value;
            const toUnit = document.getElementById('to-unit').value;
            const cat = units[currentCategory];
            
            let result;
            
            if (cat.special && currentCategory === 'temperature') {
                result = cat.units[fromUnit].convert(input, toUnit);
            } else {
                const baseValue = input * cat.units[fromUnit].factor;
                result = baseValue / cat.units[toUnit].factor;
            }
            
            document.getElementById('output-value').value = formatNumber(result);
            document.getElementById('result-display').textContent = formatNumber(result);
            document.getElementById('result-unit').textContent = 
                `${cat.units[fromUnit].name} → ${cat.units[toUnit].name}`;
            
            document.getElementById('formula').textContent = 
                `${formatNumber(input)} ${fromUnit} = ${formatNumber(result)} ${toUnit}`;
        }
        
        function formatNumber(num) {
            if (Math.abs(num) < 0.000001 && num !== 0) {
                return num.toExponential(4);
            }
            if (Math.abs(num) >= 1000000) {
                return num.toExponential(4);
            }
            return parseFloat(num.toPrecision(8)).toString();
        }
        
        function swapUnits() {
            const fromSelect = document.getElementById('from-unit');
            const toSelect = document.getElementById('to-unit');
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            convert();
        }
        
        function setQuickValue(value) {
            document.getElementById('input-value').value = value;
            convert();
        }
        
        // イベントリスナー
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelector('.tab.active').classList.remove('active');
                tab.classList.add('active');
                initCategory(tab.dataset.category);
            });
        });
        
        document.getElementById('input-value').addEventListener('input', convert);
        document.getElementById('from-unit').addEventListener('change', convert);
        document.getElementById('to-unit').addEventListener('change', convert);
        
        // 初期化
        initCategory('length');
    </script>
</body>
</html>
