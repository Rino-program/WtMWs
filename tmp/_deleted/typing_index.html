<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Typing Game - タイピングゲーム</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.back{position:fixed;top:20px;left:20px;color:#fff;text-decoration:none;font-size:1.5rem;z-index:100;opacity:0.7;transition:opacity 0.3s}
.back:hover{opacity:1}
.container{text-align:center;max-width:800px;width:90%;padding:20px}
h1{font-size:2rem;margin-bottom:20px;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:flex;justify-content:center;gap:30px;margin-bottom:30px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,0.1);padding:15px 25px;border-radius:12px}
.stat-val{font-size:2rem;font-weight:bold;color:#4facfe}
.stat-label{font-size:0.8rem;color:#aaa;margin-top:5px}
.word-display{font-size:clamp(1.5rem,5vw,3rem);margin:30px 0;padding:20px;background:rgba(0,0,0,0.3);border-radius:15px;min-height:100px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px}
.char{transition:all 0.15s}
.char.correct{color:#43e97b}
.char.wrong{color:#f5576c;animation:shake 0.3s}
.char.current{background:rgba(79,172,254,0.3);border-radius:4px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.input-area{position:relative}
#typingInput{width:100%;padding:18px 25px;font-size:1.3rem;background:rgba(255,255,255,0.1);border:2px solid rgba(79,172,254,0.5);border-radius:12px;color:#fff;outline:none;transition:border-color 0.3s}
#typingInput:focus{border-color:#4facfe}
.modes{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.modes button{background:rgba(255,255,255,0.1);border:none;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;transition:all 0.3s;font-size:0.9rem}
.modes button:hover{background:rgba(255,255,255,0.2)}
.modes button.active{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.result{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:200;flex-direction:column;align-items:center;justify-content:center}
.result.show{display:flex}
.result h2{font-size:2.5rem;margin-bottom:30px;background:linear-gradient(90deg,#f093fb,#f5576c);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:40px}
.result-stat{background:rgba(255,255,255,0.1);padding:25px;border-radius:15px}
.result-stat .val{font-size:2.5rem;color:#4facfe;font-weight:bold}
.result-stat .label{color:#aaa;margin-top:10px}
.result button{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:15px 40px;border-radius:12px;font-size:1.1rem;cursor:pointer;transition:transform 0.2s}
.result button:hover{transform:scale(1.05)}
.progress{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin-top:20px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#4facfe,#00f2fe);transition:width 0.3s;width:0}
.combo{position:fixed;top:50%;right:30px;transform:translateY(-50%);font-size:1.5rem;opacity:0;transition:all 0.3s}
.combo.show{opacity:1}
.combo-num{font-size:3rem;font-weight:bold;color:#f5576c}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="container">
<h1>⌨️ タイピングゲーム</h1>
<div class="modes">
<button class="active" data-mode="normal">ノーマル</button>
<button data-mode="time">タイムアタック</button>
<button data-mode="endless">エンドレス</button>
<button data-mode="code">コード</button>
</div>
<div class="stats">
<div class="stat"><div class="stat-val" id="wpm">0</div><div class="stat-label">WPM</div></div>
<div class="stat"><div class="stat-val" id="accuracy">100%</div><div class="stat-label">正確率</div></div>
<div class="stat"><div class="stat-val" id="timeLeft">60</div><div class="stat-label" id="timeLabel">残り時間</div></div>
<div class="stat"><div class="stat-val" id="score">0</div><div class="stat-label">スコア</div></div>
</div>
<div class="word-display" id="wordDisplay"></div>
<div class="input-area">
<input type="text" id="typingInput" placeholder="ここに入力..." autocomplete="off" autofocus>
</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
</div>
<div class="combo" id="combo"><div class="combo-num" id="comboNum">0</div>COMBO!</div>
<div class="result" id="result">
<h2>🎉 結果発表!</h2>
<div class="result-stats">
<div class="result-stat"><div class="val" id="rWpm">0</div><div class="label">WPM (1分あたりの単語数)</div></div>
<div class="result-stat"><div class="val" id="rAccuracy">0%</div><div class="label">正確率</div></div>
<div class="result-stat"><div class="val" id="rScore">0</div><div class="label">最終スコア</div></div>
<div class="result-stat"><div class="val" id="rCombo">0</div><div class="label">最大コンボ</div></div>
</div>
<button onclick="restart()">もう一度プレイ</button>
</div>
<script>
const words={
normal:['hello','world','typing','keyboard','computer','programming','javascript','function','variable','algorithm','development','application','interface','database','network'],
time:['the','and','for','are','but','not','you','all','can','her','was','one','our','out','day','get','has','him','his','how','its','may','new','now','old','see','two','way','who','boy','did','own','say','she','too','use'],
code:['const','let','var','function','return','if','else','for','while','class','import','export','async','await','try','catch','console.log','document','querySelector','addEventListener','setTimeout','Promise','Array','Object','String','Number','Boolean','null','undefined','typeof'],
endless:['apple','banana','cherry','dragon','elephant','flower','guitar','happy','island','jungle','kitchen','lemon','mountain','night','ocean','piano','queen','river','sunset','tiger','umbrella','violet','window','xylophone','yellow','zebra']
};
let mode='normal',currentWord='',charIndex=0,score=0,combo=0,maxCombo=0;
let totalChars=0,correctChars=0,startTime=0,timeLeft=60,timer=null,wordsTyped=0,isPlaying=false;

const input=document.getElementById('typingInput');
const display=document.getElementById('wordDisplay');

document.querySelectorAll('.modes button').forEach(btn=>{
btn.onclick=function(){
document.querySelector('.modes .active').classList.remove('active');
this.classList.add('active');
mode=this.dataset.mode;
restart();
};
});

function getWord(){
const list=words[mode]||words.normal;
return list[Math.floor(Math.random()*list.length)];
}

function renderWord(){
display.innerHTML=currentWord.split('').map((c,i)=>{
let cls='char';
if(i<charIndex)cls+=' correct';
if(i===charIndex)cls+=' current';
return `<span class="${cls}">${c==='\n'?'↵':c}</span>`;
}).join('');
}

function newWord(){
currentWord=getWord();
charIndex=0;
input.value='';
renderWord();
}

function updateStats(){
const elapsed=(Date.now()-startTime)/1000/60;
const wpm=elapsed>0?Math.round(wordsTyped/elapsed):0;
const acc=totalChars>0?Math.round(correctChars/totalChars*100):100;
document.getElementById('wpm').textContent=wpm;
document.getElementById('accuracy').textContent=acc+'%';
document.getElementById('score').textContent=score;
}

function showCombo(){
const el=document.getElementById('combo');
document.getElementById('comboNum').textContent=combo;
el.classList.add('show');
setTimeout(()=>el.classList.remove('show'),500);
}

function endGame(){
isPlaying=false;
clearInterval(timer);
const elapsed=(Date.now()-startTime)/1000/60;
const wpm=elapsed>0?Math.round(wordsTyped/elapsed):0;
const acc=totalChars>0?Math.round(correctChars/totalChars*100):100;
document.getElementById('rWpm').textContent=wpm;
document.getElementById('rAccuracy').textContent=acc+'%';
document.getElementById('rScore').textContent=score;
document.getElementById('rCombo').textContent=maxCombo;
document.getElementById('result').classList.add('show');
}

function restart(){
document.getElementById('result').classList.remove('show');
score=0;combo=0;maxCombo=0;totalChars=0;correctChars=0;wordsTyped=0;
timeLeft=mode==='time'?30:60;
document.getElementById('timeLeft').textContent=mode==='endless'?'∞':timeLeft;
document.getElementById('timeLabel').textContent=mode==='endless'?'タイプ数':'残り時間';
document.getElementById('progressBar').style.width='0%';
clearInterval(timer);
isPlaying=false;
newWord();
input.focus();
}

input.oninput=function(){
if(!isPlaying){
isPlaying=true;
startTime=Date.now();
if(mode!=='endless'){
timer=setInterval(()=>{
timeLeft--;
document.getElementById('timeLeft').textContent=timeLeft;
if(timeLeft<=0)endGame();
},1000);
}
}
const val=this.value;
const target=currentWord.slice(0,val.length);
totalChars++;

if(val===target){
correctChars++;
charIndex=val.length;
if(val===currentWord){
wordsTyped++;
combo++;
if(combo>maxCombo)maxCombo=combo;
score+=currentWord.length*10+combo*5;
showCombo();
newWord();
if(mode==='normal'){
const progress=Math.min(wordsTyped/15*100,100);
document.getElementById('progressBar').style.width=progress+'%';
if(wordsTyped>=15)endGame();
}
}
renderWord();
}else{
combo=0;
const chars=display.querySelectorAll('.char');
if(chars[charIndex])chars[charIndex].classList.add('wrong');
}
updateStats();
};

input.onkeydown=function(e){
if(e.key==='Tab'){e.preventDefault();restart();}
};

restart();
</script>
</body>
</html>
