<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Audio Visualizer Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="cv"></canvas>

    <!-- UI Layer -->
    <div class="ui-layer" id="uiLayer">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <a href="../" class="back-btn">← 戻る</a>
                <button class="btn-icon" id="toggleUIBtn" title="UI表示切替 (H)">👁</button>
                <button class="btn-icon" id="openSettingsBtn" title="設定">⚙️</button>
                <button class="btn-icon" id="recordBtn" title="動画保存">🎬</button>
            </div>
            <div class="info-panel">
                <div id="statusText">未選択</div>
                <div id="recordStatus" class="record-status"></div>
            </div>
        </div>

        <!-- Playlist Panel -->
        <div class="playlist-panel collapsed" id="playlistPanel">
            <div class="playlist-header">
                <span>🎵 プレイリスト</span>
                <div class="playlist-toggle" id="playlistToggle">📂</div>
            </div>
            <div class="playlist-content" id="playlistItems">
                <div class="playlist-empty">曲を追加してください</div>
            </div>
            <div class="playlist-controls">
                <label class="btn btn-primary">
                    📁 ローカル
                    <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac" multiple>
                </label>
                <button class="btn btn-google" id="gDriveBtn">☁ Drive</button>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="controls-bar" id="controlsBar">
            <div class="seek-container">
                <span id="currentTime">0:00</span>
                <input type="range" class="seek-bar" id="seekBar" value="0" min="0" step="0.1">
                <span id="duration">0:00</span>
            </div>

            <div class="main-controls">
                <div class="playback-controls">
                    <button class="btn-icon" id="prevBtn" title="前の曲">⏮</button>
                    <button class="btn-icon btn-play" id="playBtn" title="再生/一時停止">▶</button>
                    <button class="btn-icon" id="nextBtn" title="次の曲">⏭</button>
                </div>

                <div class="settings-group">
                    <select id="modeSelect" class="mode-select" title="表示モード">
                        <option value="0">バー</option>
                        <option value="1">波形</option>
                        <option value="2">周波数分布</option>
                        <option value="3">サークル</option>
                        <option value="4">スペクトラム</option>
                        <option value="5">パーティクル</option>
                        <option value="6">数値モニター</option>
                        <option value="7">オシロスコープ</option>
                        <option value="8">ミラーバー</option>
                    </select>
                    
                    <div class="volume-container">
                        <span id="volIcon">🔊</span>
                        <input type="range" id="volSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal modal-large">
            <div class="modal-header">
                <h3>⚙️ 設定</h3>
                <button class="btn-close" id="closeSettingsBtn">✖</button>
            </div>
            <div class="modal-body">
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="display">表示</button>
                    <button class="tab-btn" data-tab="audio">音声</button>
                    <button class="tab-btn" data-tab="effects">演出</button>
                    <button class="tab-btn" data-tab="gdrive">Google Drive</button>
                </div>

                <!-- Display Tab -->
                <div class="tab-content active" id="tab-display">
                    <div class="setting-group">
                        <label>波の滑らかさ (Smoothing)</label>
                        <input type="range" id="smoothingSlider" min="0" max="0.95" step="0.05" value="0.7">
                        <span id="smoothingValue">0.7</span>
                    </div>
                    <div class="setting-group">
                        <label>感度 (Sensitivity)</label>
                        <input type="range" id="sensitivitySlider" min="0.5" max="3" step="0.1" value="1">
                        <span id="sensitivityValue">1.0</span>
                    </div>
                    <div class="setting-group">
                        <label>最大高さ制限</label>
                        <input type="range" id="maxHeightSlider" min="50" max="100" step="5" value="85">
                        <span id="maxHeightValue">85%</span>
                    </div>
                    <div class="setting-group">
                        <label>背景フェード速度</label>
                        <input type="range" id="fadeSpeedSlider" min="0.05" max="0.5" step="0.05" value="0.15">
                        <span id="fadeSpeedValue">0.15</span>
                    </div>
                    <div class="setting-group">
                        <label>バー本数</label>
                        <select id="barCountSelect">
                            <option value="32">32</option>
                            <option value="64" selected>64</option>
                            <option value="128">128</option>
                        </select>
                    </div>
                </div>

                <!-- Audio Tab -->
                <div class="tab-content" id="tab-audio">
                    <div class="setting-group">
                        <label>低域カットオフ (Hz)</label>
                        <input type="range" id="lowFreqSlider" min="20" max="500" step="10" value="20">
                        <span id="lowFreqValue">20Hz</span>
                    </div>
                    <div class="setting-group">
                        <label>高域カットオフ (Hz)</label>
                        <input type="range" id="highFreqSlider" min="1000" max="20000" step="500" value="16000">
                        <span id="highFreqValue">16kHz</span>
                    </div>
                    <h4>イコライザー</h4>
                    <div class="equalizer">
                        <div class="eq-band">
                            <input type="range" id="eq60" min="-12" max="12" value="0" orient="vertical">
                            <span>60</span>
                        </div>
                        <div class="eq-band">
                            <input type="range" id="eq170" min="-12" max="12" value="0" orient="vertical">
                            <span>170</span>
                        </div>
                        <div class="eq-band">
                            <input type="range" id="eq350" min="-12" max="12" value="0" orient="vertical">
                            <span>350</span>
                        </div>
                        <div class="eq-band">
                            <input type="range" id="eq1k" min="-12" max="12" value="0" orient="vertical">
                            <span>1k</span>
                        </div>
                        <div class="eq-band">
                            <input type="range" id="eq3k" min="-12" max="12" value="0" orient="vertical">
                            <span>3k</span>
                        </div>
                        <div class="eq-band">
                            <input type="range" id="eq6k" min="-12" max="12" value="0" orient="vertical">
                            <span>6k</span>
                        </div>
                        <div class="eq-band">
                            <input type="range" id="eq12k" min="-12" max="12" value="0" orient="vertical">
                            <span>12k</span>
                        </div>
                        <div class="eq-band">
                            <input type="range" id="eq14k" min="-12" max="12" value="0" orient="vertical">
                            <span>14k</span>
                        </div>
                    </div>
                    <button class="btn" id="resetEqBtn">EQリセット</button>
                </div>

                <!-- Effects Tab -->
                <div class="tab-content" id="tab-effects">
                    <div class="setting-group">
                        <label>演出レベル</label>
                        <select id="effectLevelSelect">
                            <option value="0">無効</option>
                            <option value="1">軽量</option>
                            <option value="2" selected>標準</option>
                            <option value="3">最大</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>
                            <input type="checkbox" id="glowCheckbox" checked> グロー効果
                        </label>
                    </div>
                    <div class="setting-group">
                        <label>
                            <input type="checkbox" id="mirrorCheckbox"> ミラー反射
                        </label>
                    </div>
                    <div class="setting-group">
                        <label>
                            <input type="checkbox" id="rainbowCheckbox" checked> レインボーカラー
                        </label>
                    </div>
                    <div class="setting-group">
                        <label>固定カラー (レインボーOFF時)</label>
                        <input type="color" id="fixedColorPicker" value="#4facfe">
                    </div>
                </div>

                <!-- Google Drive Tab -->
                <div class="tab-content" id="tab-gdrive">
                    <p class="hint">Google DriveからファイルをロードするにはAPI設定が必要です。</p>
                    <div class="setting-group">
                        <label>Client ID</label>
                        <input type="text" id="clientIdInput" placeholder="xxxx.apps.googleusercontent.com">
                    </div>
                    <div class="setting-group">
                        <label>API Key</label>
                        <input type="text" id="apiKeyInput" placeholder="AIzaSy...">
                    </div>
                    <a href="GOOGLE_API_GUIDE.md" target="_blank" class="hint-link">設定方法を見る →</a>
                </div>

                <div class="settings-footer">
                    <label>
                        <input type="checkbox" id="persistSettingsCheckbox" checked> 設定を保存する
                    </label>
                    <button class="btn btn-primary" id="saveSettingsBtn">保存して閉じる</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
