<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JSON Formatter - JSON整形ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a href="../" class="back">← 戻る</a>
<div class="header"><h1>{} JSON整形ツール</h1></div>
<div class="container">
<div class="options">
<div class="option">
<label>インデント:</label>
<select id="indent">
<option value="2">2スペース</option>
<option value="4">4スペース</option>
<option value="tab">タブ</option>
<option value="0">なし（圧縮）</option>
</select>
</div>
<div class="option">
<label>表示:</label>
<select id="viewMode">
<option value="formatted">整形済み</option>
<option value="highlighted">ハイライト</option>
<option value="tree">ツリー</option>
</select>
</div>
</div>
<div class="error" id="error"></div>
<div class="controls">
<button class="btn btn-primary" onclick="formatJSON()">整形</button>
<button class="btn btn-secondary" onclick="minifyJSON()">圧縮</button>
<button class="btn btn-secondary" onclick="copyOutput()">📋 コピー</button>
<button class="btn btn-secondary" onclick="clearAll()">🗑️ クリア</button>
<button class="btn btn-secondary" onclick="loadSample()">📝 サンプル</button>
</div>
<div class="editor-container">
<div class="editor-panel">
<div class="panel-header">
<span class="panel-title">入力（JSON）</span>
<div class="panel-actions">
<button onclick="pasteFromClipboard()">📋 貼り付け</button>
</div>
</div>
<textarea id="input" placeholder='{"example": "ここにJSONを入力..."}'></textarea>
</div>
<div class="editor-panel">
<div class="panel-header">
<span class="panel-title">出力</span>
<div class="panel-actions">
<button onclick="copyOutput()">📋 コピー</button>
<button onclick="downloadJSON()">💾 保存</button>
</div>
</div>
<div class="output-area" id="output"></div>
</div>
</div>
<div class="stats" id="stats"></div>
</div>
<script src="script.js"></script>
</body>
</html>
