<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波形シミュレーター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <h3>🌊 波形設定</h3>
        <div class="control-group">
            <label>モード</label>
            <select id="mode">
                <option value="ripple">リップル（波紋）</option>
                <option value="rain">レイン（雨）</option>
                <option value="interference">干渉パターン</option>
            </select>
        </div>
        <div class="control-group">
            <label>波の強さ: <span id="ampVal">50</span></label>
            <input type="range" id="amplitude" min="10" max="150" value="50">
        </div>
        <div class="control-group">
            <label>波長: <span id="waveVal">30</span></label>
            <input type="range" id="wavelength" min="10" max="100" value="30">
        </div>
        <div class="control-group">
            <label>減衰: <span id="dampVal">0.98</span></label>
            <input type="range" id="damping" min="0.9" max="0.999" step="0.001" value="0.98">
        </div>
        <div class="control-group">
            <label>カラー</label>
            <select id="colorMode">
                <option value="gradient">グラデーション</option>
                <option value="neon">ネオン</option>
                <option value="ocean">オーシャン</option>
                <option value="fire">ファイアー</option>
            </select>
        </div>
        <div>
            <button class="btn" id="clear">クリア</button>
            <button class="btn" id="auto">自動生成</button>
        </div>
    </div>
    
    <a href="../" class="back-link">← 戻る</a>
    <div class="info">クリックで波紋を生成</div>

    <script src="script.js"></script>
</body>
</html>
