<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kaleidoscope - 万華鏡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#111;color:#fff;min-height:100vh;overflow:hidden}
.back{position:fixed;top:20px;left:20px;color:#fff;text-decoration:none;font-size:1.5rem;z-index:100;opacity:0.7;transition:opacity 0.3s}
.back:hover{opacity:1}
canvas{display:block;cursor:crosshair}
.ctrl{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);padding:15px 25px;border-radius:15px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;z-index:10}
.ctrl label{font-size:0.85rem;color:#aaa;display:flex;align-items:center;gap:6px}
.ctrl input[type=range]{width:100px;height:5px;-webkit-appearance:none;background:#333;border-radius:3px}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:linear-gradient(135deg,#f093fb,#f5576c);border-radius:50%;cursor:pointer}
.ctrl select{background:#222;color:#fff;border:1px solid #444;padding:6px 12px;border-radius:6px;cursor:pointer}
.info{position:fixed;top:20px;right:20px;background:rgba(0,0,0,0.7);padding:12px 18px;border-radius:10px;font-size:0.85rem}
.tip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:20px 30px;border-radius:15px;text-align:center;pointer-events:none;opacity:1;transition:opacity 1s}
.tip.hide{opacity:0}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<canvas id="cv"></canvas>
<div class="info">
<div>🔷 分割数: <span id="segInfo">8</span></div>
<div>🎨 モード: <span id="modeInfo">フリードロー</span></div>
</div>
<div class="tip" id="tip">✨ 画面をドラッグして描こう！</div>
<div class="ctrl">
<label>分割数<input type="range" id="segments" min="4" max="24" value="8"></label>
<label>線の太さ<input type="range" id="lineW" min="1" max="20" value="4"></label>
<label>透明度<input type="range" id="alpha" min="0.01" max="0.1" step="0.01" value="0.03"></label>
<label>モード<select id="mode">
<option value="free">フリードロー</option>
<option value="auto">オートドロー</option>
<option value="spiral">スパイラル</option>
<option value="burst">バースト</option>
</select></label>
<button onclick="clearCanvas()" style="background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer">クリア</button>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,cx,cy,segments=8,lineW=4,alpha=0.03,mode='free';
let isDrawing=false,lastX=0,lastY=0,hue=0,autoAngle=0,time=0;

function resize(){
    W=cv.width=innerWidth;H=cv.height=innerHeight;
    cx=W/2;cy=H/2;
    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
}
resize();window.onresize=resize;

document.getElementById('segments').oninput=function(){
    segments=+this.value;
    document.getElementById('segInfo').textContent=segments;
};
document.getElementById('lineW').oninput=function(){lineW=+this.value};
document.getElementById('alpha').oninput=function(){alpha=+this.value};
document.getElementById('mode').onchange=function(){
    mode=this.value;
    document.getElementById('modeInfo').textContent=this.options[this.selectedIndex].text;
};

function clearCanvas(){
    ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
}

function drawMirror(x,y,px,py){
    const dx=x-cx,dy=y-cy;
    const pdx=px-cx,pdy=py-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const angle=Math.atan2(dy,dx);
    const pAngle=Math.atan2(pdy,pdx);
    const pDist=Math.sqrt(pdx*pdx+pdy*pdy);
    
    ctx.lineWidth=lineW;
    ctx.lineCap='round';
    ctx.strokeStyle=`hsla(${hue},80%,60%,0.8)`;
    
    for(let i=0;i<segments;i++){
        const baseAngle=(Math.PI*2/segments)*i;
        // 通常
        const a1=baseAngle+angle,pa1=baseAngle+pAngle;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(pa1)*pDist,cy+Math.sin(pa1)*pDist);
        ctx.lineTo(cx+Math.cos(a1)*dist,cy+Math.sin(a1)*dist);
        ctx.stroke();
        // 鏡像
        const a2=baseAngle-angle,pa2=baseAngle-pAngle;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(pa2)*pDist,cy+Math.sin(pa2)*pDist);
        ctx.lineTo(cx+Math.cos(a2)*dist,cy+Math.sin(a2)*dist);
        ctx.stroke();
    }
    hue=(hue+1)%360;
}

cv.onmousedown=cv.ontouchstart=function(e){
    e.preventDefault();
    if(mode!=='free')return;
    isDrawing=true;
    const p=e.touches?e.touches[0]:e;
    lastX=p.clientX;lastY=p.clientY;
    document.getElementById('tip').classList.add('hide');
};
cv.onmousemove=cv.ontouchmove=function(e){
    if(!isDrawing||mode!=='free')return;
    e.preventDefault();
    const p=e.touches?e.touches[0]:e;
    drawMirror(p.clientX,p.clientY,lastX,lastY);
    lastX=p.clientX;lastY=p.clientY;
};
cv.onmouseup=cv.ontouchend=cv.onmouseleave=function(){isDrawing=false};

function autoMode(){
    const r=100+Math.sin(time*0.02)*80;
    const x=cx+Math.cos(autoAngle)*r;
    const y=cy+Math.sin(autoAngle)*r;
    const px=cx+Math.cos(autoAngle-0.1)*r;
    const py=cy+Math.sin(autoAngle-0.1)*r;
    drawMirror(x,y,px,py);
    autoAngle+=0.05+Math.sin(time*0.01)*0.03;
}

function spiralMode(){
    const r=(time%300)*0.8;
    const a=time*0.1;
    const x=cx+Math.cos(a)*r;
    const y=cy+Math.sin(a)*r;
    const px=cx+Math.cos(a-0.1)*(r-0.8);
    const py=cy+Math.sin(a-0.1)*(r-0.8);
    if(r<Math.min(W,H)/2)drawMirror(x,y,px,py);
}

function burstMode(){
    if(time%10===0){
        const a=Math.random()*Math.PI*2;
        const r=Math.random()*200+50;
        const x=cx+Math.cos(a)*r;
        const y=cy+Math.sin(a)*r;
        drawMirror(x,y,cx,cy);
    }
}

function animate(){
    ctx.fillStyle=`rgba(17,17,17,${alpha})`;
    ctx.fillRect(0,0,W,H);
    time++;
    if(mode==='auto')autoMode();
    else if(mode==='spiral')spiralMode();
    else if(mode==='burst')burstMode();
    requestAnimationFrame(animate);
}
animate();

setTimeout(()=>document.getElementById('tip').classList.add('hide'),3000);
</script>
</body>
</html>
