<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QR Code Generator - QRコード生成</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 20px 40px}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
h1{font-size:clamp(1.5rem,4vw,2rem);margin-bottom:25px;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.container{display:grid;grid-template-columns:1fr 1fr;gap:30px;max-width:900px;width:100%}
@media(max-width:700px){.container{grid-template-columns:1fr}}
.input-section{background:rgba(0,0,0,0.3);padding:25px;border-radius:20px}
.input-section h2{font-size:1rem;color:#888;margin-bottom:15px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:rgba(255,255,255,0.08);border:none;color:#888;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:0.85rem;transition:all 0.2s}
.tabs button.active{background:linear-gradient(135deg,#4facfe,#00f2fe);color:#000}
.tab-content{display:none}
.tab-content.active{display:block}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:0.85rem;color:#aaa;margin-bottom:8px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-size:1rem}
.form-group textarea{min-height:100px;resize:vertical}
.form-group input:focus,.form-group textarea:focus{border-color:#4facfe;outline:none}
.options{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,0.1)}
.options h3{font-size:0.9rem;color:#888;margin-bottom:15px}
.option-row{display:flex;gap:15px;margin-bottom:15px;flex-wrap:wrap}
.option-row .form-group{flex:1;min-width:120px;margin-bottom:0}
.color-inputs{display:flex;gap:15px}
.color-inputs .form-group{flex:1}
.color-inputs input[type=color]{height:44px;padding:3px;cursor:pointer}
.preview-section{background:rgba(0,0,0,0.3);padding:25px;border-radius:20px;display:flex;flex-direction:column;align-items:center}
.qr-preview{background:#fff;padding:20px;border-radius:15px;margin-bottom:20px}
#qrcode{width:200px;height:200px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.actions button{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:12px 24px;border-radius:10px;cursor:pointer;font-size:0.95rem;display:flex;align-items:center;gap:8px;transition:transform 0.2s}
.actions button:active{transform:scale(0.95)}
.actions button.secondary{background:rgba(255,255,255,0.1)}
.info{margin-top:20px;padding:15px;background:rgba(79,172,254,0.1);border-radius:10px;font-size:0.85rem;color:#aaa;text-align:center}
.history{margin-top:30px;width:100%;max-width:900px}
.history h2{font-size:1rem;color:#888;margin-bottom:15px}
.history-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:15px}
.history-item{background:rgba(0,0,0,0.3);padding:15px;border-radius:12px;text-align:center;cursor:pointer;transition:transform 0.2s}
.history-item:hover{transform:translateY(-4px)}
.history-item img{width:80px;height:80px;background:#fff;border-radius:8px;margin-bottom:10px}
.history-item p{font-size:0.75rem;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);padding:15px 25px;border-radius:10px;opacity:0;transition:opacity 0.3s;z-index:100}
.toast.show{opacity:1}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>📱 QRコード生成</h1>
<div class="container">
<div class="input-section">
<h2>📝 コンテンツ</h2>
<div class="tabs">
<button class="active" data-tab="text">テキスト</button>
<button data-tab="url">URL</button>
<button data-tab="wifi">WiFi</button>
<button data-tab="vcard">連絡先</button>
</div>
<div class="tab-content active" id="text">
<div class="form-group">
<label>テキスト</label>
<textarea id="textInput" placeholder="QRコードにしたいテキストを入力...">Hello World!</textarea>
</div>
</div>
<div class="tab-content" id="url">
<div class="form-group">
<label>URL</label>
<input type="url" id="urlInput" placeholder="https://example.com">
</div>
</div>
<div class="tab-content" id="wifi">
<div class="form-group">
<label>SSID（ネットワーク名）</label>
<input type="text" id="wifiSsid" placeholder="MyWiFi">
</div>
<div class="form-group">
<label>パスワード</label>
<input type="text" id="wifiPass" placeholder="password123">
</div>
<div class="form-group">
<label>暗号化</label>
<select id="wifiEnc">
<option value="WPA">WPA/WPA2</option>
<option value="WEP">WEP</option>
<option value="nopass">なし</option>
</select>
</div>
</div>
<div class="tab-content" id="vcard">
<div class="form-group">
<label>名前</label>
<input type="text" id="vcardName" placeholder="山田 太郎">
</div>
<div class="form-group">
<label>電話番号</label>
<input type="tel" id="vcardTel" placeholder="090-1234-5678">
</div>
<div class="form-group">
<label>メール</label>
<input type="email" id="vcardEmail" placeholder="example@mail.com">
</div>
<div class="form-group">
<label>会社</label>
<input type="text" id="vcardOrg" placeholder="株式会社サンプル">
</div>
</div>
<div class="options">
<h3>⚙️ オプション</h3>
<div class="option-row">
<div class="form-group">
<label>サイズ</label>
<select id="qrSize">
<option value="150">小 (150px)</option>
<option value="200" selected>中 (200px)</option>
<option value="300">大 (300px)</option>
<option value="400">特大 (400px)</option>
</select>
</div>
<div class="form-group">
<label>誤り訂正</label>
<select id="qrLevel">
<option value="L">L (7%)</option>
<option value="M" selected>M (15%)</option>
<option value="Q">Q (25%)</option>
<option value="H">H (30%)</option>
</select>
</div>
</div>
<div class="color-inputs">
<div class="form-group">
<label>前景色</label>
<input type="color" id="fgColor" value="#000000">
</div>
<div class="form-group">
<label>背景色</label>
<input type="color" id="bgColor" value="#ffffff">
</div>
</div>
</div>
</div>
<div class="preview-section">
<div class="qr-preview">
<canvas id="qrcode"></canvas>
</div>
<div class="actions">
<button onclick="downloadQR('png')">📥 PNG保存</button>
<button onclick="downloadQR('svg')" class="secondary">📥 SVG保存</button>
<button onclick="copyQR()" class="secondary">📋 コピー</button>
</div>
<div class="info">QRコードをスキャンしてテスト可能</div>
</div>
</div>
<div class="history">
<h2>📜 履歴</h2>
<div class="history-list" id="historyList"></div>
</div>
<div class="toast" id="toast">コピーしました！</div>
<script>
// QRコード生成ライブラリ（簡易版）
const QRCode={
    generate:function(text,options){
        const canvas=document.getElementById('qrcode');
        const ctx=canvas.getContext('2d');
        const size=options.size||200;
        canvas.width=size;
        canvas.height=size;
        
        // 簡易QRコード生成（実際のプロジェクトではqrcode.jsなどのライブラリを使用）
        const modules=this.createMatrix(text,options.level||'M');
        const moduleSize=size/modules.length;
        
        ctx.fillStyle=options.bgColor||'#fff';
        ctx.fillRect(0,0,size,size);
        ctx.fillStyle=options.fgColor||'#000';
        
        modules.forEach((row,y)=>{
            row.forEach((cell,x)=>{
                if(cell)ctx.fillRect(x*moduleSize,y*moduleSize,moduleSize,moduleSize);
            });
        });
    },
    createMatrix:function(text,level){
        // 簡易的なQRコードマトリクス生成
        const size=21+Math.floor(text.length/10)*4;
        const matrix=Array(size).fill().map(()=>Array(size).fill(false));
        
        // ファインダーパターン
        [[0,0],[size-7,0],[0,size-7]].forEach(([ox,oy])=>{
            for(let i=0;i<7;i++){
                for(let j=0;j<7;j++){
                    if(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4)){
                        if(ox+i<size&&oy+j<size)matrix[oy+j][ox+i]=true;
                    }
                }
            }
        });
        
        // タイミングパターン
        for(let i=8;i<size-8;i++){
            matrix[6][i]=matrix[i][6]=i%2===0;
        }
        
        // データ（テキストをバイナリ変換してパターン化）
        let hash=0;
        for(let i=0;i<text.length;i++){
            hash=((hash<<5)-hash)+text.charCodeAt(i);
            hash=hash&hash;
        }
        
        for(let y=0;y<size;y++){
            for(let x=0;x<size;x++){
                if((x<9&&y<9)||(x<9&&y>size-9)||(x>size-9&&y<9))continue;
                if(x===6||y===6)continue;
                const idx=y*size+x;
                matrix[y][x]=((hash>>>(idx%32))&1)===1||(((x+y)*hash)%7<3);
            }
        }
        
        return matrix;
    }
};

let currentTab='text';
let history=JSON.parse(localStorage.getItem('qrHistory')||'[]');

function getContent(){
    switch(currentTab){
        case'text':return document.getElementById('textInput').value;
        case'url':return document.getElementById('urlInput').value;
        case'wifi':
            const ssid=document.getElementById('wifiSsid').value;
            const pass=document.getElementById('wifiPass').value;
            const enc=document.getElementById('wifiEnc').value;
            return`WIFI:T:${enc};S:${ssid};P:${pass};;`;
        case'vcard':
            const name=document.getElementById('vcardName').value;
            const tel=document.getElementById('vcardTel').value;
            const email=document.getElementById('vcardEmail').value;
            const org=document.getElementById('vcardOrg').value;
            return`BEGIN:VCARD\nVERSION:3.0\nN:${name}\nTEL:${tel}\nEMAIL:${email}\nORG:${org}\nEND:VCARD`;
        default:return'';
    }
}

function generateQR(){
    const content=getContent();
    if(!content)return;
    
    QRCode.generate(content,{
        size:+document.getElementById('qrSize').value,
        level:document.getElementById('qrLevel').value,
        fgColor:document.getElementById('fgColor').value,
        bgColor:document.getElementById('bgColor').value
    });
}

function downloadQR(format){
    const canvas=document.getElementById('qrcode');
    const content=getContent();
    
    if(format==='png'){
        const link=document.createElement('a');
        link.download='qrcode.png';
        link.href=canvas.toDataURL('image/png');
        link.click();
    }else{
        // SVG変換（簡易）
        const ctx=canvas.getContext('2d');
        const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
        let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${canvas.width}" height="${canvas.height}">`;
        svg+=`<rect width="100%" height="100%" fill="${document.getElementById('bgColor').value}"/>`;
        // 簡易SVG変換
        const fg=document.getElementById('fgColor').value;
        for(let y=0;y<canvas.height;y++){
            for(let x=0;x<canvas.width;x++){
                const idx=(y*canvas.width+x)*4;
                if(imageData.data[idx]<128){
                    svg+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${fg}"/>`;
                }
            }
        }
        svg+='</svg>';
        const blob=new Blob([svg],{type:'image/svg+xml'});
        const link=document.createElement('a');
        link.download='qrcode.svg';
        link.href=URL.createObjectURL(blob);
        link.click();
    }
    
    addToHistory(content);
}

function copyQR(){
    const canvas=document.getElementById('qrcode');
    canvas.toBlob(blob=>{
        navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
        showToast();
    });
}

function addToHistory(content){
    const canvas=document.getElementById('qrcode');
    const dataUrl=canvas.toDataURL('image/png');
    history.unshift({content:content.substring(0,30),dataUrl,date:Date.now()});
    if(history.length>12)history.pop();
    localStorage.setItem('qrHistory',JSON.stringify(history));
    renderHistory();
}

function renderHistory(){
    document.getElementById('historyList').innerHTML=history.map((h,i)=>`
        <div class="history-item" onclick="loadHistory(${i})">
            <img src="${h.dataUrl}" alt="QR">
            <p>${h.content}</p>
        </div>
    `).join('');
}

window.loadHistory=function(i){
    // 履歴から復元
    alert('履歴機能: '+history[i].content);
};

function showToast(){
    const toast=document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),2000);
}

// タブ切り替え
document.querySelectorAll('.tabs button').forEach(btn=>{
    btn.onclick=function(){
        document.querySelector('.tabs .active').classList.remove('active');
        document.querySelector('.tab-content.active').classList.remove('active');
        this.classList.add('active');
        document.getElementById(this.dataset.tab).classList.add('active');
        currentTab=this.dataset.tab;
        generateQR();
    };
});

// 入力変更時に再生成
document.querySelectorAll('input,textarea,select').forEach(el=>{
    el.addEventListener('input',generateQR);
    el.addEventListener('change',generateQR);
});

generateQR();
renderHistory();
</script>
</body>
</html>
