<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Matrix Rain - マトリックス</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden}
.back{position:fixed;top:20px;left:20px;color:#0f0;text-decoration:none;font-size:1.5rem;z-index:100;opacity:0.7;transition:opacity 0.3s;font-family:monospace}
.back:hover{opacity:1}
canvas{display:block}
.ctrl{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,20,0,0.8);padding:15px 25px;border-radius:10px;display:flex;gap:15px;z-index:10;border:1px solid #0f0}
.ctrl label{font-family:monospace;font-size:0.85rem;color:#0f0;display:flex;align-items:center;gap:8px}
.ctrl input[type=range]{width:80px;-webkit-appearance:none;height:4px;background:#030;border-radius:2px}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:#0f0;border-radius:50%;cursor:pointer}
.ctrl select{background:#010;color:#0f0;border:1px solid #0f0;padding:5px 10px;border-radius:4px;font-family:monospace}
</style>
</head>
<body>
<a href="../" class="back">← EXIT</a>
<canvas id="cv"></canvas>
<div class="ctrl">
<label>速度<input type="range" id="speed" min="20" max="100" value="50"></label>
<label>密度<input type="range" id="density" min="5" max="30" value="15"></label>
<label>文字<select id="charset">
<option value="katakana">カタカナ</option>
<option value="binary">バイナリ</option>
<option value="hex">16進数</option>
<option value="kanji">漢字</option>
</select></label>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,columns,drops=[],speed=50,density=15,charset='katakana';
const charsets={
katakana:'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン',
binary:'01',
hex:'0123456789ABCDEF',
kanji:'日月火水木金土山川田中村森林海空雲雨風雷電光闇夢幻'
};
const fontSize=18;

function resize(){
W=cv.width=innerWidth;H=cv.height=innerHeight;
columns=Math.floor(W/fontSize);
drops=[];
for(let i=0;i<columns;i++)drops[i]=Math.random()*-100;
}
resize();window.onresize=resize;

document.getElementById('speed').oninput=function(){speed=+this.value};
document.getElementById('density').oninput=function(){density=+this.value;resize()};
document.getElementById('charset').onchange=function(){charset=this.value};

function getChar(){
const chars=charsets[charset];
return chars[Math.floor(Math.random()*chars.length)];
}

function draw(){
ctx.fillStyle='rgba(0,0,0,0.05)';
ctx.fillRect(0,0,W,H);
ctx.font=fontSize+'px monospace';
for(let i=0;i<columns;i++){
if(Math.random()*100<density){
const y=drops[i]*fontSize;
// グロー効果
ctx.shadowBlur=15;
ctx.shadowColor='#0f0';
// 先頭は白く
ctx.fillStyle=y>H-fontSize*3?'#fff':'#0f0';
ctx.fillText(getChar(),i*fontSize,y);
ctx.shadowBlur=0;
// 徐々に暗く
for(let j=1;j<5;j++){
ctx.fillStyle=`rgba(0,${255-j*40},0,${1-j*0.2})`;
ctx.fillText(getChar(),i*fontSize,y-j*fontSize);
}
}
drops[i]++;
if(drops[i]*fontSize>H&&Math.random()>0.975)drops[i]=0;
}
setTimeout(()=>requestAnimationFrame(draw),100-speed);
}
draw();
</script>
</body>
</html>
