<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カウンター - Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>🔢 カウンター</h1>
    
    <div class="counter-container">
        <div class="main-counter" id="tap-counter">
            <div class="counter-value" id="counter-value">0</div>
            <div class="counter-label" id="counter-label">タップでカウント</div>
            <div class="goal-progress">
                <div class="goal-fill" id="goal-fill" style="width: 0%"></div>
            </div>
            <div class="goal-text" id="goal-text">目標: 100</div>
        </div>
        
        <div class="counter-buttons">
            <button class="count-btn minus" onclick="decrement()">−</button>
            <button class="count-btn plus" onclick="increment()">＋</button>
        </div>
        
        <div class="controls">
            <button class="ctrl-btn" onclick="resetCounter()">🔄 リセット</button>
            <button class="ctrl-btn" onclick="toggleSound()">🔊 サウンド</button>
            <button class="ctrl-btn" onclick="toggleVibration()">📳 バイブ</button>
        </div>
        
        <div class="settings">
            <h3>⚙️ 設定</h3>
            <div class="setting-row">
                <label>目標値</label>
                <input type="number" id="goal-input" value="100" min="1">
            </div>
            <div class="setting-row">
                <label>ステップ</label>
                <input type="number" id="step-input" value="1" min="1">
            </div>
            <div class="setting-row">
                <label>ラベル</label>
                <input type="text" id="label-input" value="カウント" style="width: 150px">
            </div>
        </div>
        
        <div class="multi-counters">
            <div class="mini-counter">
                <div class="value" id="mini-1">0</div>
                <div class="label">カウンター1</div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="miniDecrement(1)">−</button>
                    <button class="mini-btn" onclick="miniIncrement(1)">＋</button>
                </div>
            </div>
            <div class="mini-counter">
                <div class="value" id="mini-2">0</div>
                <div class="label">カウンター2</div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="miniDecrement(2)">−</button>
                    <button class="mini-btn" onclick="miniIncrement(2)">＋</button>
                </div>
            </div>
            <div class="mini-counter">
                <div class="value" id="mini-3">0</div>
                <div class="label">カウンター3</div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="miniDecrement(3)">−</button>
                    <button class="mini-btn" onclick="miniIncrement(3)">＋</button>
                </div>
            </div>
            <div class="mini-counter">
                <div class="value" id="mini-4">0</div>
                <div class="label">カウンター4</div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="miniDecrement(4)">−</button>
                    <button class="mini-btn" onclick="miniIncrement(4)">＋</button>
                </div>
            </div>
        </div>
        
        <div class="history">
            <h3>📊 履歴</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
