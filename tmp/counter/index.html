<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カウンター - Counter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            text-decoration: none;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            z-index: 100;
        }
        .back-link:hover { background: rgba(0,0,0,0.3); }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }
        
        .counter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            width: 100%;
            max-width: 400px;
        }
        
        .main-counter {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            width: 100%;
        }
        
        .counter-value {
            font-size: 6rem;
            font-weight: bold;
            text-shadow: 3px 3px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        
        .counter-value.bump {
            transform: scale(1.1);
        }
        
        .counter-label {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .goal-progress {
            width: 100%;
            height: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .goal-fill {
            height: 100%;
            background: #fff;
            border-radius: 6px;
            transition: width 0.3s;
        }
        
        .goal-text {
            font-size: 0.9rem;
            margin-top: 8px;
            opacity: 0.8;
        }
        
        .counter-buttons {
            display: flex;
            gap: 20px;
        }
        
        .count-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .count-btn.plus {
            background: #fff;
            color: #ff6b6b;
        }
        
        .count-btn.minus {
            background: rgba(255,255,255,0.3);
            color: #fff;
        }
        
        .count-btn:hover {
            transform: scale(1.1);
        }
        
        .count-btn:active {
            transform: scale(0.95);
        }
        
        .tap-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .ctrl-btn {
            padding: 12px 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        
        .ctrl-btn:hover { background: rgba(255,255,255,0.3); }
        
        .settings {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
        }
        
        .settings h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .setting-row:last-child { margin-bottom: 0; }
        
        .setting-row label {
            font-size: 0.9rem;
        }
        
        .setting-row input {
            width: 100px;
            padding: 8px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            font-size: 1rem;
        }
        
        .multi-counters {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }
        
        .mini-counter {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }
        
        .mini-counter .value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .mini-counter .label {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .mini-counter .mini-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        
        .mini-counter .mini-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.3);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .history {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history h3 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.85rem;
        }
        
        .vibrate {
            animation: vibrate 0.1s;
        }
        
        @keyframes vibrate {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
    </style>
</head>
<body>
    <a href="../" class="back-link">← 戻る</a>
    <h1>🔢 カウンター</h1>
    
    <div class="counter-container">
        <div class="main-counter" id="tap-counter">
            <div class="counter-value" id="counter-value">0</div>
            <div class="counter-label" id="counter-label">タップでカウント</div>
            <div class="goal-progress">
                <div class="goal-fill" id="goal-fill" style="width: 0%"></div>
            </div>
            <div class="goal-text" id="goal-text">目標: 100</div>
        </div>
        
        <div class="counter-buttons">
            <button class="count-btn minus" onclick="decrement()">−</button>
            <button class="count-btn plus" onclick="increment()">＋</button>
        </div>
        
        <div class="controls">
            <button class="ctrl-btn" onclick="resetCounter()">🔄 リセット</button>
            <button class="ctrl-btn" onclick="toggleSound()">🔊 サウンド</button>
            <button class="ctrl-btn" onclick="toggleVibration()">📳 バイブ</button>
        </div>
        
        <div class="settings">
            <h3>⚙️ 設定</h3>
            <div class="setting-row">
                <label>目標値</label>
                <input type="number" id="goal-input" value="100" min="1">
            </div>
            <div class="setting-row">
                <label>ステップ</label>
                <input type="number" id="step-input" value="1" min="1">
            </div>
            <div class="setting-row">
                <label>ラベル</label>
                <input type="text" id="label-input" value="カウント" style="width: 150px">
            </div>
        </div>
        
        <div class="multi-counters">
            <div class="mini-counter">
                <div class="value" id="mini-1">0</div>
                <div class="label">カウンター1</div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="miniDecrement(1)">−</button>
                    <button class="mini-btn" onclick="miniIncrement(1)">＋</button>
                </div>
            </div>
            <div class="mini-counter">
                <div class="value" id="mini-2">0</div>
                <div class="label">カウンター2</div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="miniDecrement(2)">−</button>
                    <button class="mini-btn" onclick="miniIncrement(2)">＋</button>
                </div>
            </div>
            <div class="mini-counter">
                <div class="value" id="mini-3">0</div>
                <div class="label">カウンター3</div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="miniDecrement(3)">−</button>
                    <button class="mini-btn" onclick="miniIncrement(3)">＋</button>
                </div>
            </div>
            <div class="mini-counter">
                <div class="value" id="mini-4">0</div>
                <div class="label">カウンター4</div>
                <div class="mini-btns">
                    <button class="mini-btn" onclick="miniDecrement(4)">−</button>
                    <button class="mini-btn" onclick="miniIncrement(4)">＋</button>
                </div>
            </div>
        </div>
        
        <div class="history">
            <h3>📊 履歴</h3>
            <div id="history-list"></div>
        </div>
    </div>

    <script>
        let count = 0;
        let goal = 100;
        let step = 1;
        let soundEnabled = true;
        let vibrationEnabled = true;
        let miniCounts = [0, 0, 0, 0];
        let history = [];
        
        // 音声
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(frequency = 800, duration = 0.1) {
            if (!soundEnabled) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
        
        function vibrate(pattern = [50]) {
            if (vibrationEnabled && navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }
        
        function updateDisplay() {
            const valueEl = document.getElementById('counter-value');
            valueEl.textContent = count;
            valueEl.classList.add('bump');
            setTimeout(() => valueEl.classList.remove('bump'), 100);
            
            const progress = Math.min(100, (count / goal) * 100);
            document.getElementById('goal-fill').style.width = `${progress}%`;
            document.getElementById('goal-text').textContent = `目標: ${count} / ${goal}`;
            
            if (count >= goal) {
                document.getElementById('goal-text').textContent = '🎉 目標達成！';
            }
            
            // ローカルストレージに保存
            localStorage.setItem('counter-value', count);
        }
        
        function increment() {
            count += step;
            playSound(880);
            vibrate([30]);
            updateDisplay();
            addHistory(`+${step}`);
        }
        
        function decrement() {
            count = Math.max(0, count - step);
            playSound(440);
            vibrate([20, 20, 20]);
            updateDisplay();
            addHistory(`-${step}`);
        }
        
        function resetCounter() {
            if (confirm('カウンターをリセットしますか？')) {
                count = 0;
                playSound(220, 0.3);
                vibrate([100]);
                updateDisplay();
                addHistory('リセット');
            }
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            playSound(soundEnabled ? 1000 : 500);
        }
        
        function toggleVibration() {
            vibrationEnabled = !vibrationEnabled;
            vibrate([100, 50, 100]);
        }
        
        function miniIncrement(n) {
            miniCounts[n - 1]++;
            document.getElementById(`mini-${n}`).textContent = miniCounts[n - 1];
            playSound(660);
            vibrate([20]);
            localStorage.setItem(`mini-counter-${n}`, miniCounts[n - 1]);
        }
        
        function miniDecrement(n) {
            miniCounts[n - 1] = Math.max(0, miniCounts[n - 1] - 1);
            document.getElementById(`mini-${n}`).textContent = miniCounts[n - 1];
            playSound(330);
            vibrate([15]);
            localStorage.setItem(`mini-counter-${n}`, miniCounts[n - 1]);
        }
        
        function addHistory(action) {
            const now = new Date();
            const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            history.unshift({ time, action, value: count });
            if (history.length > 50) history.pop();
            
            renderHistory();
        }
        
        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = history.slice(0, 10).map(h => `
                <div class="history-item">
                    <span>${h.time}</span>
                    <span>${h.action}</span>
                    <span>→ ${h.value}</span>
                </div>
            `).join('');
        }
        
        // イベントリスナー
        document.getElementById('tap-counter').addEventListener('click', increment);
        
        document.getElementById('goal-input').addEventListener('change', e => {
            goal = parseInt(e.target.value) || 100;
            updateDisplay();
        });
        
        document.getElementById('step-input').addEventListener('change', e => {
            step = parseInt(e.target.value) || 1;
        });
        
        document.getElementById('label-input').addEventListener('input', e => {
            document.getElementById('counter-label').textContent = e.target.value || 'タップでカウント';
        });
        
        // キーボードショートカット
        document.addEventListener('keydown', e => {
            if (e.key === '+' || e.key === '=' || e.key === 'ArrowUp') {
                e.preventDefault();
                increment();
            }
            if (e.key === '-' || e.key === 'ArrowDown') {
                e.preventDefault();
                decrement();
            }
            if (e.key === 'r') {
                resetCounter();
            }
        });
        
        // 初期化
        count = parseInt(localStorage.getItem('counter-value')) || 0;
        for (let i = 1; i <= 4; i++) {
            miniCounts[i - 1] = parseInt(localStorage.getItem(`mini-counter-${i}`)) || 0;
            document.getElementById(`mini-${i}`).textContent = miniCounts[i - 1];
        }
        updateDisplay();
    </script>
</body>
</html>
