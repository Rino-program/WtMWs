<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Snake Game - スネークゲーム</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.back{position:fixed;top:15px;left:15px;color:#fff;text-decoration:none;font-size:1.3rem;z-index:100;opacity:0.7}
.back:hover{opacity:1}
h1{font-size:clamp(1.3rem,4vw,1.8rem);margin-bottom:15px;background:linear-gradient(90deg,#43e97b,#38f9d7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:flex;gap:30px;margin-bottom:15px}
.stat{text-align:center}
.stat-val{font-size:1.8rem;color:#43e97b;font-weight:bold}
.stat-label{font-size:0.75rem;color:#aaa}
canvas{border:3px solid #43e97b;border-radius:10px;max-width:95vw;touch-action:none}
.controls{display:flex;gap:10px;margin-top:20px}
.controls button{background:rgba(255,255,255,0.1);border:2px solid #43e97b;color:#fff;width:50px;height:50px;border-radius:10px;font-size:1.5rem;cursor:pointer}
.controls button:active{background:rgba(67,233,123,0.3)}
.touch-controls{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%)}
.touch-pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:5px}
.touch-btn{background:rgba(67,233,123,0.2);border:2px solid #43e97b;border-radius:10px;color:#fff;font-size:1.5rem;display:flex;align-items:center;justify-content:center}
.touch-btn:active{background:rgba(67,233,123,0.5)}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:50;flex-direction:column;align-items:center;justify-content:center}
.overlay.show{display:flex}
.overlay h2{font-size:2rem;color:#43e97b;margin-bottom:20px}
.overlay p{font-size:1.2rem;color:#aaa;margin-bottom:30px}
.overlay button{background:linear-gradient(135deg,#43e97b,#38f9d7);border:none;color:#000;padding:12px 30px;border-radius:10px;font-size:1rem;cursor:pointer;font-weight:bold}
@media(pointer:coarse){.touch-controls{display:block}}
</style>
</head>
<body>
<a href="../" class="back">← 戻る</a>
<h1>🐍 スネークゲーム</h1>
<div class="stats">
<div class="stat"><div class="stat-val" id="score">0</div><div class="stat-label">スコア</div></div>
<div class="stat"><div class="stat-val" id="best">0</div><div class="stat-label">ベスト</div></div>
<div class="stat"><label style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="font-size:0.7rem;color:#aaa">速度:</span><input type="range" id="speedCtrl" min="50" max="200" step="10" value="120" style="width:80px"></label></div>
</div>
<canvas id="cv" width="400" height="400"></canvas>
<div class="touch-controls">
<div class="touch-pad">
<div></div><div class="touch-btn" data-d="up">↑</div><div></div>
<div class="touch-btn" data-d="left">←</div><div></div><div class="touch-btn" data-d="right">→</div>
<div></div><div class="touch-btn" data-d="down">↓</div><div></div>
</div>
</div>
<div class="overlay" id="overlay">
<h2 id="overlayTitle">🐍 スネーク</h2>
<p id="overlayText">タップまたはSpaceでスタート</p>
<button onclick="startGame()">スタート</button>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const grid=20,cols=cv.width/grid,rows=cv.height/grid;
let snake,dir,food,score,best=+localStorage.getItem('snakeBest')||0,gameLoop,speed=120,baseSpeed=120;

document.getElementById('best').textContent=best;
document.getElementById('speedCtrl').oninput=function(){baseSpeed=+this.value;speed=baseSpeed};

function init(){
snake=[{x:10,y:10}];
dir={x:1,y:0};
score=0;
speed=baseSpeed;
placeFood();
document.getElementById('score').textContent=score;
}

function placeFood(){
do{
food={x:Math.random()*cols|0,y:Math.random()*rows|0};
}while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function draw(){
ctx.fillStyle='#0f0c29';
ctx.fillRect(0,0,cv.width,cv.height);
// Grid
ctx.strokeStyle='rgba(67,233,123,0.1)';
for(let i=0;i<=cols;i++){ctx.beginPath();ctx.moveTo(i*grid,0);ctx.lineTo(i*grid,cv.height);ctx.stroke()}
for(let i=0;i<=rows;i++){ctx.beginPath();ctx.moveTo(0,i*grid);ctx.lineTo(cv.width,i*grid);ctx.stroke()}
// Food
ctx.fillStyle='#f5576c';
ctx.beginPath();
ctx.arc(food.x*grid+grid/2,food.y*grid+grid/2,grid/2-2,0,Math.PI*2);
ctx.fill();
// Snake
snake.forEach((s,i)=>{
const alpha=1-i/(snake.length+5);
ctx.fillStyle=`rgba(67,233,123,${alpha})`;
ctx.fillRect(s.x*grid+1,s.y*grid+1,grid-2,grid-2);
if(i===0){
ctx.fillStyle='#fff';
const ex=dir.x>0?6:dir.x<0?-6:0;
const ey=dir.y>0?6:dir.y<0?-6:0;
ctx.beginPath();
ctx.arc(s.x*grid+grid/2+ex/2-3,s.y*grid+grid/2+ey/2-3,2,0,Math.PI*2);
ctx.arc(s.x*grid+grid/2+ex/2+3,s.y*grid+grid/2+ey/2-3,2,0,Math.PI*2);
ctx.fill();
}
});
}

function update(){
const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
gameOver();return;
}
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){
score+=10;
document.getElementById('score').textContent=score;
placeFood();
if(speed>50)speed-=2;
}else{
snake.pop();
}
draw();
}

function gameOver(){
clearInterval(gameLoop);
if(score>best){
best=score;
localStorage.setItem('snakeBest',best);
document.getElementById('best').textContent=best;
}
document.getElementById('overlayTitle').textContent='💀 ゲームオーバー';
document.getElementById('overlayText').textContent=`スコア: ${score}`;
document.getElementById('overlay').classList.add('show');
}

function startGame(){
document.getElementById('overlay').classList.remove('show');
init();
draw();
clearInterval(gameLoop);
gameLoop=setInterval(update,speed);
}

function setDir(d){
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const nd=dirs[d];
if(nd&&!(dir.x===-nd.x&&dir.y===-nd.y))dir=nd;
}

document.addEventListener('keydown',e=>{
if(e.code==='Space'&&document.getElementById('overlay').classList.contains('show')){
startGame();return;
}
const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'};
if(map[e.code])setDir(map[e.code]);
});

document.querySelectorAll('.touch-btn').forEach(btn=>{
btn.ontouchstart=btn.onmousedown=function(e){
e.preventDefault();
setDir(this.dataset.d);
};
});

// Swipe
let tx,ty;
cv.ontouchstart=e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY};
cv.ontouchend=e=>{
const dx=e.changedTouches[0].clientX-tx;
const dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)>Math.abs(dy)){
setDir(dx>0?'right':'left');
}else{
setDir(dy>0?'down':'up');
}
};

init();draw();
document.getElementById('overlay').classList.add('show');
</script>
</body>
</html>
