<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>Snake Game - スネークゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../" class="back">← 戻る</a>
    <h1>🐍 スネークゲーム</h1>
    <div class="game-options">
        <select id="mapSelect">
            <option value="classic">クラシック</option>
            <option value="walls">壁なしモード</option>
            <option value="maze">迷路モード</option>
            <option value="arena">アリーナ</option>
        </select>
        <select id="skinSelect">
            <option value="neon">ネオン</option>
            <option value="classic">クラシック</option>
            <option value="pixel">ピクセル</option>
            <option value="rainbow">レインボー</option>
        </select>
        <select id="difficultySelect">
            <option value="easy">イージー</option>
            <option value="normal" selected>ノーマル</option>
            <option value="hard">ハード</option>
        </select>
    </div>
    <div class="stats">
        <div class="stat"><div class="stat-val" id="score">0</div><div class="stat-label">スコア</div></div>
        <div class="stat"><div class="stat-val" id="best">0</div><div class="stat-label">ベスト</div></div>
        <div class="stat"><div class="stat-val" id="combo">x1</div><div class="stat-label">コンボ</div></div>
        <div class="stat"><div class="stat-val" id="length">1</div><div class="stat-label">長さ</div></div>
    </div>
    <div class="powerup-indicator" id="powerupIndicator"></div>
    <canvas id="cv" width="400" height="400"></canvas>
    <div class="touch-controls">
        <div class="touch-pad">
            <div></div><div class="touch-btn" data-d="up">↑</div><div></div>
            <div class="touch-btn" data-d="left">←</div><div class="touch-btn" data-d="pause">⏸</div><div class="touch-btn" data-d="right">→</div>
            <div></div><div class="touch-btn" data-d="down">↓</div><div></div>
        </div>
    </div>
    <div class="combo" id="comboDisplay"></div>
    <div class="achievements" id="achievements"></div>
    <div class="overlay" id="overlay">
        <h2 id="overlayTitle">🐍 スネーク</h2>
        <p id="overlayText">タップまたはSpaceでスタート</p>
        <div class="overlay-stats" id="overlayStats"></div>
        <div>
            <button onclick="startGame()">スタート</button>
            <button class="secondary-btn" onclick="toggleSound()">🔊 サウンド</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
